<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#286443"><title>النشاط الثالث: مجتمع النحل</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#23352b;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.wrap{max-width:780px;margin:auto;padding:18px}.head{background:#286443;color:white;padding:22px;border-radius:18px;text-align:center;box-shadow:0 5px 14px #183c2822}.head h1{font-size:23px;margin:0 0 6px}.head p{margin:0}.progress{height:8px;background:#e1e7df;border-radius:9px;margin:18px 0;overflow:hidden}.bar{height:100%;width:5%;background:#78a66b;transition:width .2s}.card{background:white;border:1px solid #e4e6dc;border-radius:18px;padding:22px;box-shadow:0 4px 14px #263d2910}.num{color:#54835b;font-weight:bold}.question{font-size:20px;font-weight:700;margin:8px 0 18px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid #dfe5dc;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer;background:#fff}.option:has(input:checked){border-color:#428258;background:#f1f7ef}.option input{margin-top:7px;accent-color:#286443;flex-shrink:0}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:bold;font-size:16px;cursor:pointer}.primary{background:#286443;color:white}.secondary{background:#e9eee7;color:#294734}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.result{text-align:center}.score{font-size:32px;font-weight:bold;color:#286443}.review{text-align:right;margin-top:18px}.review article{padding:12px;border-bottom:1px solid #e3e7df}.correct{color:#247244}.wrong{color:#b13e32}.small{font-size:13px;color:#647568}
</style></head><body><main class="wrap"><header class="head"><h1>النشاط الثالث: أحلّل نظام مجتمع النحل وكيفية عمله</h1><p>اختبار إلكتروني · 20 سؤالًا</p></header><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="quiz"><div class="num" id="num"></div><div class="question" id="question"></div><div id="options"></div><div class="actions"><button class="btn secondary" id="prev">السابق</button><button class="btn primary" id="next">التالي</button></div><p class="small">حدّد إجابة واحدة لكل سؤال.</p></section><section class="card result hidden" id="result"><h2>انتهى الاختبار!</h2><p>نتيجتك</p><div class="score" id="score"></div><p id="message"></p><div class="actions" style="justify-content:center"><button class="btn primary" id="reviewBtn">مراجعة الإجابات</button><button class="btn secondary" id="retry">إعادة الاختبار</button></div><div class="review hidden" id="review"></div></section></main>
<script>
const qs=[["مسكن النحل في الطبيعة",["يعيش في تجاويف الأشجار والصخور، ويمكن أن يبني فيها أعشاشًا تضم الأقراص الشمعية وأفراد المجتمع.","يعيش داخل الأزهار، ويتخذ من بتلاتها مسكنًا دائمًا يضع فيه البيوض ويخزن الغذاء.","يعيش فوق أوراق النباتات، ويصنع منها أقراصًا شمعية لتربية اليرقات وتخزين العسل.","يعيش داخل جحور يحفرها في التربة، ويستعملها دائمًا لتربية اليرقات وتخزين الغذاء."],0],["النخاريب ووظائفها",["فتحات مدخل الخلية التي تسمح بدخول النحل وخروجه فقط.","قنوات داخل الخلية تسمح بانتقال النحل بين الأقراص.","خلايا سداسية الشكل مبنية من الشمع، تُخزَّن فيها مواد غذائية وتُربّى فيها اليرقات.","تجاويف طبيعية في الأشجار والصخور تستعمل لتبادل الغذاء."],2],["ذكر النحل",["يمتلك أرجلًا خلفية مزودة بسلال لجمع حبوب اللقاح.","يمتلك بطنًا مهيأً لوضع البيوض ورعاية اليرقات.","يتولى جمع الغذاء وتنظيف الخلية وحراسة مدخلها.","له عينان مركبتان كبيرتان نسبيًا، ودوره التناسلي تلقيح الملكة أثناء رحلة التزاوج."],3],["النحلة العاملة",["تضع معظم البيوض داخل النخاريب.","تمتلك أرجلًا خلفية مهيأة لجمع حبوب اللقاح، وتساهم في جمع الغذاء ورعاية اليرقات والتنظيف والتهوية والدفاع.","تقتصر مهمتها على تلقيح الملكة أثناء رحلة التزاوج.","تتحول إلى ملكة كلما غابت الملكة عن الخلية."],1],["ملكة النحل",["ذكر كبير الحجم مسؤول عن حراسة الخلية.","عاملة عقيمة وظيفيًا تقتصر مهمتها على جمع حبوب اللقاح.","جسمها أكبر وبطنها أطول نسبيًا؛ وهي الأنثى الخصبة الأساسية التي تضع البيوض.","تتولى تهوية الخلية وتنظيفها دون وضع البيوض."],2],["الدفاع عن الخلية",["تغادر العاملات الخلية نهائيًا عند اقتراب أي متطفل.","تتولى الذكور وحدها حراسة المدخل.","تدافع الملكة عن الخلية بجمع حبوب اللقاح.","تحرس العاملات مدخل الخلية وتواجه المتطفلات، مما يحمي الحضنة ومخزون الغذاء."],3],["اختفاء الذكور بعد تزاوج الملكة",["يمكن أن يستمر إنتاج البيوض الملقحة باستعمال الحيوانات المنوية المخزنة رغم غياب الذكور.","يتوقف وضع البيوض مباشرة لأن الملكة تحتاج إلى ذكر في كل مرة.","تتحول العاملات جميعًا إلى ملكات.","تتوقف العاملات عن جمع الغذاء."],0],["التواصل الكيميائي عند الملكة",["إصدار أصوات مرتفعة توجه بها العاملات.","إنتاج الشمع الذي يمنع العاملات من الطيران.","تغيير لون جسمها لإعطاء الإشارات.","إفراز مواد كيميائية تسمى الفيرومونات، تنظّم سلوك العاملات وتحدّ من نمو مبايضهن وتربية ملكات جديدة في الظروف العادية."],3],["رقصة الاهتزاز",["رقصة هدفها طرد الذكور من الخلية.","رقصة مميزة، خاصة رقصة الاهتزاز على شكل الرقم ثمانية، تنقل معلومات عن اتجاه مصدر الغذاء وبعده عن الخلية.","حركة تستعملها الملكة لوضع البيوض.","حركة تقوم بها اليرقات للحصول على الغذاء."],1],["التبادل الغذائي",["تخزين الغذاء في التربة خارج الخلية.","نقل الغذاء من الملكة إلى الذكور فقط.","إلقاء الغذاء خارج الخلية لتلتقطه العاملات.","التبادل الغذائي مباشرة من الفم إلى الفم، ما يسمح بنقل الغذاء بين أفراد الخلية."],3],["الدور الأساسي للملكة",["حراسة مدخل الخلية طوال اليوم.","جمع حبوب اللقاح ورحيق الأزهار.","وضع البيوض، وقد تصل وتيرة وضعها في الظروف الملائمة إلى نحو 2000 بيضة يوميًا أو أكثر في ذروة الموسم.","صنع الأقراص الشمعية وتنظيف الخلية."],2],["دور الذكر والملكة في التكاثر",["الذكر يساهم في تلقيح الملكة أثناء رحلة التزاوج، والملكة تضع البيوض داخل النخاريب.","الذكر يضع البيوض والملكة تجمع الغذاء.","العاملات هي المسؤولة عن تلقيح الملكة ووضع كل البيوض.","الملكة تلقح الذكور ثم تغادر الخلية."],0],["تقسيم المهام بين أفراد المجتمع",["تقوم الملكة وحدها بجميع الأعمال داخل الخلية.","تقوم الذكور بجمع الغذاء ورعاية اليرقات وحراسة المدخل.","تقوم كل أفراد المجتمع بالمهمة نفسها دون تقسيم.","تنجز العاملات معظم الأعمال اليومية، كرعاية اليرقات وجمع الغذاء والتنظيف والتهوية والدفاع، ما يلبي حاجات الخلية."],3],["توقف العاملات عن أداء مهامهن",["يزداد إنتاج الغذاء وتتحسن تهوية الخلية.","يختل توازن الخلية بسبب نقص الغذاء وتراجع رعاية اليرقات وضعف التهوية والنظافة، مما يهدد بقاء المجتمع.","لا تتأثر الخلية لأن الملكة تقوم بكل الأعمال.","تتحول جميع العاملات إلى ذكور."],1],["التعاون بين العاملات",["تنافس دائم يمنع تبادل الغذاء.","استقلال كل نحلة عن بقية أفراد المجتمع.","تتوقف العاملات عن التواصل بعد جمع الغذاء.","تعاون وتكامل، وتبادل للغذاء وتوزيع للمهام لتلبية حاجات المجتمع."],3],["غياب الملكة عن وضع البيوض",["يزداد عدد أفراد المجتمع مباشرة.","تتولى الذكور وضع البيوض الملقحة.","يتراجع إنتاج أفراد جديدة وقد يتناقص المجتمع تدريجيًا بسبب غياب الملكة وعدم تعويضها، رغم استمرار العاملات في بعض المهام لفترة.","تتوقف العاملات عن أداء جميع المهام في اللحظة نفسها."],2],["غياب الحراسة عن مدخل الخلية",["قد تتضرر الخلية أو تفقد جزءًا من الغذاء أو تصاب الحضنة، لأن العاملات تحرس وتدافع.","يزداد أمن الخلية تلقائيًا.","تختفي الحاجة إلى العاملات.","تتوقف الملكة عن وضع البيوض فورًا في جميع الحالات."],0],["اختفاء الذكور قبل تزاوج الملكة",["تستطيع الملكة تلقيح نفسها وإنتاج الإناث.","يتعذر تلقيح الملكة، وقد تضع بيوضًا غير ملقحة يمكن أن تعطي ذكورًا، لكن إنتاج الإناث من البيوض الملقحة يتعذر دون تلقيحها.","تتحول كل البيوض إلى ملكات.","لا يؤثر ذلك إطلاقًا في تكاثر المجتمع."],1],["تعريف المجتمع الحيواني",["مجموعة من حيوانات مختلفة الأنواع تعيش منفردة دون تفاعل.","مجموعة من أفراد النوع نفسه تعيش في أماكن متباعدة ولا تتواصل.","مجموعة من النباتات والحيوانات لا تربط بينها علاقات.","مجموعة من أفراد النوع نفسه تعيش في مجال معين وتتفاعل فيما بينها وتؤدي أدوارًا تساهم في استمرار حياتها."],3],["خصائص مجتمع النحل",["عيش كل نحلة منفردة دون تعاون أو تواصل.","قيام الملكة وحدها بجميع وظائف الخلية.","التعاون والتواصل وتقسيم المهام بين الملكة والذكور والعاملات، ما يساعد على تلبية حاجات الخلية واستمرار المجتمع.","اعتماد المجتمع على الذكور وحدها لجمع الغذاء ورعاية اليرقات."],2]];
let index=0, answers=Array(qs.length).fill(null);
const $=id=>document.getElementById(id);
function render(){ $('num').textContent='السؤال '+(index+1)+' من '+qs.length; $('question').textContent=qs[index][0]; $('options').innerHTML=''; qs[index][1].forEach((o,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='answer';input.checked=answers[index]===i;input.addEventListener('change',()=>answers[index]=i);const span=document.createElement('span');span.textContent=['أ','ب','ج','د'][i]+' ـ '+o;label.append(input,span);$('options').append(label)});$('prev').disabled=index===0;$('next').textContent=index===qs.length-1?'إنهاء الاختبار':'التالي';$('bar').style.width=((index+1)/qs.length*100)+'%'}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(answers[index]===null){alert('يرجى تحديد إجابة قبل المتابعة.');return}if(index<qs.length-1){index++;render()}else finish()};
function finish(){let score=answers.reduce((n,a,i)=>n+(a===qs[i][2]?1:0),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=score+' / '+qs.length;$('message').textContent=score>=16?'ممتاز! أحسنت العمل.':score>=10?'عمل جيد، راجع الإجابات لتحسين نتيجتك.':'واصل المراجعة ثم أعد الاختبار.';$('bar').style.width='100%';$('review').classList.add('hidden')}
$('reviewBtn').onclick=()=>{const box=$('review');box.innerHTML='';qs.forEach((q,i)=>{const a=document.createElement('article');const title=document.createElement('strong');title.textContent=(i+1)+'. '+q[0];a.append(title);const p=document.createElement('p');p.className=answers[i]===q[2]?'correct':'wrong';p.textContent='إجابتك: '+(answers[i]===null?'لم تجب':('أبجد'[answers[i]]+' ـ '+q[1][answers[i]]));a.append(p);const c=document.createElement('p');c.className='correct';c.textContent='الإجابة الصحيحة: '+'أبجد'[q[2]]+' ـ '+q[1][q[2]];a.append(c);box.append(a)});box.classList.toggle('hidden')};
$('retry').onclick=()=>{index=0;answers=Array(qs.length).fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
