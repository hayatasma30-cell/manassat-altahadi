function saveCurrent(){const q=questions[current];const x=document.querySelector('input[name="choice"]:checked');if(x)answers[q.n]=x.value;else delete answers[q.n]}
$("prev").onclick=()=>{saveCurrent();current--;render()};$("next").onclick=()=>{saveCurrent();current++;render()};$("finish").onclick=()=>{saveCurrent();if(confirm("هل أنت متأكد من إنهاء الاختبار وإرسال الإجابات؟"))submit()};
async function submit(){if(finished||!attemptId)return;finished=true;if(timerId)clearInterval(timerId);$("finish").disabled=true;try{const d=await api({action:"submit",attempt_id:attemptId,selected_answers:answers,written_answers:{},question_bank:questions.map(q=>({n:q.n,q:q.q,opts:q.opts}))},attemptToken);$("exam").classList.add("hidden");const results=$("results");results.classList.remove("hidden");results.innerHTML='<h2>تم إرسال الاختبار بنجاح</h2><div class="result"><h1>علامتك: '+d.score+' / 20</h1><p>تم تصحيح الأسئلة العشرين آليًا، وكل سؤال عليه نقطة واحدة.</p></div><h3>التصحيح الآلي</h3>'+questions.filter(q=>q.type==="mcq").map(q=>{const chosen=answers[q.n];const isCorrect=chosen!==undefined&&String(chosen)===LETTERS[q.correct];const cardClass=isCorrect?"review-correct":"review-wrong";const chosenIndex=LETTERS.indexOf(chosen);const chosenText=chosenIndex>=0?q.opts[chosenIndex]:chosen||"لم تجب";return '<article class="review-card '+cardClass+'"><strong class="review-title">'+q.n+'. '+q.q+'</strong><p class="review-line"><span class="review-label">إجابتك:</span> '+(chosen?chosen+". "+chosenText:"لم تجب")+'</p><p class="review-line"><span class="review-label">الإجابة الصحيحة:</span> '+LETTERS[q.correct]+'. '+q.opts[q.correct]+'</p><span class="review-status">'+(isCorrect?"✓ إجابة صحيحة":"✗ إجابة خاطئة أو بدون إجابة")+'</span></article>'}).join("")+'<p class="muted">تم حفظ نتيجتك وإجاباتك لدى الأستاذة.</p>';window.scrollTo(0,0)}catch(e){finished=false;$("examError").textContent=e.message+" — لا تغلقي الصفحة، حاولي الإرسال مجددًا.";$("finish").disabled=false}}
</script></body></html>
