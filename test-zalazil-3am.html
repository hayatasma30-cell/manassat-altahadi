<style>

<section class="panel hero"><h1>اختبار الزلازل والتشوهات التكتونية</h1><strong>السنة الثالثة متوسط — علوم الطبيعة والحياة</strong><p class="muted">المدة: 40 دقيقة | الأسئلة: 20 | العلامة النهائية: /20 — جميع الأسئلة اختيار من متعدد</p><p>أدخلي الاسم الكامل كما هو مسجل عند الأستاذة، ثم الرمز الشخصي الممنوح لك.</p><label for="fullName">الاسم الكامل</label><input id="fullName" autocomplete="name" placeholder="الاسم واللقب"><label for="code">الرمز الشخصي</label><input id="code" autocomplete="off" placeholder="ZL3-XXXXXXXXXX"><button id="start">ابدأ الاختبار</button><p id="loginError" class="danger"></p></section>
<section id="exam" class="panel hidden"><div class="row"><strong id="studentLabel"></strong><span class="timer" id="timer">40:00</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="row muted"><span id="count"></span><span>لا تظهر الإجابات الصحيحة قبل الإنهاء</span></div><hr><div id="question"></div><div class="actions"><button class="secondary" id="prev">السابق</button><button id="next">السؤال التالي</button><button id="finish" class="hidden">إنهاء الاختبار</button></div><p id="examError" class="danger"></p></section>

      "السيسموغرام."

const questions=MCQ.map(x=>({...x,type:"mcq"})).sort((a,b)=>a.n-b.n);
const LETTERS=["A","B","C","D"];let current=0,deadline=0,timerId=null,attemptId=null,attemptToken=null,answers={},written={},finished=false;
async function api(payload,token=""){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json",...(token?{"X-Quiz-Token":token}:{})},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"تعذر الاتصال بالخادم.");return d}
const $=id=>document.getElementById(id);
$("start").onclick=async()=>{const full_name=$("fullName").value.trim(),code=$("code").value.trim();$("loginError").textContent="جارٍ التحقق من البيانات…";$("start").disabled=true;try{const d=await api({action:"start",full_name,code});attemptId=d.attempt_id;attemptToken=d.attempt_token;deadline=Date.now()+2400000;$("studentLabel").textContent=d.student.full_name;$("exam").classList.remove("hidden");$("start").disabled=false;render();timerId=setInterval(tick,500);$("loginError").textContent="";window.scrollTo(0,0)}catch(e){$("loginError").textContent=e.message;$("start").disabled=false}};
function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("timer").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left<=0)submit()}
function render(){const q=questions[current];$("count").textContent="السؤال "+(current+1)+" من "+questions.length;$("bar").style.width=((current+1)/questions.length*100)+"%";let h="<h2>"+q.n+". "+q.q+"</h2>";h+='<div>';q.opts.forEach((o,i)=>{h+='<label class="option"><input type="radio" name="choice" value="'+LETTERS[i]+'" '+(answers[q.n]===LETTERS[i]?"checked":"")+' > '+LETTERS[i]+". "+o+"</label>"});h+="</div>";$("question").innerHTML=h;$("prev").classList.toggle("hidden",current===0);$("next").classList.toggle("hidden",current===questions.length-1);$("finish").classList.toggle("hidden",current!==questions.length-1);$("examError").textContent=""}
function saveCurrent(){const q=questions[current];const x=document.querySelector('input[name="choice"]:checked');if(x)answers[q.n]=x.value;else delete answers[q.n]}
$("prev").onclick=()=>{saveCurrent();current--;render()};$("next").onclick=()=>{saveCurrent();current++;render()};$("finish").onclick=()=>{saveCurrent();if(confirm("هل أنت متأكد من إنهاء الاختبار وإرسال الإجابات؟"))submit()};
async function submit(){if(finished||!attemptId)return;finished=true;if(timerId)clearInterval(timerId);$("finish").disabled=true;try{const d=await api({action:"submit",attempt_id:attemptId,selected_answers:answers,written_answers:{}},attemptToken);$("exam").classList.add("hidden");const results=$("results");results.classList.remove("hidden");results.innerHTML='<h2>تم إرسال الاختبار بنجاح</h2><div class="result"><h1>علامتك: '+d.score+' / 20</h1><p>تم تصحيح الأسئلة العشرين آليًا، وكل سؤال عليه نقطة واحدة.</p></div><h3>التصحيح الآلي</h3>'+questions.filter(q=>q.type==="mcq").map(q=>'<p><strong>'+q.n+'. '+q.q+'</strong><br>الإجابة الصحيحة: '+LETTERS[q.correct]+'. '+q.opts[q.correct]+'<br>إجابتك: '+(answers[q.n]||"لم تجب")+'</p>').join("")+'<p class="muted">تم حفظ نتيجتك وإجاباتك لدى الأستاذة.</p>';window.scrollTo(0,0)}catch(e){finished=false;$("examError").textContent=e.message+" — لا تغلقي الصفحة، حاولي الإرسال مجددًا.";$("finish").disabled=false}}
</script></body></html>
