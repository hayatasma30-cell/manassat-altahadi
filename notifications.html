<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>تنبيهاتي | منصة التحدي</title>
<style>body{margin:0;background:#f7f6e9;color:#18382a;font:16px/1.8 Tahoma,Arial}header{background:linear-gradient(120deg,#103f28,#217747);color:#fff;padding:18px}.wrap{max-width:800px;margin:auto;padding:18px}.box,.item{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 5px 0 #dfe8d8}.btn{border:1px solid #cbdcc8;border-radius:12px;padding:10px 14px;background:#fff;color:#14532d;box-shadow:0 4px 0 #bfd0b9;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#217747;color:#fff}.hide{display:none!important}.field{display:block;margin:10px 0 4px;font-weight:bold}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit}textarea{min-height:90px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.tag{background:#eaf5e8;border-radius:20px;padding:4px 10px}.status{background:#f3f5eb;padding:8px}</style></head>
<body><header><b>🔔 تنبيهاتي</b><div>أحدث الإعلانات والتحديثات في فضاء التلميذ</div></header><main class="wrap"><div class="toolbar"><button class="btn" onclick="location.href='student-space.html'">← العودة إلى فضائي</button><button class="btn" onclick="location.href='daily-science.html'">💡 تعلّم اليوم</button></div>
<section class="box hide" id="compose"><h2>📣 إرسال تنبيه للتلاميذ</h2><label class="field">عنوان التنبيه</label><input id="title" placeholder="إضافة اختبار إلكتروني جديد"><label class="field">محتوى التنبيه</label><textarea id="message" placeholder="اكتبي ما الجديد وما المطلوب من التلاميذ…"></textarea><label class="field">نوع التنبيه</label><select id="category"><option>عام</option><option>اختبار إلكتروني</option><option>اشتراكات</option><option>نتائج</option><option>معلومة اليوم</option><option>إعلان</option></select><label class="field">المستوى المستهدف</label><select id="level"><option value="">جميع التلاميذ</option><option>الأولى متوسط</option><option>الثانية متوسط</option><option>الثالثة متوسط</option><option>الرابعة متوسط</option><option>الأولى ثانوي — علوم تجريبية</option></select><button class="btn primary" id="send">نشر التنبيه</button><p id="status" class="status"></p></section>
<section class="box"><h2>📬 أحدث التنبيهات</h2><div id="items">جارٍ التحميل…</div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",forceStudent=new URLSearchParams(location.search).get("role")==="student",token=forceStudent?(localStorage.getItem("tahadi_student_session")||""):(localStorage.getItem("tahadi_teacher_token")||localStorage.getItem("tahadi_student_session")||""),teacher=!forceStudent&&!!localStorage.getItem("tahadi_teacher_token"),$=id=>document.getElementById(id);
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){try{const a=(await call("notification_list")).items||[];$("items").innerHTML=a.length?a.map(x=>'<article class="item"><span class="tag">'+esc(x.category)+' • '+new Date(x.created_at).toLocaleDateString("ar-DZ")+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.message)+'</p></article>').join(""):"لا توجد تنبيهات حاليًا."}catch(e){$("items").textContent=e.message}}
$("send").onclick=async()=>{try{const d=await call("notification_create",{title:$("title").value,message:$("message").value,category:$("category").value,target_level:$("level").value});$("status").textContent=d.message;$("title").value="";$("message").value="";await load()}catch(e){$("status").textContent=e.message}};
if(teacher)$("compose").classList.remove("hide");load();
</script></body></html>
