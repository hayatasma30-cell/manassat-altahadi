<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>تنبيهاتي | منصة التحدي</title>
<style>body{margin:0;background:#f7f6e9;color:#18382a;font:16px/1.8 Tahoma,Arial}header{background:linear-gradient(120deg,#103f28,#217747);color:#fff;padding:18px}.wrap{max-width:800px;margin:auto;padding:18px}.box,.item{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 5px 0 #dfe8d8}.btn{border:1px solid #cbdcc8;border-radius:12px;padding:10px 14px;background:#fff;color:#14532d;box-shadow:0 4px 0 #bfd0b9;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#217747;color:#fff}.hide{display:none!important}.field{display:block;margin:10px 0 4px;font-weight:bold}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit}textarea{min-height:90px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-start}.toolbar .btn{width:auto;max-width:100%;min-width:0;min-height:42px;padding:8px 14px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;box-sizing:border-box;flex:0 1 auto}.tag{background:#eaf5e8;border-radius:14px;padding:5px 10px;display:inline-flex;align-items:center;justify-content:center;line-height:1.6}.status{background:#f3f5eb;padding:8px}#dailyButton{display:none!important}.readers{margin-top:14px;padding:12px;border-radius:14px;background:#eef6eb;color:#174c35;line-height:1.8}.readers p{margin:6px 0 0;overflow-wrap:anywhere} .item{padding:18px;margin:14px 0;border-radius:20px}.item h3{margin:14px 0 8px;line-height:1.6}.item>p{margin:8px 0;overflow-wrap:anywhere}.status-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-items:stretch;margin-top:14px}.read-state,.preview-note{margin:0;min-width:0;min-height:64px;padding:9px 11px;border-radius:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;box-sizing:border-box}.read-state{background:#f7f9f3;border:1px solid #e0e8dc}.read-state strong{margin-left:2px}.preview-note{width:100%;background:#eaf5e8;line-height:1.6}.read-confirm{display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:center;text-align:center;white-space:normal;line-height:1.6;margin-top:14px;padding:11px 14px;background:#217747;color:#fff;border:1px solid #17613a;border-radius:12px;box-shadow:0 4px 0 #b9d2bd;font:inherit;font-weight:bold;cursor:pointer}.read-confirm:disabled{opacity:.9;cursor:default}.read-confirm.done{background:#eaf5e8;color:#174c35;border-color:#d5e6d0;box-shadow:none}@media(max-width:480px){.wrap{padding:14px}.box,.item{padding:14px;border-radius:18px}.status-row{gap:7px}.read-state,.preview-note{font-size:14px;padding:8px 7px;min-height:60px}.toolbar{gap:8px}.toolbar .btn{padding:8px 11px;font-size:15px}.btn{padding:9px 10px}}</style></head>
<body><header><b>🔔 <span id="pageHeading">تنبيهاتي</span></b><div id="pageSubtitle">أحدث الإعلانات والتحديثات في فضائك التعليمي</div></header><main class="wrap"><div class="toolbar"><button class="btn" id="backButton" type="button">← العودة إلى فضائي</button><button class="btn" id="dailyButton" type="button">💡 تعلّم اليوم</button></div>
<section class="box hide" id="compose"><h2>📣 إرسال تنبيه للتلاميذ</h2><label class="field" for="title">عنوان التنبيه</label><input id="title" placeholder="إضافة اختبار إلكتروني جديد"><label class="field" for="message">محتوى التنبيه</label><textarea id="message" placeholder="اكتبي ما الجديد وما المطلوب من التلاميذ…"></textarea><label class="field" for="level">المستوى المستهدف</label><select id="level"><option value="">جميع المستويات</option><option>السنة الأولى متوسط</option><option>السنة الثانية متوسط</option><option>السنة الثالثة متوسط</option><option>السنة الرابعة متوسط</option><option>السنة الأولى ثانوي — جذع مشترك علوم وتكنولوجيا</option><option>السنة الثانية ثانوي — علوم تجريبية</option><option>السنة الثالثة ثانوي — علوم تجريبية</option></select><button class="btn primary" id="send" type="button">نشر التنبيه</button><p id="status" class="status" role="status"></p></section>
<section class="box"><h2>📬 أحدث التنبيهات</h2><div id="items">جارٍ التحميل…</div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",params=new URLSearchParams(location.search),teacherPreview=params.get("teacher_preview")==="1",sourceTeacher=params.get("source")==="teacher",teacherToken=localStorage.getItem("tahadi_teacher_token")||"",studentToken=localStorage.getItem("tahadi_student_session")||"",forceStudent=params.get("role")==="student"&&!sourceTeacher&&!teacherPreview,previewLevel=params.get("level")||"",teacher=!teacherPreview&&!forceStudent&&!!teacherToken,token=forceStudent?studentToken:(teacherToken||studentToken),$=id=>document.getElementById(id);
const backButton=$("backButton");
if(teacherPreview){const previewId=params.get("student_id")||"";backButton.textContent="← العودة إلى فضاء التلميذ (معاينة)";backButton.onclick=()=>location.href="student-space.html?teacher_preview="+encodeURIComponent(previewId);$("pageHeading").textContent="تنبيهات التلميذ (معاينة)";$("pageSubtitle").textContent="عرض التنبيهات التي تستهدف هذا المستوى فقط";$("dailyButton").classList.add("hide");$("compose").classList.add("hide");}
else if(sourceTeacher){backButton.textContent="← العودة إلى فضاء الأستاذة حياة";backButton.onclick=()=>location.href="index.html";$("pageHeading").textContent="إدارة التنبيهات";$("pageSubtitle").textContent="إرسال ومتابعة تنبيهات منصة التحدي";$("dailyButton").classList.add("hide");}
else if(forceStudent){backButton.textContent="← العودة إلى فضاء التلميذ";backButton.onclick=()=>location.href="student-space.html";$("pageHeading").textContent="تنبيهاتي";$("pageSubtitle").textContent="أحدث الإعلانات والتحديثات في فضاء التلميذ";$("dailyButton").onclick=()=>location.href="daily-science.html";}
else if(teacher){backButton.textContent="← العودة إلى فضاء الأستاذة حياة";backButton.onclick=()=>location.href="index.html";$("pageHeading").textContent="إدارة التنبيهات";$("pageSubtitle").textContent="إرسال ومتابعة تنبيهات منصة التحدي";$("dailyButton").classList.add("hide");}
else {backButton.textContent="← العودة إلى فضاء التلميذ";backButton.onclick=()=>location.href="student-space.html";$("dailyButton").onclick=()=>location.href="daily-science.html";}
async function call(action,extra={}){if(!token)throw Error(teacherPreview?"انتهت جلسة المعاينة. ارجعي إلى فضاء الأستاذة وافتحي المعاينة من جديد.":"لم يتم العثور على جلسة الدخول. ارجعي إلى فضائك وسجلي الدخول من جديد.");const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(API,{method:"POST",signal:controller.signal,headers:{"Content-Type":"application/json","apikey":"sb_publishable_DTBlj8XmZYmqLKc9iMxX7A_hFzI2_kv","Authorization":"Bearer "+token},body:JSON.stringify({action,...(forceStudent&&studentToken?{session_token:studentToken}:{}),...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}catch(e){if(e.name==="AbortError")throw Error("انتهت مهلة تحميل التنبيهات. تحققي من الاتصال ثم أعيدي المحاولة.");throw e}finally{clearTimeout(timer)}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const box=$("items");box.textContent="جارٍ تحميل التنبيهات…";try{const extra=teacherPreview?{preview_student_id:params.get("student_id")||""}:{};const result=await call("notification_list",extra);const a=result.items||[];box.innerHTML=a.length?a.map(x=>'<article class="item"><span class="tag">'+esc(x.category)+' • '+new Date(x.created_at).toLocaleDateString("ar-DZ")+(x.is_read===true?' • مقروء':' • جديد')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.message)+'</p>'+(teacherPreview?(!x.is_read?'<button class="read-confirm" type="button" data-preview-read-id="'+esc(x.id)+'">اضغط هنا لإشعار الأستاذة أنك قرأت التنبيه</button>':'<div class="read-confirm done" role="status">تم إشعار الأستاذة بقراءة التنبيه</div>'):teacher?'<section class="readers"><strong>قرأ التنبيه: '+Number(x.read_count||0)+' تلميذًا</strong><p>'+((x.readers||[]).length?x.readers.map(r=>esc(r.name)+ (r.read_at?' — '+new Date(r.read_at).toLocaleString("ar-DZ"):'')).join("، "):'لم يقرأه أي تلميذ بعد.')+'</p></section>':(!x.is_read?'<button class="read-confirm" type="button" data-read-id="'+esc(x.id)+'">اضغط هنا لإشعار الأستاذة أنك قرأت التنبيه</button>':'<div class="read-confirm done" role="status">تم إشعار الأستاذة بقراءة التنبيه</div>'))+'</article>').join(""):"لا توجد تنبيهات حاليًا.";document.querySelectorAll("[data-read-id]").forEach(btn=>btn.addEventListener("click",async()=>{btn.disabled=true;btn.textContent="جارٍ إشعار الأستاذة…";try{await call("notification_mark_read",{notification_id:btn.dataset.readId});await load()}catch(e){btn.disabled=false;btn.textContent="اضغط هنا لإشعار الأستاذة أنك قرأت التنبيه";alert(e.message||"تعذر حفظ القراءة.")}}));document.querySelectorAll("[data-preview-read-id]").forEach(btn=>btn.addEventListener("click",()=>{btn.disabled=true;btn.classList.add("done");btn.textContent="تم إشعار الأستاذة بقراءة التنبيه";btn.setAttribute("aria-live","polite")}));}catch(e){box.textContent=e.message||"تعذر تحميل التنبيهات.";const retry=document.createElement("button");retry.className="btn";retry.type="button";retry.textContent="إعادة المحاولة";retry.onclick=load;box.append(" ",retry)}}
$("send").onclick=async()=>{const btn=$("send"),status=$("status");if(!$("title").value.trim()||!$("message").value.trim()){status.textContent="يرجى إدخال عنوان التنبيه ومحتواه.";return}btn.disabled=true;status.textContent="جارٍ نشر التنبيه…";try{const d=await call("notification_create",{title:$("title").value.trim(),message:$("message").value.trim(),category:"عام",target_level:$("level").value,audience:"student",priority:"normal"});status.textContent=d.message||"تم نشر التنبيه."; $("title").value="";$("message").value="";await load()}catch(e){status.textContent=e.message||"تعذر نشر التنبيه."}finally{btn.disabled=false}};
if(teacher&&!teacherPreview)$("compose").classList.remove("hide");load();
</script></body></html>
