async function api(payload,token="",auth=""){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json",...(token?{"X-Quiz-Token":token}:{}),...(auth?{"Authorization":"Bearer "+auth}:{})},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"تعذر الاتصال بالخادم.");return d}
const $=id=>document.getElementById(id);
async function startPortalQuiz(){$("start").disabled=true;if(teacherPreviewMode){attemptId="teacher-preview";attemptToken="";finished=false;answers={};current=0;$("studentLabel").textContent="معاينة الأستاذة — دون توقيت";$("examInfo").textContent="وضع معاينة الأستاذة: يمكنك تصفح الأسئلة دون مؤقت، ولن تُحفظ هذه المعاينة ضمن نتائج التلاميذ.";$("exam").classList.remove("hidden");$("timer").classList.add("hidden");if(timerId)clearInterval(timerId);render();$("loginError").textContent="";window.scrollTo(0,0);$("start").disabled=false;return;}const sessionToken=localStorage.getItem("tahadi_student_session")||"";$("loginError").textContent="جارٍ التحقق من جلسة فضاء التلميذ…";if(!sessionToken){$("loginError").textContent="يجب فتح الاختبار من فضاء التلميذ بعد تسجيل الدخول.";$("start").disabled=false;return}try{const d=await api({action:"start_portal"},"",sessionToken);attemptId=d.attempt_id;attemptToken=d.attempt_token;deadline=Date.now()+Math.max(0,Number(d.duration_seconds||2400)-Math.floor((Date.now()-new Date(d.started_at).getTime())/1000))*1000;$("studentLabel").textContent=d.student.full_name;$("exam").classList.remove("hidden");$("start").disabled=false;render();$("timer").classList.remove("hidden");if(timerId)clearInterval(timerId);timerId=setInterval(tick,500);$("loginError").textContent="";window.scrollTo(0,0)}catch(e){$("loginError").textContent=e.message;$("start").disabled=false}}$("start").onclick=startPortalQuiz;
function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("timer").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left<=0)submit()}
function render(){const q=questions[current];$("count").textContent="السؤال "+(current+1)+" من "+questions.length;$("bar").style.width=((current+1)/questions.length*100)+"%";let h="<h2>"+q.n+". "+q.q+"</h2>";h+='<div>';q.opts.forEach((o,i)=>{h+='<label class="option"><input type="radio" name="choice" value="'+LETTERS[i]+'" '+(answers[q.n]===LETTERS[i]?"checked":"")+' > '+LETTERS[i]+". "+o+"</label>"});h+="</div>";if(teacherPreviewMode)h+='<div class="result" style="margin-top:14px"><strong>الإجابة الصحيحة: </strong>'+LETTERS[q.correct]+". "+q.opts[q.correct]+'</div>';$("question").innerHTML=h;$("prev").classList.toggle("hidden",current===0);$("next").classList.toggle("hidden",current===questions.length-1);$("finish").classList.toggle("hidden",current!==questions.length-1);$("examError").textContent=""}
function saveCurrent(){const q=questions[current];const x=document.querySelector('input[name="choice"]:checked');if(x)answers[q.n]=x.value;else delete answers[q.n]}
$("prev").onclick=()=>{saveCurrent();current--;render()};$("next").onclick=()=>{saveCurrent();current++;render()};$("finish").onclick=async()=>{saveCurrent();if(await window.TahadiDialog.confirm("هل أنت متأكد من إنهاء الاختبار وإرسال الإجابات؟"))submit()};
async function submit(){if(finished||!attemptId)return;finished=true;if(timerId)clearInterval(timerId);$("finish").disabled=true;try{const d=teacherPreviewMode?{score:questions.reduce((sum,q)=>sum+(answers[q.n]===LETTERS[q.correct]?1:0),0)}:await api({action:"submit",attempt_id:attemptId,selected_answers:answers,written_answers:{},question_bank:questions.map(q=>({n:q.n,q:q.q,opts:q.opts}))},attemptToken);$("exam").classList.add("hidden");const results=$("results");results.classList.remove("hidden");results.innerHTML='<h2>تم إرسال الاختبار بنجاح</h2><div class="result"><h1>علامتك: '+d.score+' / 20</h1><p>تم تصحيح الأسئلة العشرين آليًا، وكل سؤال عليه نقطة واحدة.</p></div><h3>التصحيح الآلي</h3>'+questions.filter(q=>q.type==="mcq").map(q=>{const chosen=answers[q.n];const isCorrect=chosen!==undefined&&String(chosen)===LETTERS[q.correct];const cardClass=isCorrect?"review-correct":"review-wrong";const chosenIndex=LETTERS.indexOf(chosen);const chosenText=chosenIndex>=0?q.opts[chosenIndex]:chosen||"لم تجب";return '<article class="review-card '+cardClass+'"><strong class="review-title">'+q.n+'. '+q.q+'</strong><p class="review-line"><span class="review-label">إجابتك:</span> '+(chosen?chosen+". "+chosenText:"لم تجب")+'</p><p class="review-line"><span class="review-label">الإجابة الصحيحة:</span> '+LETTERS[q.correct]+'. '+q.opts[q.correct]+'</p><p class="review-line"><span class="review-label">التعليل العلمي:</span> '+(q.explanation||"") +'</p><span class="review-status">'+(isCorrect?"✓ إجابة صحيحة":"✗ إجابة خاطئة أو بدون إجابة")+'</span></article>'}).join("")+'<p class="muted">'+(teacherPreviewMode?'هذه نتيجة معاينة محلية فقط، ولم تُسجّل محاولة أو نتيجة في قاعدة بيانات التلاميذ.':'تم حفظ نتيجتك وإجاباتك لدى الأستاذة.')+'</p>';window.scrollTo(0,0)}catch(e){finished=false;$("examError").textContent=e.message+" — لا تغلقي الصفحة، حاولي الإرسال مجددًا.";$("finish").disabled=false}}
</script>
<script src="./workspace-autosave.js" defer></script>
<script src="./writing-tools.js" defer></script>
<script src="./tahadi-dialogs.js" defer></script>
</body></html>
