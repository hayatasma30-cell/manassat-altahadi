<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<meta name="robots" content="noindex,nofollow">
<title>معاينة الاختبارات | منصة التحدي</title>
<style>
:root{--g:#14532d;--g2:#166534;--cream:#faf8ee;--ink:#18382a;--muted:#718075;--line:#e2e9dc;--pale:#eef7ec}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
header{background:linear-gradient(120deg,#103f28,var(--g2));color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:clamp(21px,5vw,29px)}header p{margin:5px 0 0;color:#e1eee2;font-size:14px}
main{max-width:780px;margin:22px auto;padding:0 14px 40px}
.intro,.test-card,.state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 6px 18px #153d2010}
.intro{background:linear-gradient(135deg,#fffef8,#edf7e9)}.intro strong{color:var(--g)}
.test-card{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.test-info{min-width:0;flex:1}.test-info strong{display:block;font-size:17px}.test-info small{color:var(--muted)}
.open{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#1c7440,#14532d);color:white;border:1px solid #1b6a3c;border-bottom:4px solid #0d4223;border-radius:12px;padding:10px 17px;font-weight:800;min-width:135px}
.open:active{transform:translateY(2px)}.state{text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:15px}
@media(max-width:520px){.test-card{align-items:stretch}.open{width:100%}}
</style>
</head>
<body>
<header><h1>📝 معاينة الاختبارات مباشرة</h1><p>صفحة عرض مستقلة — لا تعرض قائمة التلاميذ أو بياناتهم</p></header>
<main>
<div class="intro"><strong>وضع العرض للتلاميذ</strong><div>اختاري الاختبار الذي تريدين عرضه. عند فتحه ستظهر صفحة الاختبار فقط. في Zoom شاركي علامة تبويب الاختبار المفتوحة، وليس نافذة فضاء الأستاذة.</div></div>
<div id="tests" class="state" role="status" aria-live="polite">جارٍ تحميل الاختبارات…</div>
</main>
<footer>منصة التحدي التعليمية</footer>
<script>
(async()=>{
 const root=document.getElementById("tests");
 const token=localStorage.getItem("tahadi_teacher_token");
 if(!token){root.textContent="انتهت جلسة الأستاذة أو لم يتم تسجيل الدخول. افتحي فضاء الأستاذة وسجّلي الدخول، ثم أعيدي فتح صفحة المعاينة.";return;}
 try{
  const response=await fetch("https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action:"teacher_list_resources"})});
  const data=await response.json();
  if(!response.ok||!data.ok)throw new Error(data.error||"تعذر تحميل الاختبارات.");
  const tests=(data.resources||[]).filter(x=>x.resource_type==="quiz"&&String(x.resource_url||"").trim());
  root.className="";
  root.replaceChildren();
  if(!tests.length){root.className="state";root.textContent="لا توجد اختبارات إلكترونية بروابط جاهزة للمعاينة.";return;}
  tests.forEach(test=>{
   const card=document.createElement("article");card.className="test-card";
   const info=document.createElement("div");info.className="test-info";
   const title=document.createElement("strong");title.textContent=test.title||"اختبار إلكتروني";
   const meta=document.createElement("small");meta.textContent=(test.level||"المستوى غير محدد")+" · "+(test.is_published?"منشور":"غير منشور — معاينة الأستاذة");
   info.append(title,meta);
   const link=document.createElement("a");link.className="open";link.textContent="👁️ فتح المعاينة";
   try{const u=new URL(test.resource_url,location.href);if(u.pathname.endsWith("/test-nahl-03.html"))u.searchParams.set("teacher_preview","1");link.href=u.href;}catch(_){link.href=test.resource_url;}
   link.target="_blank";link.rel="noopener";
   card.append(info,link);root.append(card);
  });
 }catch(error){root.className="state";root.textContent=error.message||"حدث خطأ أثناء تحميل الاختبارات.";}
})();
</script>
</body>
</html>
