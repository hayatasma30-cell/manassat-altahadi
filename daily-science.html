<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>مكتبتي العلمية | منصة التحدي</title>
<style>body{margin:0;background:#f7f6e9;color:#18382a;font:16px/1.8 Tahoma,Arial}header{background:linear-gradient(120deg,#103f28,#217747);color:#fff;padding:18px}.wrap{max-width:850px;margin:auto;padding:18px}.item p{white-space:pre-wrap;overflow-wrap:anywhere;text-align:right}.box,.item{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 5px 0 #dfe8d8}.btn{border:1px solid #cbdcc8;border-radius:12px;padding:10px 14px;background:#fff;color:#14532d;box-shadow:0 4px 0 #bfd0b9;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#217747;color:#fff}.hide{display:none!important}.field{display:block;margin:10px 0 4px;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit}textarea{min-height:75px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.tag{background:#eaf5e8;border-radius:20px;padding:4px 10px}.status{background:#f3f5eb;padding:8px}</style><style id="daily-science-reading-polish-20261108">
:root{--ds-green:#14532d;--ds-ink:#18382a;--ds-muted:#69786d;--ds-line:#dfe8dc;--ds-pale:#edf7eb}
body{line-height:1.75}
header{padding:15px 17px;box-shadow:0 4px 14px #143e2518}
header b{display:block;font-size:1.12rem;line-height:1.5}
header div{font-size:.88rem;line-height:1.6}
.wrap{max-width:820px;padding:14px 16px 28px}
.toolbar{gap:8px;margin:0 0 12px}
.btn{min-height:42px;padding:8px 13px;border-radius:12px;box-shadow:0 3px 0 #bfd0b9}
.box{padding:clamp(13px,3vw,21px);margin:12px 0;border-radius:18px;box-shadow:0 4px 0 #dfe8d8}
.box h2{font-size:1.12rem;line-height:1.5;margin:0 0 12px;color:var(--ds-green)}
#today{margin-top:10px}
#todayContent .item,#cards .item{
 margin:0;padding:clamp(14px,3vw,21px);border:1px solid var(--ds-line);
 border-radius:16px;background:linear-gradient(155deg,#fff 0%,#fcfdf9 100%);
 box-shadow:0 3px 0 #e5ecdf;
}
.item .tag{display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;padding:5px 11px;background:var(--ds-pale);color:var(--ds-green);font-size:.82rem;font-weight:700}
.item h3{margin:5px 0 15px;color:var(--ds-green);font-size:1.18rem;line-height:1.6}
.item p{margin:13px 0;color:var(--ds-ink);font-size:1rem;line-height:1.95;text-align:justify;white-space:pre-wrap;overflow-wrap:anywhere}
.item p b{color:var(--ds-green);font-weight:800}
#todayContent .item p:last-child{margin-bottom:0}
#library{margin-top:12px}
#topicList{gap:8px}
#topicBack{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
#selectedTopicTitle{color:var(--ds-green)}
#search{margin:8px 0 12px;min-height:44px}
#cards{display:grid;gap:12px}
@media(max-width:520px){
 header{padding:13px 14px}
 header b{font-size:1.04rem}
 header div{font-size:.78rem}
 .wrap{padding:10px 11px 24px}
 .toolbar .btn{flex:1 1 auto;font-size:.88rem;padding:8px 10px}
 .box{padding:12px;margin:10px 0;border-radius:16px}
 .box h2{font-size:1.03rem;margin-bottom:10px}
 #todayContent .item,#cards .item{padding:15px 13px;border-radius:14px}
 .item .tag{font-size:.75rem;margin-bottom:9px;padding:4px 9px}
 .item h3{font-size:1.05rem;margin:4px 0 12px}
 .item p{font-size:1rem;line-height:2;margin:12px 0;text-align:right}
 #topicList .btn{flex:1 1 calc(50% - 8px);font-size:.84rem}
}

.home-menu{display:grid;gap:9px}.home-action{box-sizing:border-box;width:100%;height:86px;min-height:86px;max-height:86px;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #b8d8b6;border-bottom:4px solid #23834b;border-radius:15px;background:linear-gradient(145deg,#fff,#eff9ed);color:#14532d;text-decoration:none;line-height:1.35;box-shadow:0 4px 0 #14532d18,0 7px 13px #14532d12;overflow:hidden}.home-icon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:10px;background:#e4f3e0;font-size:1.12rem}.home-action>span:nth-child(2){flex:1;min-width:0}.home-action strong,.home-action small{display:block}.home-action strong{font-size:.92rem;line-height:1.35}.home-action small{font-size:.72rem;line-height:1.4;color:#68776c;margin-top:3px}.home-arrow{margin-right:auto;font-size:1.3rem;flex:0 0 auto}.topic-choice,.fact-choice{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;text-align:right;padding:10px 13px;border:1px solid #c9ddc5;border-bottom:3px solid #23834b;border-radius:13px;background:linear-gradient(145deg,#fff,#f1f8ee);color:#14532d;font:inherit;font-weight:700;box-shadow:0 3px 0 #14532d12;cursor:pointer}.topic-choice{flex:1 1 calc(50% - 8px)}.fact-choice{margin:7px 0}.topic-choice span:last-child,.fact-choice span:last-child{margin-inline-start:auto;color:#6d806f}.fact-open{margin:8px 0 14px}
</style>

</head>
<body><header><b>📚 مكتبتي العلمية</b><div>مساحتك لاكتشاف المعلومات العلمية ومراجعة دروسك</div></header><main class="wrap">
<section class="box" id="libraryHome"><h2>اختَر ما تريد استكشافه</h2><div class="home-menu">
<a class="home-action" href="daily-science.html?view=library"><span class="home-icon">📚</span><span><strong>مكتبة المعلومات</strong><small>تصفّح المعلومات العلمية حسب المواضيع</small></span><span class="home-arrow">‹</span></a>
<a class="home-action" href="student-space.html?section=reviewCourses"><span class="home-icon">📖</span><span><strong>دروسي وملخصاتي</strong><small>الدورات والدروس والملخصات التي أضافتها الأستاذة</small></span><span class="home-arrow">‹</span></a>
</div></section>
<div class="toolbar hide" id="libraryToolbar"><button class="btn" onclick="location.href='daily-science.html'">← العودة إلى مكتبتي العلمية</button></div>
<section class="box hide" id="library"><h2>📚 مكتبة المعلومات</h2><div id="topicList" class="toolbar" style="margin:10px 0"></div><div id="topicBack" class="hide"><button class="btn" id="backTopics">← كل المواضيع</button><strong id="selectedTopicTitle"></strong></div><input id="search" placeholder="بحث حسب العنوان أو الموضوع"><div id="cards"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",params=new URLSearchParams(location.search),previewStudentId=params.get("student_id")||"",teacherPreview=params.get("teacher_preview")==="1"&&!!previewStudentId,token=teacherPreview?(localStorage.getItem("tahadi_teacher_token")||""):(localStorage.getItem("tahadi_student_session")||""), $=id=>document.getElementById(id);let facts=[],topics=[],selectedTopic="";
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...(teacherPreview?{preview_student_id:previewStudentId}:{}),...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function scienceHTML(value){const s=String(value??"");return s.startsWith("<!--TAHADI_RICH_V1-->")?s.slice("21"):esc(s).replace(/\r?\n/g,"<br>")}
function card(x){return '<article class="item"><span class="tag">'+esc(x.topic)+' • '+esc(x.info_date)+'</span><h3>'+esc(x.title)+'</h3><p><b>المعلومة:</b> '+scienceHTML(x.daily_information)+'</p><p><b>السؤال:</b> '+scienceHTML(x.scientific_question)+'</p></article>'}
function draw(){$("todayContent").innerHTML=facts.length?card(facts[0]):"لا توجد معلومة منشورة بعد.";filter()}
function showTopics(){selectedTopic="";$("topicList").classList.remove("hide");$("topicBack").classList.add("hide");$("search").classList.add("hide");$("cards").innerHTML="";$("topicList").innerHTML=topics.map(t=>'<button class="topic-choice" data-topic="'+esc(t.title)+'"><span>📁</span><strong>'+esc(t.title)+'</strong><span>‹</span></button>').join("")||"لم تُضَف مواضيع بعد.";document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>openTopic(b.dataset.topic))}
function openTopic(title){selectedTopic=title;$("topicList").classList.add("hide");$("topicBack").classList.remove("hide");$("selectedTopicTitle").textContent="📁 "+title;$("search").classList.remove("hide");filter()}
function filter(){const q=$("search").value.toLowerCase(),a=facts.filter(x=>x.topic===selectedTopic&&(x.title+" "+x.topic+" "+x.scientific_question).toLowerCase().includes(q));$("cards").innerHTML=a.map((x,i)=>'<div class="fact-entry"><button class="fact-choice" type="button" data-fact="'+i+'"><span>📄</span><strong>'+esc(x.title)+'</strong><span>عرض المعلومة ‹</span></button><div class="fact-open hide" id="fact-'+i+'">'+card(x)+'</div></div>').join("")||"لا توجد معلومات في هذا الموضوع حاليًا.";document.querySelectorAll("[data-fact]").forEach(b=>b.onclick=()=>{const panel=$("fact-"+b.dataset.fact);panel.classList.toggle("hide");b.querySelector("span:last-child").textContent=panel.classList.contains("hide")?"عرض المعلومة ‹":"إخفاء المعلومة ⌃"})}
$("backTopics").onclick=showTopics;
async function load(){try{const access=await call("student_portal_dashboard");const resourceLock=(access.content_access||[]).find(x=>x.content_type==="resources"&&x.content_id==="*");if(resourceLock){const notice="🔒 "+(resourceLock.lock_message||"المكتبة العلمية مغلقة حاليًا. يرجى متابعة إعلانات الأستاذة.");$("todayContent").textContent=notice;$("topicList").textContent=notice;$("cards").textContent=notice;$("search").classList.add("hide");return;}const d=await call("daily_science_list");facts=(d.items||[]).filter(x=>x.is_published!==false);topics=(d.topics||[]).filter(t=>facts.some(x=>x.topic===t.title));filter();showTopics()}catch(e){$("cards").textContent=e.message}}
const showLibrary=params.get("view")==="library";$("libraryHome").classList.toggle("hide",showLibrary);$("libraryToolbar").classList.toggle("hide",!showLibrary);$("library").classList.toggle("hide",!showLibrary);$("search").oninput=filter;
load();
</script>
