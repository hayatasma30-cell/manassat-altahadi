<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>تعلّم اليوم | منصة التحدي</title>
<style>body{margin:0;background:#f7f6e9;color:#18382a;font:16px/1.8 Tahoma,Arial}header{background:linear-gradient(120deg,#103f28,#217747);color:#fff;padding:18px}.wrap{max-width:850px;margin:auto;padding:18px}.box,.item{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 5px 0 #dfe8d8}.btn{border:1px solid #cbdcc8;border-radius:12px;padding:10px 14px;background:#fff;color:#14532d;box-shadow:0 4px 0 #bfd0b9;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#217747;color:#fff}.hide{display:none!important}.field{display:block;margin:10px 0 4px;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit}textarea{min-height:75px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.tag{background:#eaf5e8;border-radius:20px;padding:4px 10px}.status{background:#f3f5eb;padding:8px}</style></head>
<body><header><b>💡 تعلّم اليوم</b><div>معلومة علمية يومية ومكتبة منظّمة حسب الموضوع</div></header><main class="wrap">
<div class="toolbar"><button class="btn" onclick="location.href='student-space.html'+(teacherPreview?'?teacher_preview='+encodeURIComponent(previewStudentId):'')">← العودة إلى فضائي</button><button class="btn" id="libraryBtn">📚 مكتبة المعلومات</button></div>
<section class="box" id="today"><h2>معلومة اليوم</h2><div id="todayContent">جارٍ التحميل…</div></section>
<section class="box hide" id="library"><h2>📚 مكتبة المعلومات العلمية</h2><div id="topicList" class="toolbar" style="margin:10px 0"></div><div id="topicBack" class="hide"><button class="btn" id="backTopics">← كل المواضيع</button><strong id="selectedTopicTitle"></strong></div><input id="search" placeholder="بحث حسب العنوان أو الموضوع"><div id="cards"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",params=new URLSearchParams(location.search),previewStudentId=params.get("student_id")||"",teacherPreview=params.get("teacher_preview")==="1"&&!!previewStudentId,token=teacherPreview?(localStorage.getItem("tahadi_teacher_token")||""):(localStorage.getItem("tahadi_student_session")||""), $=id=>document.getElementById(id);let facts=[],topics=[],selectedTopic="";
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...(teacherPreview?{preview_student_id:previewStudentId}:{}),...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(x){return '<article class="item"><span class="tag">'+esc(x.topic)+' • '+esc(x.info_date)+'</span><h3>'+esc(x.title)+'</h3><p><b>المعلومة:</b> '+esc(x.daily_information)+'</p><p><b>السؤال:</b> '+esc(x.scientific_question)+'</p></article>'}
function draw(){facts.sort((a,b)=>String(b.info_date).localeCompare(String(a.info_date)));$("todayContent").innerHTML=facts.length?card(facts[0]):"لا توجد معلومة منشورة بعد.";filter()}
function showTopics(){selectedTopic="";$("topicList").classList.remove("hide");$("topicBack").classList.add("hide");$("search").classList.add("hide");$("cards").innerHTML="";$("topicList").innerHTML=topics.map(t=>'<button class="btn" data-topic="'+esc(t.title)+'">📁 '+esc(t.title)+'</button>').join("")||"لم تُضَف مواضيع بعد.";document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>openTopic(b.dataset.topic))}
function openTopic(title){selectedTopic=title;$("topicList").classList.add("hide");$("topicBack").classList.remove("hide");$("selectedTopicTitle").textContent="📁 "+title;$("search").classList.remove("hide");filter()}
function filter(){const q=$("search").value.toLowerCase(),a=facts.filter(x=>x.topic===selectedTopic&&(x.title+" "+x.topic+" "+x.scientific_question).toLowerCase().includes(q));$("cards").innerHTML=a.map(card).join("")||"لا توجد معلومات في هذا الموضوع حاليًا."}
$("backTopics").onclick=showTopics;
async function load(){try{const d=await call("daily_science_list");facts=d.items||[];topics=d.topics||[];draw();showTopics()}catch(e){$("todayContent").textContent=e.message}}
$("libraryBtn").onclick=()=>{$("library").classList.toggle("hide");$("today").classList.toggle("hide")};$("search").oninput=filter;
load();
</script></body></html>
