<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>تعلّم اليوم | منصة التحدي</title>
<style>body{margin:0;background:#f7f6e9;color:#18382a;font:16px/1.8 Tahoma,Arial}header{background:linear-gradient(120deg,#103f28,#217747);color:#fff;padding:18px}.wrap{max-width:850px;margin:auto;padding:18px}.box,.item{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 5px 0 #dfe8d8}.btn{border:1px solid #cbdcc8;border-radius:12px;padding:10px 14px;background:#fff;color:#14532d;box-shadow:0 4px 0 #bfd0b9;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#217747;color:#fff}.hide{display:none!important}.field{display:block;margin:10px 0 4px;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit}textarea{min-height:75px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.tag{background:#eaf5e8;border-radius:20px;padding:4px 10px}.status{background:#f3f5eb;padding:8px}</style></head>
<body><header><b>💡 تعلّم اليوم</b><div>معلومة علمية يومية ومكتبة منظّمة حسب الموضوع</div></header><main class="wrap">
<div class="toolbar"><button class="btn" onclick="location.href='student-space.html'">← العودة إلى فضائي</button><button class="btn" id="libraryBtn">📚 مكتبة المعلومات</button></div>
<section class="box" id="today"><h2>معلومة اليوم</h2><div id="todayContent">جارٍ التحميل…</div></section>
<section class="box hide" id="library"><h2>📚 مكتبة المعلومات العلمية</h2><div id="categoryList" class="toolbar" style="margin:10px 0"><button class="btn category-btn" data-category="جسم الإنسان والتغذية">جسم الإنسان والتغذية</button><button class="btn category-btn" data-category="التنسيق العصبي والهرموني">التنسيق العصبي والهرموني</button><button class="btn category-btn" data-category="التكاثر والوراثة">التكاثر والوراثة</button><button class="btn category-btn" data-category="الصحة والمناعة">الصحة والمناعة</button><button class="btn category-btn" data-category="عالم النبات">عالم النبات</button><button class="btn category-btn" data-category="عالم الحيوان">عالم الحيوان</button><button class="btn category-btn" data-category="البيئة والتوازن البيئي">البيئة والتوازن البيئي</button><button class="btn category-btn" data-category="الأرض والظواهر الطبيعية">الأرض والظواهر الطبيعية</button><button class="btn category-btn" data-category="التجارب والاكتشافات العلمية">التجارب والاكتشافات العلمية</button><button class="btn primary" id="allCategories">كل الأقسام</button></div><input id="search" placeholder="بحث حسب العنوان أو الموضوع"><div id="cards"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",token=localStorage.getItem("tahadi_student_session")||"", $=id=>document.getElementById(id);let facts=[];
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(x){return '<article class="item"><span class="tag">'+esc(x.topic)+' • '+esc(x.info_date)+'</span><h3>'+esc(x.title)+'</h3><p><b>السؤال العلمي:</b> '+esc(x.scientific_question)+'</p><p><b>المشكل العلمي المطروح:</b> '+esc(x.scientific_problem)+'</p><p><b>التفسير:</b> '+esc(x.explanation)+'</p><p><b>الاستنتاج:</b> '+esc(x.conclusion)+'</p><p><b>معلومة اليوم:</b> '+esc(x.daily_information)+'</p></article>'}
function draw(){facts.sort((a,b)=>String(b.info_date).localeCompare(String(a.info_date)));$("todayContent").innerHTML=facts.length?card(facts[0]):"لا توجد معلومة منشورة بعد.";filter()}
let selectedCategory="";
function filter(){const q=$("search").value.toLowerCase(),a=facts.filter(x=>(!selectedCategory||x.topic===selectedCategory)&&(x.title+" "+x.topic+" "+x.scientific_question).toLowerCase().includes(q));$("cards").innerHTML=a.map(card).join("")||"لا توجد معلومات في هذا القسم حاليًا."}
document.querySelectorAll(".category-btn").forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.category;document.querySelectorAll(".category-btn").forEach(x=>x.classList.toggle("primary",x===b));$("allCategories").classList.remove("primary");filter()});
$("allCategories").onclick=()=>{selectedCategory="";document.querySelectorAll(".category-btn").forEach(x=>x.classList.remove("primary"));$("allCategories").classList.add("primary");filter()};
async function load(){try{facts=(await call("daily_science_list")).items||[];draw()}catch(e){$("todayContent").textContent=e.message}}
$("libraryBtn").onclick=()=>{$("library").classList.toggle("hide");$("today").classList.toggle("hide")};$("search").oninput=filter;
load();
</script></body></html>
