<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة رموز اختبار الزلازل</title><style>body{font:16px/1.8 Tahoma,Arial;background:#f7f5ec;color:#203128;margin:0}main{max-width:850px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #d8dfd3;border-radius:14px;padding:18px;margin:12px 0}h1,h2{color:#276749}input,select,button{font:inherit;padding:10px;border:1px solid #bccbbb;border-radius:8px;margin:4px}input,select{width:100%;box-sizing:border-box}button{background:#276749;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #ccc;padding:7px;text-align:right}.code{direction:ltr;display:inline-block;font-weight:bold}small{color:#637066}.hidden{display:none}.danger{color:#a33}</style></head><body><main><section class="box"><h1>لوحة الأستاذة — اختبار الزلازل والتشوهات التكتونية</h1><p>لوحة مستقلة لإصدار رموز الاختبار ومتابعة النتائج، دون الدخول إلى منصة التحدي الرئيسية.</p><label>كود دخول الأستاذة</label><input id="teacherCode" type="password" autocomplete="current-password" placeholder="أدخلي كود الأستاذة"><button id="login">دخول وتحميل التلاميذ</button><p id="msg" class="danger"></p></section><section id="panel" class="box hidden"><h2>إصدار رمز</h2><label>اختاري التلميذ</label><select id="student"><option value="">تحميل القائمة…</option></select><button id="issue">إصدار رمز للتلميذ المختار</button> <button id="bulk">إصدار رموز لكل من لم يبدأ الاختبار</button><div id="codeResult"></div><h2>النتائج</h2><button id="refresh">تحديث النتائج</button><div id="results"></div><p><a href="test-zalazil-3am.html">فتح صفحة الاختبار المستقلة</a></p></section></main><script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz";let token="",students=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(body,auth=true){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",...(auth&&token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"تعذر الاتصال بالخادم");return d}
async function load(){const d=await call({action:"list_students"});students=d.students||[];$("student").innerHTML='<option value="">اختاري التلميذ</option>'+students.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.full_name)+' — '+esc(s.level||"المستوى غير محدد")+'</option>').join("");render()}
function render(){const done=students.filter(s=>s.attempt&&s.attempt.submitted_at);const started=students.filter(s=>s.attempt&&!s.attempt.submitted_at);$("results").innerHTML='<p>سلّموا: '+done.length+' | بدأوا ولم يسلّموا: '+started.length+'</p>'+(done.length?'<div style="overflow:auto"><table><thead><tr><th>التلميذ</th><th>المستوى</th><th>العلامة</th><th>تاريخ التسليم</th></tr></thead><tbody>'+done.map(s=>'<tr><td>'+esc(s.full_name)+'</td><td>'+esc(s.level||"—")+'</td><td>'+esc(s.attempt.auto_score??"—")+'/'+esc(s.attempt.auto_max_score??16)+'</td><td>'+esc(s.attempt.submitted_at)+'</td></tr>').join("")+'</tbody></table></div>':'<p>لا توجد نتائج مسلّمة بعد.</p>')}
$("login").onclick=async()=>{const b=$("login");b.disabled=true;$("msg").textContent="جارٍ تسجيل الدخول…";try{const d=await call({action:"teacher_login",code:$("teacherCode").value.trim()},false);token=d.token;await load();$("panel").classList.remove("hidden");$("msg").textContent="تم الدخول بنجاح."}catch(e){$("msg").textContent=e.message}finally{b.disabled=false}};
$("issue").onclick=async()=>{const id=$("student").value;if(!id){$("msg").textContent="اختاري التلميذ أولًا.";return}try{const d=await call({action:"issue_code",student_id:id});$("codeResult").innerHTML='<div class="box"><strong>'+esc(d.student.full_name)+'</strong><p>رمز الدخول: <span class="code">'+esc(d.code)+'</span></p><p>رابط الاختبار: <a href="test-zalazil-3am.html">افتحي الاختبار</a></p><small>الرمز خاص بهذا التلميذ؛ أرسليه له على انفراد.</small></div>';await load()}catch(e){$("msg").textContent=e.message}};
$("bulk").onclick=async()=>{if(!confirm("سيتم إصدار رمز لكل تلميذ نشط لا توجد له محاولة مسجلة. احفظي الرموز واحتفظي بها سرية. متابعة؟"))return;const eligible=students.filter(s=>!s.attempt);if(!eligible.length){$("codeResult").textContent="كل التلاميذ لديهم محاولة مسجلة أو بدأوا الاختبار.";return}const rows=[];for(const s of eligible){try{const d=await call({action:"issue_code",student_id:s.id});rows.push({name:d.student?.full_name||s.full_name,level:s.level,code:d.code})}catch(e){rows.push({name:s.full_name,level:s.level,code:"تعذر الإصدار: "+e.message})}}$("codeResult").innerHTML='<div class="box"><h2>قائمة الرموز — احتفظي بها سرية</h2><div style="overflow:auto"><table><thead><tr><th>التلميذ</th><th>المستوى</th><th>الرمز</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.level||"—")+'</td><td class="code">'+esc(r.code)+'</td></tr>').join("")+'</tbody></table></div><button onclick="window.print()">طباعة الرموز</button></div>';await load()};
$("refresh").onclick=async()=>{try{await load();$("msg").textContent="تم تحديث النتائج."}catch(e){$("msg").textContent=e.message}};
</script></body></html>
