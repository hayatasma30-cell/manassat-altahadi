<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتائج اختبار الزلازل</title><style>body{font:16px/1.8 Tahoma,Arial;background:#f7f5ec;color:#203128;margin:0}main{max-width:850px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #d8dfd3;border-radius:14px;padding:18px;margin:12px 0}h1,h2{color:#276749}input,button{font:inherit;padding:10px;border:1px solid #bccbbb;border-radius:8px;margin:4px}input{width:100%;box-sizing:border-box}button{background:#276749;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #ccc;padding:7px;text-align:right}.hidden{display:none}.danger{color:#a33}.notice{background:#f1f7ed;border:1px solid #d5e5cc;border-radius:10px;padding:12px;color:#315b3b}</style></head><body><main><section class="box"><h1>لوحة نتائج اختبار الزلازل والتشوهات التكتونية</h1><p>هذه الصفحة مخصّصة لمتابعة النتائج المحفوظة فقط.</p><p class="notice">تم إيقاف رموز الدخول القديمة. يدخل التلاميذ إلى الاختبار عبر فضاء التلميذ، وتبقى المحاولات والإجابات والنتائج السابقة محفوظة.</p><label>كود دخول الأستاذة</label><input id="teacherCode" type="password" autocomplete="current-password" placeholder="أدخلي كود الأستاذة"><button id="login">دخول وعرض النتائج</button><p id="msg" class="danger"></p></section><section id="panel" class="box hidden"><h2>نتائج التلاميذ</h2><button id="refresh">تحديث النتائج</button><div id="results"></div></section></main><script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz";let token="",students=[];
const $=id=>document.getElementById(id);
const normLevel=value=>String(value||"").trim().replace(/^السنة\s+/,"").replace(/[إأآا]/g,"ا").replace(/\s+/g," ");
const isThirdMiddle=s=>normLevel(s.level)==="الثالثة متوسط";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(body,auth=true){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",...(auth&&token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"تعذر الاتصال بالخادم");return d}
async function load(){const d=await call({action:"list_students"});students=(d.students||[]).filter(isThirdMiddle);render()}
function render(){const done=students.filter(s=>s.attempt&&s.attempt.submitted_at);const started=students.filter(s=>s.attempt&&!s.attempt.submitted_at);$("results").innerHTML='<p>تلاميذ السنة الثالثة متوسط: '+students.length+' | سلّموا: '+done.length+' | بدأوا ولم يسلّموا: '+started.length+'</p>'+(done.length?'<div style="overflow:auto"><table><thead><tr><th>التلميذ</th><th>المستوى</th><th>العلامة</th><th>تاريخ التسليم</th></tr></thead><tbody>'+done.map(s=>'<tr><td>'+esc(s.full_name)+'</td><td>'+esc(s.level||"—")+'</td><td>'+esc(s.attempt.auto_score??"—")+'/'+esc(s.attempt.auto_max_score??16)+'</td><td>'+esc(s.attempt.submitted_at)+'</td></tr>').join("")+'</tbody></table></div>':'<p>لا توجد نتائج مسلّمة بعد.</p>')}
$("login").onclick=async()=>{const b=$("login");b.disabled=true;$("msg").textContent="جارٍ تسجيل الدخول…";try{const d=await call({action:"teacher_login",code:$("teacherCode").value.trim()},false);token=d.token;await load();$("panel").classList.remove("hidden");$("msg").textContent="تم الدخول بنجاح."}catch(e){$("msg").textContent=e.message}finally{b.disabled=false}};
$("refresh").onclick=async()=>{try{await load();$("msg").textContent="تم تحديث النتائج."}catch(e){$("msg").textContent=e.message}};
</script></body></html>
