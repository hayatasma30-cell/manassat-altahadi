<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#14532d"><title>مكتبة الأسئلة | فضاء الأستاذة</title><style>
:root{--green:#14532d;--green2:#1f7747;--blue:#1976d2;--blueDark:#0d47a1;--cream:#f4f7ec;--ink:#18382a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#14532d,#1c6540);color:white;padding:20px 16px}header h1{margin:0;color:white;font-size:clamp(1.35rem,4.5vw,2rem)}header p{margin:6px 0 0}.wrap{max-width:980px;margin:auto;padding:16px}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.nav button,.action{border:1px solid #1f7747;border-radius:15px;background:linear-gradient(145deg,#2d9858,#1f7747);color:#fff;padding:12px 10px;font:inherit;font-weight:700;box-shadow:0 5px 0 #14532d,0 8px 14px #14532d26;cursor:pointer;transition:transform .12s,box-shadow .12s}
.nav button:active,.action:active{transform:translateY(3px);box-shadow:0 2px 0 #14532d}.nav button.active{background:linear-gradient(145deg,#14532d,#1f7747);border-color:#14532d;box-shadow:0 5px 0 #0b3820}
.page[hidden]{display:none!important}.card{background:white;border:1px solid #dfe8dc;border-radius:20px;padding:clamp(14px,3vw,22px);margin:12px 0;box-shadow:0 7px 20px #14532d12}
h2,h3{color:var(--green);margin-top:0}.muted{color:#68776c}.error{color:#a33d42}.success{color:#176b3a;font-weight:700}
input,textarea,select{width:100%;padding:12px;border:1px solid #c7d7c6;border-radius:12px;font:inherit;background:#fff;color:var(--ink)}textarea{resize:vertical}label{display:block;font-weight:700;margin:12px 0 6px}
.question{white-space:pre-wrap;background:#f7f8f0;border-radius:14px;padding:13px;overflow-wrap:anywhere}.saved{background:#edf7ee;border:1px solid #cce5cf;padding:12px;border-radius:12px;margin:12px 0}
.card-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.action{padding:10px 14px}.action.green{background:linear-gradient(145deg,#258550,#14532d);border-color:#14532d;box-shadow:0 5px 0 #0b3820}.action.light{background:linear-gradient(145deg,#fff,#eaf2e7);color:#14532d;border-color:#cbdcc8;box-shadow:0 4px 0 #c3d2bf}
.status-pill{display:inline-block;background:#edf3e8;padding:4px 10px;border-radius:999px;font-size:.9rem}.publish{display:flex;align-items:center;gap:9px;font-weight:700}.publish input{width:22px;height:22px;accent-color:#1976d2}
.empty{text-align:center;padding:24px;color:#68776c;border:1px dashed #cbdcc8;border-radius:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}.stat{background:#fff;border:1px solid #dfe8dc;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 5px 14px #14532d0d}.stat strong{display:block;color:#14532d;font-size:1.55rem;line-height:1.4}.stat span{font-size:.86rem;color:#68776c}.filters{display:grid;grid-template-columns:1fr minmax(125px,.55fr);gap:9px;margin:14px 0}.published-pill{display:inline-block;background:#e5f2e8;color:#176b3a;border:1px solid #c9e2ce;padding:3px 9px;border-radius:999px;font-size:.82rem;margin-inline-start:5px}@media(max-width:480px){.stats{gap:6px}.stat{padding:9px 4px}.stat span{font-size:.76rem}.filters{grid-template-columns:1fr}}
@media(max-width:480px){.nav{gap:7px}.nav button{font-size:.82rem;padding:10px 5px}.card-actions{flex-direction:column;align-items:stretch}.card-actions button{width:100%}}

.detail-layout{max-width:820px;margin:0 auto}.detail-back{margin-bottom:14px}.question-detail-title{font-size:1.35rem}.question-detail-text{font-size:1.1rem;line-height:2}.question-list-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.question-list-card .summary{flex:1;min-width:180px}.question-list-card .summary p{margin:6px 0}.detail-page[hidden]{display:none!important}.detail-actions{display:grid;gap:12px;margin-top:18px}.detail-actions .action{width:100%;padding:14px 16px;font-size:1rem}.question-list-card>.open-question{width:100%;padding:14px 18px;font-size:1rem}

.platform-nav-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid #2a8050;border-bottom:5px solid #0b4529;border-radius:14px;background:linear-gradient(145deg,#2d9858,#14532d);color:#fff!important;text-decoration:none!important;font-weight:800;box-shadow:0 3px 0 #0b4529,0 7px 14px #14532d20}
.platform-nav-link:active{transform:translateY(3px);border-bottom-width:2px}
.question-card-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.question-card-actions .action{margin:0}.question-card-actions .publish-question{flex:1;min-width:180px}.action.danger{background:linear-gradient(145deg,#c94747,#a61d24)!important;color:#fff!important;border:1px solid #8d151b!important;box-shadow:0 4px 0 #741219,0 7px 12px #a61d2422!important}.action.danger:active{transform:translateY(2px);box-shadow:0 2px 0 #741219!important}@media(max-width:520px){.question-card-actions{width:100%}.question-card-actions .action{flex:1}}

.answer-editor{min-height:190px;line-height:1.9;resize:vertical}
.question-tools{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}
.question-tools .action{font-size:.9rem;padding:8px 12px}
.preview-box{background:#f2f7ed;border:1px solid #d5e5d0;border-radius:15px;padding:14px;margin-top:12px}
.preview-box[hidden]{display:none!important}
.preview-box p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}
.draft-note{font-size:.84rem;color:#68776c;margin:5px 0}
.action:disabled{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}
.question-detail-text{background:#f5f6ec;border-right:4px solid #8eae83;padding:16px 14px}
@media(max-width:520px){.question-tools{display:grid;grid-template-columns:1fr 1fr}.question-tools .action{width:100%}}
</style></head><body><header><h1>✉️ أسئلة التلاميذ ومكتبة الأسئلة</h1></header>
<main class="wrap"><nav class="nav" aria-label="صفحات الأسئلة"><button class="active" data-page="newPage" id="navNew">🆕 الأسئلة الجديدة</button><button data-page="answeredPage" id="navAnswered">💬 تم الرد عليها</button><button data-page="libraryPage" id="navLibrary">📚 مكتبة التلاميذ</button></nav>
<section class="stats" aria-label="ملخص الأسئلة"><div class="stat"><strong id="statTotal">0</strong><span>إجمالي الأسئلة</span></div><div class="stat"><strong id="statNew">0</strong><span>بانتظار الرد</span></div><div class="stat"><strong id="statPublished">0</strong><span>منشورة للتلاميذ</span></div></section>
<section id="newPage" class="page"><div class="card"><h2>الأسئلة الجديدة</h2><p id="newCount" class="muted">جارٍ التحميل…</p><div class="filters"><input id="newSearch" type="search" placeholder="ابحثي باسم التلميذ أو السؤال"><select id="newLevel"><option value="">كل المستويات</option></select></div><div id="newQuestions"></div></div></section>
<section id="answeredPage" class="page" hidden><div class="card"><h2>الأسئلة التي تمت الإجابة عنها</h2><p id="answeredCount" class="muted"></p><div class="filters"><input id="answeredSearch" type="search" placeholder="ابحثي باسم التلميذ أو السؤال"><select id="answeredLevel"><option value="">كل المستويات</option></select></div><div id="answeredQuestions"></div></div></section>
<section id="questionDetailPage" class="page detail-page" hidden><button id="detailBack" class="action green detail-back" type="button">← رجوع إلى قائمة الأسئلة</button><div id="questionDetail"></div></section>
<section id="libraryPage" class="page" hidden><div class="card"><h2>📚 مكتبة الأسئلة الظاهرة للتلاميذ</h2><input id="librarySearch" type="search" placeholder="ابحثي في المكتبة بالسؤال أو المستوى"><p id="libraryCount" class="muted"></p><select id="libraryLevel" aria-label="تصفية حسب المستوى"><option value="">كل المستويات</option></select><div id="libraryQuestions"></div></div></section>
<p><a class="platform-nav-link" href="index.html">← فضاء الأستاذة</a></p><p id="status" class="muted" role="status"></p></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let questions=[],currentListPage="newPage";
const PAGE_STATE_KEY="tahadi_teacher_questions_page_state";
function savePageState(activePage,questionId=""){
 try{sessionStorage.setItem(PAGE_STATE_KEY,JSON.stringify({activePage,currentListPage,questionId:String(questionId||"")}));}catch(e){}
}
function readPageState(){
 try{const value=JSON.parse(sessionStorage.getItem(PAGE_STATE_KEY)||"{}");
  return {activePage:["newPage","answeredPage","libraryPage","questionDetailPage"].includes(value.activePage)?value.activePage:"newPage",
   currentListPage:["newPage","answeredPage","libraryPage"].includes(value.currentListPage)?value.currentListPage:"newPage",
   questionId:String(value.questionId||"")};
 }catch(e){return {activePage:"newPage",currentListPage:"newPage",questionId:""};}
}
const initialPageState=readPageState();
currentListPage=initialPageState.currentListPage;
async function call(action,extra={}) {
 const token=localStorage.getItem("tahadi_teacher_token");
 if(!token) throw new Error("جلسة الأستاذة غير موجودة في هذه الصفحة. ادخلي إلى فضاء الأستاذة أولًا ثم افتحي الأسئلة من داخله.");
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);
 try {
  const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra}),signal:controller.signal,cache:"no-store"});
  const data=await response.json();
  if(!response.ok||!data.ok) throw new Error(data.error||"تعذر تحميل الأسئلة. جرّبي تحديث الصفحة.");
  return data;
 } catch(e) {
  if(e.name==="AbortError") throw new Error("تأخر تحميل الأسئلة أكثر من 15 ثانية. تحققي من الإنترنت ثم حدّثي الصفحة.");
  throw e;
 } finally {clearTimeout(timeout);}
}
function switchPage(id) {
 document.querySelectorAll(".page").forEach(p=>p.hidden=p.id!==id);
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
 savePageState(id,id==="questionDetailPage"?initialPageState.questionId:"");
 window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>switchPage(b.dataset.page)));
$("detailBack").addEventListener("click",()=>{
 const target=["newPage","answeredPage","libraryPage"].includes(currentListPage)?currentListPage:"newPage";
 switchPage(target);
});

function statusText(q){return q.status==="answered"?"تم الرد":q.status==="closed"?"مغلق":q.status==="in_progress"?"قيد المعالجة":"جديد";}
function openQuestion(id,fromPage) {
 currentListPage=fromPage;
 savePageState("questionDetailPage",id);
 const q=questions.find(x=>String(x.id)===String(id));
 if(!q){$("status").textContent="لم أجد السؤال، حدّثي القائمة وحاولي مجددًا.";return;}
 $("questionDetail").innerHTML=detailMarkup(q);
 document.querySelectorAll(".page").forEach(p=>p.hidden=true);
 $("questionDetailPage").hidden=false;
 const reply=$("detailReply"),editButton=$("detailEdit"),saveButton=$("detailSave"),editor=$("replyEditor");
 const draftKey="tahadi_question_reply_draft_"+q.id;
 if(!String(q.teacher_reply||"").trim()){
   const draft=localStorage.getItem(draftKey);
   if(draft)reply.value=draft;
 }
 const resize=()=>{reply.style.height="auto";reply.style.height=Math.max(190,reply.scrollHeight)+"px";};
 resize();
 reply.addEventListener("input",()=>{resize();localStorage.setItem(draftKey,reply.value);$("draftNote").textContent="تم حفظ المسودة تلقائيًا على هذا الجهاز.";});
 if(editButton)editButton.onclick=()=>{editor.hidden=false;editButton.hidden=true;saveButton.hidden=false;reply.focus();resize();};
 if(saveButton)saveButton.onclick=()=>saveReply(q.id);
 $("detailCopy").onclick=async()=>{try{await navigator.clipboard.writeText(q.question_text||"");$("detailStatus").className="success";$("detailStatus").textContent="تم نسخ سؤال التلميذ.";}catch(e){$("detailStatus").className="error";$("detailStatus").textContent="تعذر النسخ تلقائيًا. حددي نص السؤال وانسخيه يدويًا.";}};
 $("detailPreview").onclick=()=>{const box=$("answerPreview");box.hidden=!box.hidden;if(!box.hidden){$("previewText").textContent=reply.value.trim()||"لم تكتبي الإجابة بعد.";box.scrollIntoView({behavior:"smooth",block:"nearest"});}};
 $("detailPublish").onclick=()=>publishQuestion(q.id,!q.is_published);
 $("detailDelete").onclick=()=>deleteQuestion(q.id);
 window.scrollTo({top:0,behavior:"smooth"});
}
function detailMarkup(q) {
 const hasReply=!!String(q.teacher_reply||"").trim();
 const canPublish=hasReply;
 const publishLabel=q.is_published?"🔒 إلغاء النشر من مكتبة التلاميذ":"📢 نشر السؤال في مكتبة التلاميذ";
 return '<article class="card detail-layout"><h2 class="question-detail-title">'+esc(q.students?.full_name||"تلميذ")+' — '+esc(q.students?.level||"")+'</h2><p class="muted">'+esc(new Date(q.created_at).toLocaleString("ar-DZ"))+' · <span class="status-pill">'+statusText(q)+'</span></p><h3>سؤال التلميذ</h3><div class="question question-detail-text" id="questionText">'+esc(q.question_text)+'</div><div class="question-tools"><button id="detailCopy" class="action light" type="button">📋 نسخ السؤال</button></div>'+(hasReply?'<div class="saved"><strong>إجابتك المحفوظة</strong><p style="white-space:pre-wrap">'+esc(q.teacher_reply)+'</p></div>':'')+'<div id="replyEditor" '+(hasReply?'hidden':'')+'><label for="detailReply">'+(hasReply?'تعديل نص الإجابة':'اكتبي إجابتك للتلميذ')+'</label><textarea class="answer-editor" id="detailReply" rows="7" maxlength="5000" placeholder="اكتبي إجابتك هنا…">'+esc(q.teacher_reply||"")+'</textarea><p id="draftNote" class="draft-note">تُحفظ المسودة تلقائيًا على هذا الجهاز حتى لا تفقدي كتابتك.</p></div><div class="question-tools"><button id="detailPreview" class="action light" type="button">👁️ معاينة الإجابة</button></div><div id="answerPreview" class="preview-box" hidden><strong>معاينة ما سيظهر للتلميذ</strong><p id="previewText"></p></div><div class="detail-actions">'+(hasReply?'<button id="detailEdit" class="action light" type="button">✏️ تعديل الإجابة</button>':'')+'<button id="detailSave" class="action green" type="button" '+(hasReply?'hidden':'')+'>💾 '+(hasReply?'حفظ التعديل':'حفظ الإجابة وإرسالها')+'</button><button id="detailPublish" class="action green" type="button" '+(!canPublish&&!q.is_published?'disabled title="احفظي الإجابة أولًا قبل النشر"':'')+'>'+publishLabel+'</button><button id="detailDelete" class="action danger" type="button">🗑️ حذف السؤال</button></div><p id="detailStatus" class="muted" role="status"></p></article>';
}
function questionCard(q,fromPage) {
 const publication=q.is_published?'<span class="published-pill">📚 منشور في المكتبة</span>':'';
 return '<article class="card question-list-card"><div class="summary"><h3>'+esc(q.students?.full_name||"تلميذ")+' — '+esc(q.students?.level||"")+'</h3><p class="muted">'+esc(new Date(q.created_at).toLocaleString("ar-DZ"))+' · <span class="status-pill">'+statusText(q)+'</span> '+publication+'</p><p>'+esc((q.question_text||"").slice(0,150))+(String(q.question_text||"").length>150?"…":"")+'</p></div><button class="action green open-question" type="button" data-id="'+esc(q.id)+'" data-from="'+fromPage+'">📖 فتح السؤال</button></article>';
}

async function deleteQuestion(id){
 const q=questions.find(x=>String(x.id)===String(id));if(!q)return;
 if(!await window.TahadiDialog.confirm("تأكيد حذف سؤال التلميذ: "+(q.students?.full_name||"تلميذ")+"؟\nسيُحذف السؤال نهائيًا ولا يمكن التراجع عن ذلك."))return;
 const buttons=[...document.querySelectorAll(".delete-question")].filter(b=>b.dataset.id===String(id));buttons.forEach(b=>{b.disabled=true;b.textContent="جارٍ الحذف…";});
 try{await call("teacher_delete_student_question",{id});questions=questions.filter(x=>String(x.id)!==String(id));render();$("status").className="success";$("status").textContent="تم حذف السؤال بنجاح.";}
 catch(e){$("status").className="error";$("status").textContent=e.message;buttons.forEach(b=>{b.disabled=false;b.textContent="🗑️ حذف السؤال";});}
}
async function saveReply(id) {
 const field=$("detailReply"),msg=$("detailStatus"),btn=$("detailSave");
 const teacher_reply=field?.value.trim();
 if(!teacher_reply){msg.className="error";msg.textContent="اكتبي الإجابة قبل الحفظ.";return;}
 btn.disabled=true;msg.className="muted";msg.textContent="جارٍ حفظ الإجابة…";
 try {
  await call("teacher_reply_student_question",{id,teacher_reply});localStorage.removeItem("tahadi_question_reply_draft_"+id);
  const q=questions.find(x=>String(x.id)===String(id));if(q)q.teacher_reply=teacher_reply;
  await load();
  openQuestion(id,currentListPage);
  const refreshedMsg=$("detailStatus");if(refreshedMsg){refreshedMsg.className="success";refreshedMsg.textContent="تم حفظ تعديل الإجابة وإرساله إلى فضاء التلميذ.";}
 }
 catch(e){msg.className="error";msg.textContent=e.message;}
 finally{btn.disabled=false;}
}
async function publishQuestion(id,is_published) {
 const q=questions.find(x=>String(x.id)===String(id));
 const msg=$("detailStatus");
 if(is_published&&q&&!String(q.teacher_reply||"").trim()){
  msg.className="error";msg.textContent="يجب حفظ إجابة الأستاذة أولًا قبل نشر السؤال في مكتبة التلاميذ.";return;
 }
 if(!await window.TahadiDialog.confirm(is_published?"هل تريدين نشر السؤال وإجابته في مكتبة التلاميذ؟":"هل تريدين إخفاء السؤال من مكتبة التلاميذ؟"))return;
 try {
  await call("teacher_publish_student_question",{id,is_published});
  if(q)q.is_published=is_published;
  $("status").className="success";
  $("status").textContent=is_published?"تم نشر السؤال في مكتبة التلاميذ.":"تم إخفاء السؤال من المكتبة.";
  render();
  if(!$("questionDetailPage").hidden)openQuestion(id,currentListPage);
 } catch(e) {
  if(msg){msg.className="error";msg.textContent=e.message;}
  else{$("status").className="error";$("status").textContent=e.message;}
 }
}
function bindOpenButtons(){document.querySelectorAll(".open-question").forEach(b=>b.addEventListener("click",()=>openQuestion(b.dataset.id,b.dataset.from)));document.querySelectorAll(".delete-question").forEach(b=>b.addEventListener("click",()=>deleteQuestion(b.dataset.id)));document.querySelectorAll(".publish-question").forEach(b=>b.addEventListener("click",()=>publishQuestion(b.dataset.id,b.dataset.published!=="true")));}
function fillLevelSelect(id) {
 const select=$(id),old=select.value;
 const levels=[...new Set(questions.map(q=>q.students?.level).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));
 select.innerHTML='<option value="">كل المستويات</option>'+levels.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");
 if(levels.includes(old))select.value=old;
}
function matches(q,term,level) {
 const hay=[q.question_text,q.students?.full_name,q.students?.level].join(" ").toLocaleLowerCase("ar");
 return (!term||hay.includes(term.toLocaleLowerCase("ar")))&&(!level||q.students?.level===level);
}
function render() {
 const newer=questions.filter(q=>q.status!=="answered"&&q.status!=="closed");
 const answered=questions.filter(q=>q.status==="answered"||q.status==="closed");
 const published=questions.filter(q=>q.is_published);
 $("statTotal").textContent=questions.length;
 $("statNew").textContent=newer.length;
 $("statPublished").textContent=published.length;
 $("navNew").textContent="🆕 الأسئلة الجديدة ("+newer.length+")";
 $("navAnswered").textContent="💬 تم الرد عليها ("+answered.length+")";
 $("navLibrary").textContent="📚 المكتبة ("+published.length+")";
 $("newCount").textContent="عدد الأسئلة الجديدة: "+newer.length;
 $("answeredCount").textContent="عدد الأسئلة التي تمت الإجابة عنها: "+answered.length;
 ["newLevel","answeredLevel","libraryLevel"].forEach(fillLevelSelect);
 renderLists();renderLibrary();
}
function renderLists() {
 const newer=questions.filter(q=>q.status!=="answered"&&q.status!=="closed");
 const answered=questions.filter(q=>q.status==="answered"||q.status==="closed");
 const nr=newer.filter(q=>matches(q,$("newSearch").value.trim(),$("newLevel").value));
 const ar=answered.filter(q=>matches(q,$("answeredSearch").value.trim(),$("answeredLevel").value));
 $("newQuestions").innerHTML=nr.length?nr.map(q=>questionCard(q,"newPage")).join(""):'<div class="empty">لا توجد أسئلة تطابق البحث.</div>';
 $("answeredQuestions").innerHTML=ar.length?ar.map(q=>questionCard(q,"answeredPage")).join(""):'<div class="empty">لا توجد أسئلة تطابق البحث.</div>';
 bindOpenButtons();
}
function renderLibrary() {
 const term=($("librarySearch").value||"").trim(),level=$("libraryLevel").value;
 const rows=questions.filter(q=>q.is_published&&matches(q,term,level));
 $("libraryCount").textContent="عدد الأسئلة المنشورة المطابقة: "+rows.length;
 $("libraryQuestions").innerHTML=rows.length?rows.map(q=>questionCard(q,"libraryPage")).join(""):'<div class="empty">لا توجد أسئلة منشورة تطابق البحث.</div>';
 bindOpenButtons();
}
["newSearch","answeredSearch"].forEach(id=>$(id).addEventListener("input",renderLists));
["newLevel","answeredLevel"].forEach(id=>$(id).addEventListener("change",renderLists));
$("librarySearch").addEventListener("input",renderLibrary);
$("libraryLevel").addEventListener("change",renderLibrary);

async function load() {
 try {
  const data=await call("teacher_student_questions");questions=data.questions||[];render();
  $("status").className="muted";$("status").textContent="تم تحديث الأسئلة.";
  const saved=readPageState();currentListPage=saved.currentListPage;
  if(saved.activePage==="questionDetailPage"&&saved.questionId&&questions.some(q=>String(q.id)===saved.questionId)){
   openQuestion(saved.questionId,currentListPage);
  }else{
   switchPage(saved.activePage==="questionDetailPage"?currentListPage:saved.activePage);
  }
 }catch(e){$("status").className="error";$("status").textContent=e.message;$("newQuestions").innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
load();
</script>
