<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>أسئلة التلاميذ | فضاء الأستاذة</title><style>body{margin:0;background:#f4f7ec;color:#18382a;font-family:Tahoma,Arial,sans-serif;line-height:1.7}header{background:#14532d;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #dfe8dc;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 15px #14532d12}h1,h2{color:#14532d}button{background:#1f7747;color:white;border:0;border-radius:12px;padding:10px 15px;font:inherit;cursor:pointer}textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c7d7c6;border-radius:10px;font:inherit}img{max-width:100%;max-height:420px;border-radius:12px;display:block;margin:10px 0}.muted{color:#68776c}.error{color:#a33d42}</style></head><body><header><h1 style="color:white;margin:0">✉️ أسئلة التلاميذ — خاصة بالأستاذة حياة</h1><div>هذه الصفحة للأستاذة فقط. أسئلة التلاميذ لا تظهر في فضاء بقية التلاميذ.</div></header><main class="wrap"><p id="status" class="muted">جارٍ تحميل الأسئلة…</p><div id="questions"></div><p><a href="index.html">العودة إلى فضاء الأستاذة</a></p></main><script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function call(action,extra={}){const token=localStorage.getItem("tahadi_teacher_token");if(!token)throw Error("سجلي الدخول في فضاء الأستاذة أولًا، ثم افتحي هذه الصفحة من جديد.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر تنفيذ الطلب.");return d}async function load(){try{const d=await call("teacher_student_questions");$("status").textContent=d.questions.length?"عدد الأسئلة: "+d.questions.length:"لا توجد أسئلة جديدة حاليًا.";const root=$("questions");root.innerHTML="";for(const q of d.questions){const el=document.createElement("section");el.className="card";el.innerHTML='<h2>'+esc(q.students?.full_name||"تلميذ")+' — '+esc(q.students?.level||"")+'</h2><p class="muted">'+new Date(q.created_at).toLocaleString("ar-DZ")+' • '+esc(q.status==="answered"?"تم الرد":"بانتظار الرد")+'</p><p style="white-space:pre-wrap">'+esc(q.question_text)+'</p>'+(q.image_data?'<img src="'+q.image_data.replace(/"/g,"&quot;")+'" alt="الصورة المرفقة من التلميذ">':"")+'<label>رد الأستاذة</label><textarea rows="3" id="reply-'+q.id+'">'+esc(q.teacher_reply||"")+'</textarea><button data-id="'+q.id+'">حفظ الرد</button>';root.appendChild(el)}root.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",async()=>{const id=b.dataset.id;try{await call("teacher_reply_student_question",{id,teacher_reply:$("reply-"+id).value});$("status").textContent="تم حفظ الرد، وسيظهر للتلميذ في أسئلتي.";await load()}catch(e){$("status").textContent=e.message}}));}catch(e){$("status").className="error";$("status").textContent=e.message}}load();</script></body></html>
