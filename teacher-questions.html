<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>أسئلة التلاميذ | فضاء الأستاذة</title><style>body{margin:0;background:#f4f7ec;color:#18382a;font-family:Tahoma,Arial,sans-serif;line-height:1.7}header{background:#14532d;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #dfe8dc;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 15px #14532d12}h1,h2{color:#14532d}button{background:#1f7747;color:white;border:0;border-radius:12px;padding:10px 15px;font:inherit;cursor:pointer}textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c7d7c6;border-radius:10px;font:inherit}img{max-width:100%;max-height:420px;border-radius:12px;display:block;margin:10px 0}.muted{color:#68776c}.error{color:#a33d42} .success{color:#176b3a;font-weight:700}.question{background:#f7f8f0;padding:12px;border-radius:12px}.saved{background:#edf7ee;border:1px solid #cce5cf;padding:12px;border-radius:12px;margin:12px 0}label{display:block;font-weight:700;margin:12px 0 6px}button:disabled{opacity:.6}</style></head><body><header><h1 style="color:white;margin:0">✉️ أسئلة التلاميذ — خاصة بالأستاذة حياة</h1><div>هذه الصفحة للأستاذة فقط. اكتبي الإجابة هنا وستظهر للتلميذ في فضائه. الأسئلة والأجوبة نصية فقط.</div></header><main class="wrap"><p id="status" class="muted">جارٍ تحميل الأسئلة…</p><div id="questions"></div><p><a href="index.html">العودة إلى فضاء الأستاذة</a></p></main><script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function call(action,extra={}){const token=localStorage.getItem("tahadi_teacher_token");if(!token)throw Error("سجلي الدخول في فضاء الأستاذة أولًا، ثم افتحي هذه الصفحة من جديد.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر تنفيذ الطلب.");return d}async function saveReply(id){const field=$("reply-"+id),btn=$("save-"+id),msg=$("replyStatus-"+id),teacher_reply=field.value.trim();if(!teacher_reply){msg.className="error";msg.textContent="اكتبي الإجابة قبل الحفظ.";return;}btn.disabled=true;msg.className="muted";msg.textContent="جارٍ حفظ الإجابة…";try{await call("teacher_reply_student_question",{id,teacher_reply});msg.className="success";msg.textContent="تم حفظ الإجابة، وستظهر للتلميذ في فضائه.";await load();}catch(e){msg.className="error";msg.textContent=e.message;}finally{btn.disabled=false;}}async function load(){try{const d=await call("teacher_student_questions");const qs=d.questions||[];$("status").textContent=qs.length?"عدد الأسئلة: "+qs.length:"لا توجد أسئلة واردة حاليًا.";const root=$("questions");root.innerHTML="";for(const q of qs){const el=document.createElement("section");el.className="card";const status=q.status==="answered"?"تمت الإجابة":q.status==="closed"?"مغلق":q.status==="in_progress"?"قيد المعالجة":"جديد";el.innerHTML='<h2>'+esc(q.students?.full_name||"تلميذ")+' — '+esc(q.students?.level||"")+'</h2><p class="muted">'+new Date(q.created_at).toLocaleString("ar-DZ")+' • <strong>'+esc(status)+'</strong></p><h3>سؤال التلميذ</h3><p class="question" style="white-space:pre-wrap">'+esc(q.question_text)+'</p>'+(q.teacher_reply?'<div class="saved"><strong>إجابتك المحفوظة</strong><p style="white-space:pre-wrap">'+esc(q.teacher_reply)+'</p></div>':'<p class="muted">لم تتم الإجابة عن هذا السؤال بعد.</p>')+'<label for="reply-'+esc(q.id)+'">اكتبي إجابتك للتلميذ</label><textarea id="reply-'+esc(q.id)+'" rows="4" maxlength="5000" placeholder="اكتبي الرد هنا…">'+esc(q.teacher_reply||"")+'</textarea><button id="save-'+esc(q.id)+'" type="button" onclick="saveReply(\''+esc(q.id)+'\')">💾 حفظ الإجابة وإرسالها إلى فضاء التلميذ</button><p id="replyStatus-'+esc(q.id)+'" class="muted" role="status"></p>';root.appendChild(el)}}catch(e){$("status").className="error";$("status").textContent=e.message}}load();</script></body></html>
