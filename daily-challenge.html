function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function updateProgress(){if(!selected)return;const qs=selected.questions||[];let answered=0;for(const q of qs){if(q.type==="written"){if((document.getElementById("answer_"+q.id)?.value||"").trim())answered++}else if(document.querySelector('input[name="q_'+CSS.escape(q.id)+'"]:checked'))answered++}const total=qs.length,pct=total?Math.round(answered/total*100):0;$("progressText").textContent=answered+" من "+total;$("progressFill").style.width=pct+"%";$("progressTrack").setAttribute("aria-valuenow",String(pct))}
function updateTimer(){const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));const mm=String(Math.floor(remaining/60)).padStart(2,"0"),ss=String(remaining%60).padStart(2,"0");$("timer").textContent=mm+":"+ss;$("timerBox").classList.toggle("is-low",remaining>0&&remaining<=300);$("timerBox").classList.toggle("is-over",remaining===0);if(remaining===0){stopTimer();$("timerBox").querySelector("span").textContent="انتهى الوقت";msg("انتهى الوقت المحدد. أرسل إجاباتك الآن.")}}
