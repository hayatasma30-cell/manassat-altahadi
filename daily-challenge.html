<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحدي اليومي | منصة التحدي</title><style>
:root{--g:#286b45;--bg:#f5f7f1;--line:#dce6d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24352a;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:16px}.head,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 4px 14px #203b2010}h1{font-size:22px;color:var(--g);margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.7}.btn{background:var(--g);color:white;border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:bold;box-shadow:0 3px 0 #194b30;cursor:pointer}.alt{background:#e9f1e8;color:#245c3c;box-shadow:0 3px 0 #cadbca}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;background:#fff}.muted{font-size:13px;color:#6c7c70}.q{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.option{display:flex;gap:9px;align-items:flex-start;padding:10px;background:#f8faf6;border-radius:9px;margin:7px 0}.option input{margin-top:4px;accent-color:var(--g)}.msg{background:#edf5e9;padding:12px;border-radius:10px;margin:10px 0}.hidden{display:none!important}a{color:var(--g)}@media(max-width:600px){.wrap{padding:9px}}
.written-response{width:100%;min-height:125px;padding:14px;border:1px solid #cbd9ca;border-radius:14px;background:#fff;font:inherit;line-height:1.9;direction:rtl;text-align:right;resize:vertical}.written-response:focus{outline:3px solid #dcecdf;border-color:#398253}.q .options{display:grid;gap:8px}

:root{--g:#245d40;--bg:#f5f7f1;--line:#e1e9df;--ink:#243b2d;--muted:#758176}
body{background:linear-gradient(180deg,#faf9f2,#f1f6ef);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
.wrap{max-width:900px;padding:18px 16px 34px}
.head,.card{border:1px solid #e1e8dd;border-radius:22px;padding:22px;background:#fff;box-shadow:0 8px 24px rgba(31,62,39,.055)}
.head{background:linear-gradient(125deg,#fffdf5,#f0f7ed);padding:24px 25px;margin-bottom:17px;position:relative;overflow:hidden}
.head:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#5d91630d;left:-48px;top:-65px}
.head h1{font-size:clamp(23px,4vw,29px);font-weight:800;margin:0 0 8px;color:#20583b}
.head p{font-size:15px;color:#657568;margin:0 0 13px;max-width:650px}
.back-link{display:inline-flex;padding:7px 12px;border:1px solid #dce8d9;border-radius:999px;background:#fff;color:#286344;font-size:13px;font-weight:700;text-decoration:none}
.section-title{display:flex;align-items:center;gap:9px;margin:0 0 15px;color:#244f36;font-size:19px}
.section-title:before{content:"";width:4px;height:23px;border-radius:8px;background:#6a9a70}
#list{display:grid;gap:13px}
.challenge-card{margin:0;padding:18px;border:1px solid #e0e9de;border-radius:18px;background:linear-gradient(145deg,#fff,#fcfdf9);box-shadow:0 4px 14px #1f3e270b}
.challenge-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:11px}
.challenge-title{font-size:19px;line-height:1.6;color:#20583b;margin:0;font-weight:800}
.challenge-badge{flex:0 0 auto;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700;background:#edf5ec;color:#286344;border:1px solid #d9e8d7;white-space:nowrap}
.challenge-badge.done{background:#f4f1e8;color:#88703e;border-color:#e9dfc9}
.challenge-desc{margin:0 0 13px;color:#69776b;font-size:14px;line-height:1.9;white-space:pre-wrap}
.challenge-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 15px}
.meta-cell{min-width:0;padding:9px 11px;border:1px solid #e8eee5;border-radius:12px;background:#f8faf6}
.meta-cell span{display:block;font-size:11px;color:#819083;margin-bottom:2px}
.meta-cell strong{display:block;font-size:13px;color:#31533a;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 19px;border:1px solid #286b45;border-bottom:4px solid #194b30;border-radius:13px;background:linear-gradient(145deg,#347b55,#245d40);color:#fff;font-size:14px;font-weight:800;box-shadow:0 4px 10px #1f50301a}
.btn:active{transform:translateY(2px)}.btn:disabled{opacity:.65;cursor:not-allowed}
.alt{background:linear-gradient(145deg,#fff,#eff5ed);color:#285d3e;border-color:#cddfca;border-bottom-color:#8eae8a;box-shadow:none}
.msg{position:fixed;z-index:1000;right:14px;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto!important;padding:12px 15px;border:1px solid #cfe2cc;border-right:4px solid #4b8b58;border-radius:14px;background:#f0f7eb;color:#285337;box-shadow:0 9px 26px #18382a29;font-size:14px}
#play{padding:20px}#playTitle{margin:0 0 5px;color:#20583b;font-size:21px}
#playDesc{margin:0 0 13px;color:#69776b;white-space:pre-wrap}
.exam-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;margin:13px 0 16px;border:1px solid #e1eadf;border-radius:15px;background:#f8fbf6}
.progress-label{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;color:#526b58;font-size:12px;font-weight:700}
.progress-track{height:9px;border-radius:99px;background:#e4ece1;overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#78a77a,#286b45);transition:width .2s ease}
.timer-box{min-width:105px;padding:8px 11px;border:1px solid #e0e9dc;border-radius:12px;background:#fff;text-align:center}
.timer-box span{display:block;color:#819083;font-size:10px}
.timer-box strong{display:block;color:#245d40;font-size:19px;font-variant-numeric:tabular-nums;direction:ltr}
.timer-box.is-low{background:#fff8ed;border-color:#ecd8b8}.timer-box.is-low strong{color:#a56b2d}
.timer-box.is-over{background:#fff0ed;border-color:#edcfc8}.timer-box.is-over strong{color:#a23e32}
.q{padding:16px;border:1px solid #e2eade;border-radius:16px;margin:11px 0;background:#fff;box-shadow:0 3px 10px #1f3e2706}
.q strong{display:block;color:#2b4934;line-height:1.8}
.question-number{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;margin-left:7px;border-radius:9px;background:#edf5ec;color:#286344;font-size:13px;vertical-align:middle}
.option{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid #e8eee5;border-radius:11px;background:#fafcf9;margin:8px 0;color:#405a46}
.option:has(input:checked){border-color:#9cbea0;background:#f0f7ee}
.option input{margin-top:6px;accent-color:#286b45}
.written-response{min-height:115px;border-color:#dce7d9;background:#fcfefb}
.play-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.play-actions .btn{flex:1}
@media(max-width:600px){.wrap{padding:10px 10px 26px}.head,.card{padding:15px;border-radius:17px;margin-bottom:11px}.head h1{font-size:22px}.head p{font-size:13px;line-height:1.8}.section-title{font-size:17px;margin-bottom:12px}.challenge-card{padding:13px;border-radius:15px}.challenge-title{font-size:17px}.challenge-desc{font-size:13px}.challenge-meta{gap:7px}.meta-cell{padding:8px 9px}.meta-cell strong{font-size:12px}.btn{min-height:42px;font-size:13px;padding:9px 14px}#play{padding:14px}#playTitle{font-size:19px}.exam-toolbar{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px}.timer-box{min-width:88px;padding:7px 8px}.timer-box strong{font-size:17px}.q{padding:13px;border-radius:14px}.option{padding:10px}.play-actions{display:grid;grid-template-columns:1fr}.msg{right:10px;left:10px;bottom:calc(10px + env(safe-area-inset-bottom))}}
@media(max-width:350px){.challenge-meta{grid-template-columns:1fr}.exam-toolbar{grid-template-columns:1fr}.timer-box{display:flex;justify-content:space-between;align-items:center;text-align:right}.timer-box span,.timer-box strong{display:inline}}

/* لمسات ضبط نهائية لبطاقات التحديات */
.challenge-card{padding:17px 18px 16px;border-radius:19px}
.challenge-top{align-items:center;margin-bottom:9px}
.challenge-title{max-width:100%;letter-spacing:0}
.challenge-meta{align-items:stretch;grid-auto-flow:row}
.challenge-meta>.meta-cell:last-child:nth-child(odd){grid-column:1/-1}
.meta-cell{display:flex;flex-direction:column;justify-content:center;min-height:70px;padding:9px 12px}
.meta-cell strong{direction:rtl;text-align:right;line-height:1.65;font-variant-numeric:tabular-nums}
.challenge-badge{padding:5px 12px}
.challenge-card>.btn{min-width:136px;margin-top:1px}
@media(max-width:600px){
 .challenge-card{padding:13px 13px 14px}
 .challenge-meta{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .meta-cell{min-height:66px;padding:8px 9px}
 .challenge-meta>.meta-cell:last-child:nth-child(odd){grid-column:1/-1}
 .challenge-card>.btn{min-width:128px}
 .head{padding-bottom:19px}
 .card{padding-bottom:15px}
}
</style></head><body><main class="wrap"><header class="head"><h1>التحديات التعليمية</h1><p>مساحة التحديات العلمية — اختر التحدي المناسب لمستواك، وابدأ رحلتك نحو التميّز.</p><a class="back-link" href="./student-space.html">← العودة إلى فضاء التلميذ</a></header><div id="message" class="msg hidden"></div><section class="card"><h2 class="section-title">التحديات المتاحة</h2><div id="list" class="muted">جارٍ تحميل التحديات…</div></section><section id="play" class="card hidden"><h2 id="playTitle"></h2><p id="playDesc"></p><p id="playMeta" class="muted"></p><div class="exam-toolbar"><div><div class="progress-label"><span>تقدم الإجابة</span><span id="progressText">0 من 0</span></div><div class="progress-track" role="progressbar" aria-label="تقدم الإجابة" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div></div><div class="timer-box" id="timerBox"><span>الوقت المتبقي</span><strong id="timer">10:00</strong></div></div><div id="questionList"></div><div class="play-actions"><button class="btn" id="submit">إرسال الإجابات</button><button class="btn alt" id="back">العودة إلى التحديات</button></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/daily-challenge";const token=localStorage.getItem("tahadi_student_session");let selected=null,startedAt=Date.now(),submittedIds=new Set(),timerInterval=null,deadline=0;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(t){const box=$("message");box.textContent=t;box.classList.remove("hidden");box.setAttribute("role","status");box.setAttribute("aria-live","polite");clearTimeout(window.__studentMsgTimer);window.__studentMsgTimer=setTimeout(()=>box.classList.add("hidden"),7000)}
async function call(action,data={}){if(!token)throw Error("جلسة التلميذ غير موجودة. سجّل الدخول إلى فضاء التلميذ من جديد.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNobnNqeGh6b2libHVhY210dmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjI0NzgsImV4cCI6MjEwNzk5ODQ3OH0.uEnFziN-EAu0t5F3tox639Tg3jzEMUhkuVrhD4tzvbE","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر تنفيذ العملية.");return d}
async function load(){try{const d=await call("student_list");submittedIds=new Set((d.submissions||[]).map(x=>x.challenge_id));const submissions=d.submissions||[];const date=v=>{if(!v)return "";const d=new Date(v);if(Number.isNaN(d.getTime()))return "";const day=new Intl.DateTimeFormat("ar-DZ",{day:"numeric",month:"long",year:"numeric"}).format(d);const time=new Intl.DateTimeFormat("ar-DZ",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(d);return day+" · "+time};$("list").innerHTML=d.items.length?d.items.map(x=>{const done=submittedIds.has(x.id);const sub=submissions.find(s=>s.challenge_id===x.id)||{};return '<article class="challenge-card"><div class="challenge-top"><h3 class="challenge-title">'+esc(x.title)+'</h3><span class="challenge-badge '+(done?"done":"")+'">'+(done?"تمت المشاركة":"متاح")+'</span></div>'+(x.description?'<p class="challenge-desc">'+esc(x.description)+'</p>':"")+'<div class="challenge-meta"><div class="meta-cell"><span>المستوى الدراسي</span><strong>'+esc(x.target_level||"الكل")+'</strong></div><div class="meta-cell"><span>عدد الأسئلة</span><strong>'+x.questions.length+' سؤال</strong></div><div class="meta-cell"><span>المدة المحددة</span><strong>'+x.duration_minutes+' دقيقة</strong></div>'+(x.starts_at?'<div class="meta-cell"><span>موعد الظهور</span><strong>'+esc(date(x.starts_at))+'</strong></div>':"")+(x.ends_at?'<div class="meta-cell"><span>نهاية المشاركة</span><strong>'+esc(date(x.ends_at))+'</strong></div>':"")+'</div>'+(done?'<strong style="color:#286344;font-size:13px">✓ أرسلت إجابتك · '+(Number(sub.score)||0)+' نقطة</strong>':'<button class="btn" onclick="openChallenge(\''+x.id+'\')">ابدأ التحدي</button>')+'</article>'}).join(""):'<div class="challenge-card" style="text-align:center;color:#758176;padding:22px">لا توجد تحديات متاحة لمستواك حاليًا.</div>'}catch(e){$("list").textContent=e.message}}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function updateProgress(){if(!selected)return;const qs=selected.questions||[];let answered=0;for(const q of qs){if(q.type==="written"){if((document.getElementById("answer_"+q.id)?.value||"").trim())answered++}else if(document.querySelector('input[name="q_'+CSS.escape(q.id)+'"]:checked'))answered++}const total=qs.length,pct=total?Math.round(answered/total*100):0;$("progressText").textContent=answered+" من "+total;$("progressFill").style.width=pct+"%";$("progressTrack").setAttribute("aria-valuenow",String(pct))}
function updateTimer(){const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));const mm=String(Math.floor(remaining/60)).padStart(2,"0"),ss=String(remaining%60).padStart(2,"0");$("timer").textContent=mm+":"+ss;$("timerBox").classList.toggle("is-low",remaining>0&&remaining<=300);$("timerBox").classList.toggle("is-over",remaining===0);if(remaining===0){stopTimer();$("timerBox").querySelector("span").textContent="انتهى الوقت";msg("انتهى الوقت المحدد. أرسل إجاباتك الآن.")}}
function startTimer(){stopTimer();const minutes=Math.max(1,Number(selected?.duration_minutes)||10);deadline=startedAt+minutes*60000;updateTimer();timerInterval=setInterval(updateTimer,1000)}
window.openChallenge=async id=>{try{const d=await call("student_list");selected=d.items.find(x=>x.id===id);if(!selected||submittedIds.has(id))return;startedAt=Date.now();$("playTitle").textContent=selected.title;$("playDesc").textContent=selected.description||"";$("playMeta").textContent="المستوى: "+(selected.target_level||"الكل")+" · "+selected.questions.length+" سؤال";$("questionList").innerHTML=selected.questions.map((q,i)=>'<article class="q"><strong><span class="question-number">'+(i+1)+'</span>'+esc(q.text)+'</strong>'+(q.type==="written"?'<label for="answer_'+esc(q.id)+'">اكتب إجابتك:</label><textarea class="written-response" id="answer_'+esc(q.id)+'" maxlength="4000" rows="5" placeholder="اكتب إجابتك هنا…"></textarea>':'<div class="options">'+(q.options||[]).map((o,n)=>'<label class="option"><input type="radio" name="q_'+esc(q.id)+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>').join("")+'</div>')+'</article>').join("");$("play").classList.remove("hidden");updateProgress();startTimer();$("play").scrollIntoView({behavior:"smooth"})}catch(e){msg(e.message)}};
$("questionList").addEventListener("input",updateProgress);$("questionList").addEventListener("change",updateProgress);
$("back").onclick=()=>{stopTimer();$("play").classList.add("hidden");selected=null};
$("submit").onclick=async()=>{if(!selected)return;if(!confirm("هل أنت متأكد من إرسال إجاباتك؟ لا يمكن تعديلها بعد الإرسال."))return;stopTimer();const answers={};for(const q of selected.questions){if(q.type==="written"){answers[q.id]=document.getElementById("answer_"+q.id)?.value.trim()||"";}else{const v=document.querySelector('input[name="q_'+CSS.escape(q.id)+'"]:checked');answers[q.id]=v?v.value:"";}}$("submit").disabled=true;try{const d=await call("student_submit",{id:selected.id,answers,duration_seconds:Math.round((Date.now()-startedAt)/1000)});msg(d.message||"تم تسجيل إجابتك بنجاح.");$("play").classList.add("hidden");selected=null;await load()}catch(e){msg(e.message)}finally{$("submit").disabled=false}};
load();
/* إظهار التحديات المجدولة تلقائياً دون إضافة زر تحديث؛ لا نحدّث القائمة أثناء حل اختبار. */
setInterval(()=>{if($("play").classList.contains("hidden"))load()},30000);
</script></body></html>
