<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحدي اليومي | منصة التحدي</title><style>
:root{--g:#286b45;--bg:#f5f7f1;--line:#dce6d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24352a;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:16px}.head,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 4px 14px #203b2010}h1{font-size:22px;color:var(--g);margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.7}.btn{background:var(--g);color:white;border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:bold;box-shadow:0 3px 0 #194b30;cursor:pointer}.alt{background:#e9f1e8;color:#245c3c;box-shadow:0 3px 0 #cadbca}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;background:#fff}.muted{font-size:13px;color:#6c7c70}.q{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.option{display:flex;gap:9px;align-items:flex-start;padding:10px;background:#f8faf6;border-radius:9px;margin:7px 0}.option input{margin-top:4px;accent-color:var(--g)}.msg{background:#edf5e9;padding:12px;border-radius:10px;margin:10px 0}.hidden{display:none!important}a{color:var(--g)}@media(max-width:600px){.wrap{padding:9px}}
.written-response{width:100%;min-height:125px;padding:14px;border:1px solid #cbd9ca;border-radius:14px;background:#fff;font:inherit;line-height:1.9;direction:rtl;text-align:right;resize:vertical}.written-response:focus{outline:3px solid #dcecdf;border-color:#398253}.q .options{display:grid;gap:8px}
</style></head><body><main class="wrap"><header class="head"><h1>التحدي اليومي</h1><p>اختر التحدي المخصص لمستواك، اقرأ الأسئلة جيدًا، ثم أرسل إجاباتك.</p><a href="./student-space.html">العودة إلى فضاء التلميذ</a></header><div id="message" class="msg hidden"></div><section class="card"><h2>التحديات المتاحة</h2><div id="list" class="muted">جارٍ تحميل التحديات…</div></section><section id="play" class="card hidden"><h2 id="playTitle"></h2><p id="playDesc"></p><p id="playMeta" class="muted"></p><div id="questionList"></div><button class="btn" id="submit">إرسال الإجابات</button><button class="btn alt" id="back">العودة إلى التحديات</button></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/daily-challenge";const token=localStorage.getItem("tahadi_student_session");let selected=null,startedAt=Date.now(),submittedIds=new Set();
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(t){$("message").textContent=t;$("message").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
async function call(action,data={}){if(!token)throw Error("جلسة التلميذ غير موجودة. سجّل الدخول إلى فضاء التلميذ من جديد.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNobnNqeGh6b2libHVhY210dmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjI0NzgsImV4cCI6MjEwNzk5ODQ3OH0.uEnFziN-EAu0t5F3tox639Tg3jzEMUhkuVrhD4tzvbE","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر تنفيذ العملية.");return d}
async function load(){try{const d=await call("student_list");submittedIds=new Set((d.submissions||[]).map(x=>x.challenge_id));$("list").innerHTML=d.items.length?d.items.map(x=>'<article class="item"><h2>'+esc(x.title)+'</h2><p>'+esc(x.description||"")+'</p><p class="muted">المستوى: '+esc(x.target_level)+' · عدد الأسئلة: '+x.questions.length+' · المدة: '+x.duration_minutes+' دقيقة</p>'+(submittedIds.has(x.id)?'<strong>✓ أرسلت إجابتك · '+((d.submissions.find(s=>s.challenge_id===x.id)||{}).score||0)+' نقطة</strong>':'<button class="btn" onclick="openChallenge(\''+x.id+'\')">ابدأ التحدي</button>')+'</article>').join(""):'لا توجد تحديات متاحة لمستواك حاليًا.'}catch(e){$("list").textContent=e.message}}
window.openChallenge=async id=>{try{const d=await call("student_list");selected=d.items.find(x=>x.id===id);if(!selected||submittedIds.has(id))return;startedAt=Date.now();$("playTitle").textContent=selected.title;$("playDesc").textContent=selected.description||"";$("playMeta").textContent="عدد الأسئلة: "+selected.questions.length+" · المدة المحددة: "+selected.duration_minutes+" دقيقة";$("questionList").innerHTML=selected.questions.map((q,i)=>'<article class="q"><strong>'+(i+1)+'. '+esc(q.text)+'</strong>'+(q.type==="written"?'<label for="answer_'+esc(q.id)+'">اكتب إجابتك:</label><textarea class="written-response" id="answer_'+esc(q.id)+'" maxlength="4000" rows="5" placeholder="اكتب إجابتك هنا…"></textarea>':'<div class="options">'+(q.options||[]).map((o,n)=>'<label class="option"><input type="radio" name="q_'+esc(q.id)+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>').join("")+'</div>')+'</article>').join("");$("play").classList.remove("hidden");$("play").scrollIntoView({behavior:"smooth"})}catch(e){msg(e.message)}};
$("back").onclick=()=>$("play").classList.add("hidden");
$("submit").onclick=async()=>{if(!selected)return;if(!confirm("هل أنت متأكد من إرسال إجاباتك؟ لا يمكن تعديلها بعد الإرسال."))return;const answers={};for(const q of selected.questions){if(q.type==="written"){answers[q.id]=document.getElementById("answer_"+q.id)?.value.trim()||"";}else{const v=document.querySelector('input[name="q_'+CSS.escape(q.id)+'"]:checked');answers[q.id]=v?v.value:"";}}$("submit").disabled=true;try{const d=await call("student_submit",{id:selected.id,answers,duration_seconds:Math.round((Date.now()-startedAt)/1000)});msg(d.message||"تم تسجيل إجابتك بنجاح.");$("play").classList.add("hidden");await load()}catch(e){msg(e.message)}finally{$("submit").disabled=false}};
load();
/* إظهار التحديات المجدولة تلقائياً دون إضافة زر تحديث؛ لا نحدّث القائمة أثناء حل اختبار. */
setInterval(()=>{if($("play").classList.contains("hidden"))load()},30000);
</script></body></html>
