<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار مجتمع النحل | السنة الثانية متوسط</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#203128;font-family:Tahoma,Arial,sans-serif;line-height:1.85}.wrap{max-width:820px;margin:auto;padding:18px}.hero,.q,.result{background:#fff;border:1px solid #dce6d8;border-radius:16px;padding:18px;margin:14px 0}.hero{border-top:6px solid #39794c}.sub{color:#5b6b60;font-size:14px}.q h3{font-size:17px;margin:0 0 12px}.opt{display:block;border:1px solid #dce4da;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt:has(input:checked){background:#edf6ed;border-color:#39794c}.opt input{margin-left:8px;accent-color:#39794c}button{border:0;border-radius:11px;padding:13px 18px;background:#2f7045;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin:8px 0}button.secondary{background:#e8eee6;color:#203128}.feedback{font-size:14px;padding:8px;border-radius:8px;margin-top:8px}.good{background:#e6f5e8;color:#205d2c}.bad{background:#fff0e8;color:#8a3b19}.hidden{display:none}.score{font-size:32px;font-weight:bold;color:#2f7045;text-align:center}
</style></head><body><main class="wrap">
<header class="hero"><h1>اختبار إلكتروني: مجتمع النحل</h1><div>علوم الطبيعة والحياة — السنة الثانية متوسط</div><p class="sub">20 سؤالًا مركبًا · اختر إجابة واحدة لكل سؤال · العلامة من 20</p><label>اسم التلميذ: <input id="student" style="padding:9px;border:1px solid #ccd8cb;border-radius:8px;width:100%;margin-top:6px" placeholder="اكتب اسمك الكامل"></label></header>
<form id="quiz"></form><section class="result hidden" id="result"></section></main>
<script>
const data = [
["عند مقارنة الملكة بالأنثى العاملة، حدّد الصفات المورفولوجية التي تميّز الملكة.",["جسمها أكبر وبطنها أطول وأكثر امتدادًا.","تمتلك سلالًا لحمل حبوب الطلع على الرجلين الخلفيتين.","تمتلك جهاز لسع تستعمله في الدفاع عن الخلية."],0],
["اعتمادًا على الصفات المورفولوجية، حدّد الخصائص التي تميّز ذكر النحل عن بقية أفراد الخلية.",["يمتلك جهاز لسع وسلالًا لحمل حبوب الطلع.","عيناه المركبتان كبيرتان، ولا يمتلك جهاز لسع.","بطنه أطول من بطن الملكة وأجنحته قصيرة جدًا."],1],
["بمقارنة الأنثى العاملة بالملكة والذكر، حدّد الصفات المورفولوجية التي تميّز الأنثى العاملة.",["جسم كبير وعينان مركبتان تلتقيان تقريبًا أعلى الرأس.","بطن طويل جدًا وأجنحة لا تغطي كامل البطن.","جسم أصغر نسبيًا، ولها جهاز لسع وسلال لحبوب الطلع."],2],
["يتكوّن جسم أفراد النحل من أجزاء خارجية مشتركة؛ حدّد الأجزاء الرئيسية الثلاثة للجسم.",["الرأس والصدر والبطن.","الرأس والصدر والأجنحة.","الصدر والبطن والرجلان الخلفيتان."],0],
["اربط بين الصفات المورفولوجية والوظيفة المناسبة لكل فرد من أفراد مجتمع النحل.",["الملكة تجمع حبوب الطلع، والذكر يحرس الخلية، والعاملة تضع البيوض.","الملكة تضع البيوض، والذكر يساهم في تلقيحها، والعاملة تنجز أعمال الخلية.","الملكة تهوّي الخلية، والذكر يغذي اليرقات، والعاملة تلقّح الملكة."],1],
["تضم خلية النحل ملكة واحدة عادةً وعددًا كبيرًا من العاملات وعددًا من الذكور؛ حدّد أهمية وجود هذه الأصناف داخل الخلية.",["تؤدي جميعها الوظيفة نفسها داخل الخلية.","تتنافس جميعها على وضع البيوض.","تتوزع بينها وظائف التكاثر وأعمال الخلية."],2],
["عند مقارنة مدة حياة أفراد مجتمع النحل، حدّد العبارة الصحيحة التي تصف مدة حياة الملكة مقارنة بالعاملات والذكور.",["تعيش الملكة عادةً مدة أطول من العاملات والذكور.","تعيش الملكة مدة أقصر من الذكور دائمًا.","تعيش جميع الأصناف المدة نفسها."],0],
["تضع الملكة البيوض داخل العيون السداسية؛ حدّد وظيفتها الأساسية التي تساهم في استمرار المجتمع.",["جمع الرحيق وتخزينه وتحويله إلى عسل.","التكاثر والمساهمة في استمرار أفراد الخلية.","حراسة مدخل الخلية وتهويتها."],1],
["اعتمادًا على دور الذكر في مجتمع النحل، حدّد الوظيفة الأساسية التي يؤديها خلال فترة التكاثر.",["تنظيف العيون السداسية وتغذية اليرقات.","جمع الرحيق وحبوب الطلع من الأزهار.","تلقيح الملكة خلال فترة التكاثر."],2],
["تتغير مهام الأنثى العاملة مع تقدمها في العمر؛ حدّد العبارة التي تصف هذا التغير.",["تنتقل عادةً من أعمال داخل الخلية إلى أعمال خارجية مثل جمع الغذاء.","تجمع الغذاء خارج الخلية منذ خروجها، ثم تتولى وضع البيوض.","تقوم بالمهمة نفسها طوال حياتها دون أي تغيير."],0],
["تنظّف العاملات العيون السداسية قبل استعمالها؛ حدّد أهمية هذا السلوك داخل الخلية.",["يساعد على تلقيح الملكة.","يهيّئ العيون لاستعمالها في تربية الحضنة أو تخزين الغذاء.","يساعد الذكور على جمع حبوب الطلع."],1],
["تتولى العاملات تغذية اليرقات داخل الخلية؛ حدّد النتيجة المباشرة لهذه المهمة.",["توجيه العاملات إلى مواقع الأزهار.","تهوية الخلية دون التأثير في نمو اليرقات.","ضمان تغذية اليرقات ونموها."],2],
["تفرز العاملات الشمع وتستعمله في بناء الأقراص؛ حدّد فائدة هذه البنية بالنسبة إلى مجتمع النحل.",["توفير عيون سداسية لتربية الحضنة وتخزين الغذاء.","توجيه الذكور إلى الملكة أثناء الطيران.","إنتاج حبوب الطلع داخل الخلية."],0],
["تراقب بعض العاملات مدخل الخلية وتحرسه؛ حدّد وظيفة هذه العاملات في حماية المجتمع.",["وضع البيوض في العيون السداسية.","حراسة الخلية والمساهمة في حمايتها.","تلقيح الملكة خلال فترة التكاثر."],1],
["تنتقل العاملات الجامعة للغذاء بين الأزهار والخلية؛ حدّد المواد التي تجمعها لتوفير حاجات المجتمع.",["الشمع والفيرومونات من الأزهار.","البيض واليرقات من الخلايا المجاورة.","الرحيق وحبوب الطلع لتوفير الغذاء للخلية."],2],
["في يوم حار، تحرّك عاملات أجنحتها عند مدخل الخلية؛ فسّر هذا السلوك بتحديد وظيفته.",["المساهمة في تهوية الخلية وتنظيم حرارتها.","تخزين الرحيق داخل العيون السداسية.","تلقيح الملكة داخل الخلية."],0],
["عندما تعثر عاملة على مصدر غذاء، تؤدي رقصة أمام العاملات الأخريات؛ حدّد أهمية هذه الرقصة في التواصل.",["تساعد الملكة على وضع البيوض.","تدلّ العاملات على موقع مصدر الغذاء.","تمنع العاملات من تبادل المعلومات."],1],
["تفرز الملكة مواد كيميائية تسمّى الفيرومونات؛ حدّد دورها في تنظيم مجتمع النحل.",["توجيه العاملات إلى مصدر ماء محدد فقط.","تحويل الرحيق إلى عسل مباشرةً.","المساهمة في تنظيم مجتمع النحل والتأثير في التكاثر."],2],
["تتواصل أفراد الخلية وتتوزع بينها المهام؛ حدّد النتيجة الأساسية لهذا التعاون.",["تتكامل الأدوار لتوفير الغذاء والحماية والتكاثر واستمرار المجتمع.","يصبح كل فرد مستقلًا ولا يحتاج إلى بقية الأفراد.","تتوقف العاملات عن أداء مهامها عند وجود الملكة."],0],
["اعتمادًا على الصفات المورفولوجية والوظائف، استنتج كيف يساهم اختلاف أفراد مجتمع النحل في استمرار الخلية.",["تتشابه جميع الأفراد شكلًا ووظيفةً، ولا يوجد تقسيم للمهام.","تختلف الأفراد شكلًا ووظيفةً، وتتعاون فيما بينها لاستمرار الخلية.","تقتصر وظيفة جميع الأفراد على جمع الرحيق."],1]
];
const form=document.getElementById('quiz');
data.forEach((q,i)=>{const box=document.createElement('section');box.className='q';box.innerHTML='<h3>السؤال '+(i+1)+': '+q[0]+'</h3>'+q[1].map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="feedback hidden" id="f'+i+'"></div>';form.appendChild(box)});
const btn=document.createElement('button');btn.type='submit';btn.textContent='إنهاء الاختبار وإظهار النتيجة';form.appendChild(btn);
form.addEventListener('submit',e=>{e.preventDefault();let score=0,answered=0;data.forEach((q,i)=>{const picked=form.querySelector('input[name="q'+i+'"]:checked');const f=document.getElementById('f'+i);f.classList.remove('hidden','good','bad');if(picked){answered++;if(Number(picked.value)===q[2]){score++;f.classList.add('good');f.textContent='إجابة صحيحة.'}else{f.classList.add('bad');f.textContent='الإجابة الصحيحة: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}}else{f.classList.add('bad');f.textContent='لم تتم الإجابة. الإجابة الصحيحة: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}});const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<h2>نتيجة الاختبار</h2><div class="score">'+score+' / 20</div><p>اسم التلميذ: '+(document.getElementById('student').value.trim().replace(/[&<>"]/g,'')||'غير مدخل')+'</p><p>عدد الأسئلة المجاب عنها: '+answered+' من 20.</p><button type="button" class="secondary" onclick="window.print()">طباعة النتيجة</button><button type="button" onclick="location.reload()">إعادة الاختبار</button>';r.scrollIntoView({behavior:'smooth'});btn.disabled=true;btn.textContent='تم تصحيح الاختبار';});
</script></body></html>
