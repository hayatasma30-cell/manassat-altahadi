<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار مجتمع النحل | السنة الثانية متوسط</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#203128;font-family:Tahoma,Arial,sans-serif;line-height:1.85}.wrap{max-width:820px;margin:auto;padding:18px}.hero,.q,.result{background:#fff;border:1px solid #dce6d8;border-radius:16px;padding:18px;margin:14px 0}.hero{border-top:6px solid #39794c}.sub{color:#5b6b60;font-size:14px}.q h3{font-size:17px;margin:0 0 12px}.opt{display:block;border:1px solid #dce4da;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt:has(input:checked){background:#edf6ed;border-color:#39794c}.opt input{margin-left:8px;accent-color:#39794c}button{border:0;border-radius:11px;padding:13px 18px;background:#2f7045;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin:8px 0}button.secondary{background:#e8eee6;color:#203128}.feedback{font-size:14px;padding:8px;border-radius:8px;margin-top:8px}.good{background:#e6f5e8;color:#205d2c}.bad{background:#fff0e8;color:#8a3b19}.hidden{display:none}.score{font-size:32px;font-weight:bold;color:#2f7045;text-align:center}
</style></head><body><main class="wrap">
<header class="hero"><h1>اختبار إلكتروني: مجتمع النحل</h1><div>علوم الطبيعة والحياة — السنة الثانية متوسط</div><p class="sub">20 سؤالًا مركبًا · اختر إجابة واحدة لكل سؤال · العلامة من 20</p><label>اسم التلميذ: <input id="student" style="padding:9px;border:1px solid #ccd8cb;border-radius:8px;width:100%;margin-top:6px" placeholder="اكتب اسمك الكامل"></label></header>
<form id="quiz"></form><section class="result hidden" id="result"></section></main>
<script>
const data = [
["تضم خلية النحل ملكة وعاملات وذكورًا. حدّد الدور الأساسي لكل صنف.",["الملكة لوضع البيوض، والعاملات لإنجاز أعمال الخلية، والذكور لتلقيح الملكة.","الملكة لتلقيح الذكور، والعاملات لوضع البيوض، والذكور لإنجاز أعمال الخلية.","الملكة لإنجاز أعمال الخلية، والعاملات لتلقيح الملكة، والذكور لوضع البيوض."],0],
["تعيش أعداد كبيرة من النحل في خلية واحدة. حدّد ما يفسر تنظيم هذا المجتمع وأهميته.",["تقارب أحجام الأفراد، مما يسمح بتقاسم المكان داخل الخلية.","التواصل وتقسيم المهام، مما يساعد على تلبية حاجات الخلية.","تغير ألوان الأفراد، مما يسمح بتمييز مصادر الغذاء."],1],
["تعود عاملة إلى الخلية وتؤدي حركات متتابعة بعد عثورها على الرحيق. حدّد وسيلة التواصل ووظيفتها.",["الإشارات الكيميائية، للتأثير في تنظيم الخلية وتكاثر أفرادها.","التنبيهات اللمسية، لتنسيق تبادل الغذاء بين العاملات.","رقصة النحل، لإرشاد العاملات إلى موقع مصدر الغذاء."],2],
["تؤثر الملكة في تنظيم الخلية بإشارات كيميائية. حدّد أثرًا لهذه الإشارات.",["المساهمة في تنظيم الخلية والحد من تربية ملكات جديدة في الظروف العادية.","توجيه العاملات إلى مصدر غذاء محدد خارج الخلية.","تنبيه العاملات إلى اتجاه مصدر الماء القريب من الخلية."],0],
["لاحظتَ أن العاملة تنظف العيون السداسية ثم تنتقل لاحقًا إلى جمع الرحيق. فسّر هذا التغير في نشاطها.",["تؤدي العاملة المهمة نفسها طوال حياتها دون تغيير.","تتغير مهام العاملة مع تقدمها في العمر.","تتغير مهام العاملة حسب لونها فقط."],1],
["في يوم حار، شوهدت عاملات تحرك أجنحتها عند مدخل الخلية. فسّر هذا السلوك.",["تساعد على تهوية الخلية وتنظيم حرارتها.","تستعمل أجنحتها لتخزين الرحيق داخل العيون.","توجّه الذكور إلى مكان الملكة لتلقيحها."],0],
["تجمع بعض العاملات الرحيق، وتتولى أخريات تخزينه. حدّد العلاقة بين الوظيفتين.",["الجمع يوفر الرحيق للخلية، والتخزين يحفظه داخل العيون السداسية.","الجمع يحفظ الرحيق في العيون، والتخزين ينقله من الأزهار إلى الخلية.","الجمع يوزع الغذاء على اليرقات، والتخزين يجمعه مباشرة من الأزهار."],0],
["تحرك عاملات أجنحتها داخل الخلية، وتقف أخريات عند المدخل. حدّد وظيفة كل مجموعة.",["الأولى تجمع حبوب الطلع والثانية توزع الغذاء على اليرقات.","الأولى تساهم في تهوية الخلية والثانية تحرس مدخلها.","الأولى تخزن الرحيق والثانية تنظف العيون السداسية."],1],
["تتولى عاملات تغذية اليرقات. حدّد نتيجة محتملة لإهمال هذه المهمة.",["يتأثر تنظيم حركة العاملات دون أن يتأثر نمو اليرقات.","يتأثر تخزين الرحيق فقط دون أن تتأثر الحضنة.","يتأثر نمو اليرقات وقد يتأثر تجدد أفراد الخلية."],2],
["لاحظتَ أن الملكة تضع البيوض بينما تقوم العاملات بتغذية اليرقات وتنظيف الخلية. فسّر أهمية توزيع هذه الوظائف.",["يجعل كل فرد مستقلًا ولا يحتاج إلى بقية أفراد الخلية.","يساعد على تلبية حاجات الخلية واستمرار مجتمع النحل.","يجعل جميع أفراد الخلية يقومون بوظيفة واحدة."],1],
["تشارك الذكور في التكاثر وتقوم العاملات بأعمال الخلية. حدّد العلاقة بين الدورين.",["الذكور تؤمن الغذاء، والعاملات تتولى تلقيح الملكة.","الذكور تساهم في تلقيح الملكة، والعاملات تؤمن حاجات الخلية.","الذكور تنظف الخلية، والعاملات تتولى وضع البيوض."],1],
["عندما تعثر عاملة على مصدر غذاء، تؤدي رقصة أمام العاملات الأخريات. فسّر أهمية هذه الرقصة.",["تساعد العاملات على معرفة موقع مصدر الغذاء والتوجه إليه.","تساعد الملكة على وضع البيوض داخل العيون السداسية.","تمنع العاملات من التواصل فيما بينها."],0],
["تفرز الملكة مواد كيميائية تؤثر في أفراد الخلية. فسّر دور هذه المواد.",["توجيه العاملات إلى مواقع الأزهار خارج الخلية فقط.","المساهمة في تنظيم مجتمع النحل والتأثير في التكاثر.","تحويل الرحيق مباشرة إلى عسل داخل الأزهار."],1],
["تضع الملكة البيوض، وتغذي العاملات اليرقات وتنظف الخلية وتحرسها، وتساهم الذكور في تلقيح الملكة. حدّد العلاقة بين أفراد مجتمع النحل.",["يتنافس أفراد المجتمع على أداء الوظيفة نفسها.","يعيش كل صنف مستقلًا دون حاجة إلى بقية الأفراد.","تتكامل أدوار أفراد المجتمع ويتعاونون لضمان استمرار الخلية."],2],
["إذا ضعفت تهوية الخلية، حدّد النشاط الذي يساعد على تجديد الهواء.",["زيادة جمع الرحيق وتخزينه داخل العيون السداسية.","زيادة تغذية اليرقات وتوزيع الغذاء بينها.","تحريك العاملات أجنحتها للمساهمة في التهوية."],2],
["عند مقارنة الملكة بالأنثى العاملة، أيّ صفة شكلية تميّز الملكة غالبًا?",["جسمها أكبر وبطنها أطول وأكثر امتدادًا.","تمتلك سلالًا لحمل حبوب الطلع على الرجلين الخلفيتين.","عينان مركبتان كبيرتان تلتقيان أعلى الرأس."],0],
["أيّ وصف مورفولوجي يميّز الأنثى العاملة؟",["جسم كبير وعينان مركبتان تلتقيان أعلى الرأس، دون جهاز لسع.","جسم أصغر نسبيًا، مع جهاز لسع وسلال لحمل حبوب الطلع.","بطن طويل جدًا وأجنحة لا تغطي كامل البطن، دون سلال لحبوب الطلع."],1],
["أيّ مجموعة من الصفات الشكلية تساعد على تمييز ذكر النحل؟",["عينان مركبتان كبيرتان، وجسم أكثر امتلاءً، وغياب جهاز اللسع.","سلال لحمل حبوب الطلع على الرجلين الخلفيتين، وجهاز لسع.","بطن طويل يتجاوز الأجنحة بوضوح، مع جهاز لسع."],0],
["قال تلميذ إن أفراد خلية النحل يعيشون معًا دون تعاون. حدّد المعلومة التي تبيّن أن رأيه غير صحيح.",["تختلف أفراد النحل في أحجامها وأشكالها فقط.","يتواصل أفراد الخلية وتتوزع بينهم المهام وتتكاتف أدوارهم.","تعيش أفراد النحل في المكان نفسه دون تبادل للمعلومات."],1],
["اربط بين اختلاف الأفراد والتواصل وتقسيم المهام، ثم حدّد كيف تساعد هذه العوامل على استمرار مجتمع النحل.",["تؤدي اختلافات الأفراد إلى تقليل التعاون والاعتماد المتبادل داخل الخلية.","يحقق تكامل الأدوار والتواصل توفير الغذاء والحماية والتكاثر واستمرار المجتمع.","يؤدي تقسيم المهام إلى استقلال كل فرد وعدم حاجته إلى بقية الخلية."],1]
];
const form=document.getElementById('quiz');
data.forEach((q,i)=>{const box=document.createElement('section');box.className='q';box.innerHTML='<h3>السؤال '+(i+1)+': '+q[0]+'</h3>'+q[1].map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="feedback hidden" id="f'+i+'"></div>';form.appendChild(box)});
const btn=document.createElement('button');btn.type='submit';btn.textContent='إنهاء الاختبار وإظهار النتيجة';form.appendChild(btn);
form.addEventListener('submit',e=>{e.preventDefault();let score=0,answered=0;data.forEach((q,i)=>{const picked=form.querySelector('input[name="q'+i+'"]:checked');const f=document.getElementById('f'+i);f.classList.remove('hidden','good','bad');if(picked){answered++;if(Number(picked.value)===q[2]){score++;f.classList.add('good');f.textContent='إجابة صحيحة.'}else{f.classList.add('bad');f.textContent='الإجابة الصحيحة: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}}else{f.classList.add('bad');f.textContent='لم تتم الإجابة. الإجابة الصحيحة: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}});const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<h2>نتيجة الاختبار</h2><div class="score">'+score+' / 20</div><p>اسم التلميذ: '+(document.getElementById('student').value.trim().replace(/[&<>"]/g,'')||'غير مدخل')+'</p><p>عدد الأسئلة المجاب عنها: '+answered+' من 20.</p><button type="button" class="secondary" onclick="window.print()">طباعة النتيجة</button><button type="button" onclick="location.reload()">إعادة الاختبار</button>';r.scrollIntoView({behavior:'smooth'});btn.disabled=true;btn.textContent='تم تصحيح الاختبار';});
</script></body></html>
