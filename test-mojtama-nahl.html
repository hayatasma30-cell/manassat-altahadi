<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار مجتمع النحل | السنة الثانية متوسط</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#203128;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.wrap{max-width:820px;margin:auto;padding:18px}.hero,.q,.result{background:white;border:1px solid #dce6d8;border-radius:16px;padding:18px;margin:14px 0}.hero{border-top:6px solid #39794c}.sub{color:#5b6b60;font-size:14px}.q h3{font-size:17px;margin:0 0 12px}.opt{display:block;border:1px solid #dce4da;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt:has(input:checked){background:#edf6ed;border-color:#39794c}.opt input{margin-left:8px;accent-color:#39794c}button{border:0;border-radius:11px;padding:13px 18px;background:#2f7045;color:white;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin:8px 0}button.secondary{background:#e8eee6;color:#203128}.feedback{font-size:14px;padding:8px;border-radius:8px;margin-top:8px}.good{background:#e6f5e8;color:#205d2c}.bad{background:#fff0e8;color:#8a3b19}.hidden{display:none}.score{font-size:32px;font-weight:bold;color:#2f7045;text-align:center}
</style></head>
<body><main class="wrap">
<header class="hero"><h1>اختبار إلكتروني: مجتمع النحل</h1><div>علوم الطبيعة والحياة — السنة الثانية متوسط</div><p class="sub">20 سؤالًا مركبًا · اختر إجابة واحدة لكل سؤال · العلامة من 20</p><label>اسم التلميذ: <input id="student" style="padding:9px;border:1px solid #ccd8cb;border-radius:8px;width:100%;margin-top:6px" placeholder="اكتب اسمك الكامل"></label></header>
<form id="quiz"></form><section class="result hidden" id="result"></section>
</main>
<script>
const data = [
["تضم خلية النحل ملكة وعاملات وذكورًا. حدّد دور كل صنف.",["الملكة تضع البيوض، والعاملات تقوم بأعمال الخلية، والذكور تساهم في تلقيح الملكة.","الملكة تجمع الرحيق، والعاملات تلقح الملكة، والذكور تنظف الخلية.","الملكة تحرس المدخل، والعاملات تضع البيوض، والذكور تغذي اليرقات."],0],
["تعيش أعداد كبيرة من النحل في خلية واحدة. حدّد ما يفسر تنظيم هذا المجتمع وأهميته.",["تشابه كل المهام، مما يقلل حاجة الأفراد إلى التعاون.","التواصل وتقسيم المهام، مما يساعد على استمرار الخلية.","انفراد كل نحلة بعملها، مما يمنع تبادل المعلومات."],1],
["تعود عاملة إلى الخلية وتؤدي حركات متتابعة بعد عثورها على الرحيق. حدّد وسيلة التواصل ووظيفتها.",["الإشارات الكيميائية، لتنبيه العاملات إلى الخطر فقط.","التنبيهات اللمسية، لتحديد عمر اليرقات.","رقصة النحل، لإرشاد العاملات إلى مصدر الغذاء."],2],
["تؤثر الملكة في تنظيم الخلية بإشارات كيميائية. حدّد أثرًا لهذه الإشارات.",["المساهمة في تنظيم الخلية والحد من تربية ملكات جديدة في الظروف العادية.","توجيه العاملات مباشرة إلى مواقع الأزهار.","تحويل العاملات إلى ذكور عند نقص الغذاء."],0],
["تتغير مهام العاملة خلال حياتها. حدّد الاستنتاج الأدق حول العلاقة بين العمر والوظيفة.",["تبقى العاملة في وظيفة واحدة منذ خروجها حتى نهاية حياتها.","تتغير المهام التي تؤديها العاملة مع تقدمها في العمر.","تتحول العاملة تدريجيًا إلى ذكر عندما تكبر."],1],
["تزيل نحلة الأوساخ من العيون السداسية، وتمنع أخرى دخول حشرة غريبة. حدّد الوظيفتين.",["الأولى جامعة للرحيق والثانية مخزنة للعسل.","الأولى مغذية لليرقات والثانية مهوية للخلية.","الأولى منظفة والثانية حارسة للخلية."],2],
["تجمع بعض العاملات الرحيق، وتتولى أخريات تخزينه. حدّد العلاقة بين الوظيفتين.",["الجمع يوفر المادة الغذائية والتخزين يحفظها داخل الخلية.","الجمع يضع البيوض والتخزين يلقح الملكة.","الجمع يحرس الخلية والتخزين ينظف العيون السداسية."],0],
["تحرك عاملات أجنحتها داخل الخلية، وتقف أخريات عند المدخل. حدّد وظيفة كل مجموعة.",["الأولى تغذي اليرقات والثانية تجمع حبوب الطلع.","الأولى تساهم في التهوية والثانية تحمي مدخل الخلية.","الأولى تضع البيوض والثانية تخزن الرحيق."],1],
["تتولى عاملات تغذية اليرقات. حدّد نتيجة محتملة لإهمال هذه المهمة.",["تتوقف رقصة النحل وحدها دون أثر آخر.","يزداد عدد البيوض مباشرة.","يتأثر نمو الحضنة وقد يتأثر استمرار تجدد أفراد الخلية."],2],
["تختلف الملكة والعاملات والذكور في البنية والوظائف. حدّد ما يدل عليه هذا الاختلاف.",["تخصص أفراد المجتمع وتكامل أدوارهم.","أن كل صنف ينتمي إلى نوع مختلف.","أن أفراد الخلية لا يعتمد بعضها على بعض."],0],
["تشارك الذكور في التكاثر وتقوم العاملات بأعمال الخلية. حدّد سبب أهمية الدورين.",["كلا الصنفين يقتصر دوره على جمع الرحيق.","يساهم الذكور في تلقيح الملكة وتؤمن العاملات حاجات الخلية.","الذكور تضع البيوض والعاملات تلقح الملكة."],1],
["تعثر عاملات على مصدر غذاء وتنقل المعلومة إلى غيرها. حدّد أثر هذا التواصل.",["منع العاملات من الخروج من الخلية.","تحويل الرحيق إلى حبوب طلع.","توجيه العاملات إلى المصدر وتحسين استغلال الغذاء."],2],
["اقترح تلميذ أن جميع العاملات تؤدي الوظيفة نفسها طوال حياتها. حدّد التصحيح المناسب.",["تتغير مهام العاملات مع العمر؛ فقد تنظف الخلية ثم تؤدي مهامًا أخرى كالحراسة أو جمع الغذاء.","كل العاملات تجمع الرحيق منذ بداية حياتها دون أي تغيير.","تتناوب العاملات على وضع البيوض بدل الملكة."],0],
["تضع الملكة البيوض وتقوم العاملات بأعمال متنوعة. حدّد العلاقة بين التكاثر والخدمات التي تقدمها العاملات.",["وظيفتان متطابقتان يؤديهما الصنف نفسه.","وظيفتان مختلفتان ومتكاملتان تساعدان على استمرار المجتمع.","وظيفتان لا علاقة لهما ببقاء الخلية."],1],
["إذا ضعفت تهوية الخلية، حدّد النشاط الذي يساعد على تجديد الهواء.",["زيادة وضع البيوض من طرف العاملات.","تخزين الرحيق في العيون السداسية.","تحريك العاملات أجنحتها للمساهمة في التهوية."],2],
["تجمع العاملات الرحيق ثم تخزنه الخلية ويتحول تدريجيًا إلى عسل. حدّد المادة الأولية وفائدة التخزين.",["الرحيق مادة أولية للعسل، والتخزين يساعد على توفير الغذاء.","حبوب الطلع مادة أولية للبيوض، والتخزين يزيد التهوية.","الشمع مادة أولية للرحيق، والتخزين يحمي الملكة فقط."],0],
["إذا قل عدد العاملات الجامعة للغذاء، حدّد أثرًا مترابطًا محتملًا.",["تزداد كمية الغذاء المخزن وتتحسن تغذية اليرقات.","يقل وصول الغذاء إلى الخلية، وقد يتأثر التخزين وتغذية اليرقات.","تتوقف حراسة المدخل مباشرة لأنها الوظيفة نفسها."],1],
["تستخدم أفراد النحل إشارات كيميائية ورقصات وتنبيهات لمسية. حدّد القاسم المشترك بينها.",["كلها وسائل لنقل الغذاء إلى اليرقات.","كلها وسائل للدفاع الجسدي المباشر.","كلها وسائل تواصل تساهم في تنسيق أنشطة المجتمع."],2],
["يرى تلميذ أن خلية النحل مجرد أفراد في مكان واحد. حدّد الدليل الذي يدحض رأيه.",["وجود تقسيم للمهام وتواصل وتكامل بين أفراد الخلية.","اختلاف أحجام الأفراد فقط دون أي تعاون.","قيام كل نحلة بحياتها منفردة داخل الخلية."],0],
["اربط بين اختلاف الأفراد والتواصل وتقسيم المهام، ثم حدّد كيف تساعد هذه العوامل على استمرار مجتمع النحل.",["تمنع اختلافات الأفراد التعاون وتجعل الخلية غير منظمة.","يحقق تكامل الأدوار مع التواصل توفير الغذاء والحماية والتكاثر واستمرار المجتمع.","يعتمد استمرار المجتمع على الملكة وحدها ولا يتأثر بأعمال العاملات."],1]
];
const form=document.getElementById('quiz');
data.forEach((q,i)=>{const box=document.createElement('section');box.className='q';box.innerHTML='<h3>السؤال '+(i+1)+': '+q[0]+'</h3>'+q[1].map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="feedback hidden" id="f'+i+'"></div>';form.appendChild(box)});
const btn=document.createElement('button');btn.type='submit';btn.textContent='إنهاء الاختبار وإظهار النتيجة';form.appendChild(btn);
form.addEventListener('submit',e=>{e.preventDefault();let score=0,answered=0;data.forEach((q,i)=>{const picked=form.querySelector('input[name="q'+i+'"]:checked');const f=document.getElementById('f'+i);f.classList.remove('hidden','good','bad');if(picked){answered++;if(Number(picked.value)===q[2]){score++;f.classList.add('good');f.textContent='إجابة صحيحة.'}else{f.classList.add('bad');f.textContent='الإجابة الصحيحة: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}}else{f.classList.add('bad');f.textContent='لم تتم الإجابة. الإجابة الصحيحة: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}});const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<h2>نتيجة الاختبار</h2><div class="score">'+score+' / 20</div><p>اسم التلميذ: '+(document.getElementById('student').value.trim().replace(/[&<>"]/g,'')||'غير مدخل')+'</p><p>عدد الأسئلة المجاب عنها: '+answered+' من 20.</p><button type="button" class="secondary" onclick="window.print()">طباعة النتيجة</button><button type="button" onclick="location.reload()">إعادة الاختبار</button>';r.scrollIntoView({behavior:'smooth'});btn.disabled=true;btn.textContent='تم تصحيح الاختبار';});
</script></body></html>
