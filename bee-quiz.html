<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>نشاط مجتمع النحل | منصة التحدي</title>
<style>
:root{--green:#14532d;--green2:#267348;--pale:#eef7ec;--cream:#faf8ef;--ink:#18382a;--line:#dbe7d8;--gold:#efd28b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{background:linear-gradient(120deg,#103f28,#267348);color:white;padding:20px 16px;text-align:center}header h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}header p{margin:4px 0 0;color:#e4f3e5}
main{max-width:850px;margin:20px auto;padding:0 12px 40px}.intro,.qcard,.result{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #18382a0b;padding:18px;margin-bottom:16px}
.intro{border-top:5px solid var(--green)}.progressrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem;color:#496653}
.progress{height:8px;background:#e8efe5;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#267348;transition:width .2s}
.visual{height:150px;border-radius:13px;background:radial-gradient(circle at 75% 30%,#f9e7a7 0 7%,transparent 7.5%),linear-gradient(135deg,#e7f2d9,#c5e0b7 55%,#f5eed6);display:flex;align-items:center;justify-content:center;font-size:4.6rem;margin-bottom:14px;border:1px solid #d5e5ce}
.qtitle{font-size:1.1rem;font-weight:800;margin:0 0 12px}.options{display:grid;gap:9px}.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;cursor:pointer;transition:.15s}.opt:hover{border-color:#7cab88;background:#f8fcf7}.opt input{margin-top:7px;accent-color:var(--green);flex:0 0 auto}.letter{font-weight:bold;color:var(--green);min-width:22px}
.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:11px;padding:10px 18px;font-weight:bold}.primary{background:var(--green);color:white}.secondary{background:#e8f1e5;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:.9rem;color:#66786b}.result{text-align:center}.score{font-size:2rem;font-weight:900;color:var(--green)}.review{text-align:right;margin-top:16px}.review-item{border-top:1px solid var(--line);padding:10px 0}.good{color:#176b36}.bad{color:#a33b2f}
footer{text-align:center;color:#718072;font-size:.85rem;padding:0 12px 25px}
</style></head>
<body>
<header><h1>نشاط مجتمع النحل</h1><p>السنة الثانية متوسط · منصة التحدي</p></header>
<main>
<section class="intro"><strong>أبنائي التلاميذ،</strong> أجيبوا عن الأسئلة بعناية، واختاروا إجابة واحدة لكل سؤال. تظهر نتيجتكم بعد إنهاء الاختبار.
<div class="progressrow" style="margin-top:12px"><span id="progressText">السؤال 1 من 20</span><span id="answered">الإجابات: 0 / 20</span></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<div id="quiz"></div>
<section id="result" class="result" hidden></section>
</main><footer>تحدي 20/20 في العلوم الطبيعية · الأستاذة حياة</footer>
<script>
const questions = [
{q:"بالاعتماد على الوثيقة، حدّد أين يمكن أن يعيش نحل العسل في الطبيعة، وسمِّ المسكن الذي يضم أفراد مجتمعه.",v:"🌳🐝",o:["يعيش في تجاويف الأشجار والصخور، ويمكن أن يبني فيها أعشاشًا تضم الأقراص الشمعية وأفراد المجتمع.","يعيش داخل الأزهار، ويتخذ من بتلاتها مسكنًا دائمًا يضع فيه البيوض ويخزّن الغذاء.","يعيش فوق أوراق النباتات، ويصنع منها أقراصًا شمعية لتربية اليرقات وتخزين العسل.","يعيش داخل جحور يحفرها في التربة، ويستعملها دائمًا لتربية اليرقات وتخزين الغذاء."],a:0},
{q:"بالاعتماد على الوثيقة، حدّد ما المقصود بالنخاريب في خلية النحل، واذكر أهم وظائفها.",v:"🍯",o:["فتحات مدخل الخلية التي تسمح بدخول النحل وخروجه.","قنوات داخل الخلية تسمح بانتقال النحل بين أجزاء المسكن.","خلايا سداسية الشكل مبنية من الشمع، تُخزَّن فيها مواد غذائية وتُربّى فيها اليرقات.","تجاويف طبيعية في الأشجار والصخور يستعملها النحل لتبادل الغذاء."],a:2},
{q:"بالاعتماد على الوثيقة، حدّد الصفة المورفولوجية التي تميّز ذكر النحل، وبيّن دوره في التكاثر.",v:"🐝",o:["أرجل خلفية مهيّأة لجمع حبوب اللقاح، ويساهم في تزويد الخلية بالغذاء.","بطن طويل مخصّص لوضع البيوض، ويساهم في إنتاج أفراد جديدة داخل الخلية.","جسم كبير وبطن طويل، ويتولى رعاية اليرقات وتنظيف الأقراص الشمعية.","عينان مركبتان كبيرتان نسبيًا، ودوره التناسلي تلقيح الملكة أثناء رحلة التزاوج."],a:3},
{q:"بالاعتماد على الوثيقة، حدّد الصفة المورفولوجية التي تميّز النحلة العاملة، واذكر أهم المهام التي تقوم بها.",v:"🌼🐝",o:["عيون كبيرة نسبيًا وتقوم أساسًا بتلقيح الملكة.","أرجل خلفية مهيّأة لجمع حبوب اللقاح، وتساهم في جمع الغذاء ورعاية اليرقات والتنظيف والتهوية والدفاع.","جسم أكبر وبطن أطول، تختص بوضع البيوض وتنظيم التكاثر.","جسم طويل وأرجل مهيّأة للتزاوج، تقوم بإنتاج البيوض وتغذية المجتمع."],a:1},
{q:"بالاعتماد على الوثيقة، حدّد الصفة المورفولوجية التي تميّز ملكة النحل، وبيّن دورها في التكاثر مقارنةً بالعاملات.",v:"👑🐝",o:["أرجل خلفية مزوّدة بسلال لجمع حبوب اللقاح، تجمع الغذاء وتوزعه.","عيون كبيرة جدًا، تقوم بتلقيح الملكة وتساعد العاملات على تحديد مواقع الرحيق.","جسم أكبر وبطن أطول نسبيًا؛ وهي الأنثى الخصبة الأساسية التي تضع البيوض، بينما العاملات عقيمات وظيفيًا في الظروف العادية.","جسم صغير وأرجل مهيّأة للدفاع، تنظف الخلية وتهويها."],a:2},
{q:"دخلت خنفساء إلى خلية النحل. حدّد الفرد الذي يتولى الدفاع عن الخلية ضد المتطفلات، وبيّن أهمية ذلك.",v:"🛡️🐝",o:["الملكة مسؤولة عن الدفاع المباشر لأنها تضع البيوض.","الذكور تطرد المتطفلات لأنها تتولى تلقيح الملكة.","اليرقات تدافع عن الخلية لأنها تنمو في النخاريب.","العاملات تحرس مدخل الخلية وتواجه المتطفلات، مما يحمي الحضنة ومخزون الغذاء."],a:3},
{q:"اختفت جميع ذكور النحل من الخلية، وكانت الملكة قد تزاوجت سابقًا وخزّنت الحيوانات المنوية. حدّد النتيجة المتوقعة على التكاثر في الفترة القريبة.",v:"🔬🐝",o:["يمكن أن يستمر إنتاج البيوض الملقّحة باستعمال الحيوانات المنوية المخزّنة، رغم غياب الذكور عن الخلية.","يتوقف وضع البيوض مباشرة لأن الملكة تحتاج إلى وجود الذكور باستمرار.","تتولى العاملات تلقيح الملكة.","تتحول جميع البيوض إلى غير ملقّحة لأن غياب الذكور يمنع استعمال الحيوانات المنوية المخزّنة."],a:0},
{q:"بالاعتماد على الوثيقة، حدّد طبيعة الإشارات التي ترسلها الملكة، وبيّن أثرها في سلوك العاملات.",v:"👑〰️🐝",o:["إشارات صوتية تدل العاملات على موقع الغذاء.","إشارات لمسية تسمح بتبادل الغذاء وتحديد المسافة.","إشارات بصرية تساعد على تمييز اليرقات.","مواد كيميائية تسمى الفيرومونات، تنظّم سلوك العاملات وتثبط نمو مبايضهن وتحدّ من تربية ملكات جديدة في الظروف العادية."],a:3},
{q:"بالاعتماد على الوثيقة، حدّد طريقة التواصل التي تستعملها العاملات لإعلام بقية أفراد الخلية بمكان مصدر الغذاء.",v:"🌼🐝",o:["إفراز مواد كيميائية تمنع نمو مبايض العاملات.","أداء رقصة مميزة، خاصة رقصة الاهتزاز على شكل الرقم ثمانية، تنقل معلومات عن اتجاه مصدر الغذاء وبعده عن الخلية.","تبادل الغذاء من الفم إلى الفم.","إصدار أصوات مرتفعة تحدد نوع الأزهار ولونها دون الموقع."],a:1},
{q:"بالاعتماد على الوثيقة، حدّد طريقة التواصل التي تستعملها النحلة العاملة لتقاسم الغذاء مع أفراد الخلية، وبيّن أهميتها.",v:"🍯🐝",o:["إصدار أصوات خاصة داخل الخلية.","أداء رقصة مميزة لتحديد مصدر الغذاء.","إفراز مواد كيميائية توجّه العاملات لمصادر الغذاء.","التبادل الغذائي مباشرة من الفم إلى الفم، ما يسمح بنقل الغذاء بين أفراد الخلية."],a:3},
{q:"بالاعتماد على الوثيقة، حدّد الدور الأساسي لملكة النحل، واستنتج أهمية ذلك في استمرار المجتمع.",v:"👑🥚",o:["جمع الرحيق وحبوب اللقاح.","حراسة مدخل الخلية.","وضع البيوض، وقد تصل وتيرة وضعها في ذروة الموسم والظروف الملائمة إلى نحو 2000 بيضة يوميًا أو أكثر، مما يساهم في إنتاج أفراد جديدة.","تنظيف النخاريب وتهوية الخلية."],a:2},
{q:"بالاعتماد على الوثيقة، قارن بين دور الذكر ودور الملكة في التكاثر.",v:"🐝🥚",o:["الذكر يساهم في تلقيح الملكة أثناء رحلة التزاوج، والملكة تضع البيوض داخل النخاريب.","الذكر يضع البيوض، والملكة تجمع الرحيق.","الذكر يرعى اليرقات وينظف الخلية، والملكة تحرس المدخل.","الذكر يجمع الغذاء، والملكة تهوي الخلية."],a:0},
{q:"بالاعتماد على الوثيقة، حدّد الدور الذي يميّز العاملات مقارنةً بالملكة والذكر، واستنتج أهمية تقسيم المهام.",v:"🐝🌿",o:["العاملات تلقح الملكة، والملكة تضع البيوض، والذكر يجمع الرحيق.","العاملات تضع البيوض وتؤسس المجتمع، والملكة تجمع حبوب اللقاح.","العاملات تنتج البيوض الملقحة، والذكر يرعى اليرقات والملكة تحرس الخلية.","العاملات تنجز معظم الأعمال اليومية، كرعاية اليرقات وجمع الغذاء والتنظيف والتهوية والدفاع، ما يلبي حاجات الخلية."],a:3},
{q:"توقفت العاملات عن جمع الرحيق وحبوب اللقاح، وعن تنظيف الخلية وتهويتها ورعاية اليرقات. توقّع أثر ذلك على حياة مجتمع النحل.",v:"🌼🏠",o:["يستمر المجتمع بصورة عادية لأن الملكة تتولى مهام العاملات.","يختل توازن الخلية بسبب نقص الغذاء وتراجع رعاية اليرقات وضعف التهوية والنظافة، مما يهدد بقاء المجتمع.","يزداد نمو اليرقات لأن غياب العاملات يزيد الغذاء.","يتوقف الذكور عن تلقيح الملكة فقط."],a:1},
{q:"لاحظ مربّي النحل أن العاملات تقتسم الغذاء وتنسّق أعمالها داخل الخلية. حدّد العلاقة التي تفسّر هذا السلوك، وبيّن أهميتها.",v:"🤝🐝",o:["تنافس على الغذاء والتكاثر.","افتراس الملكة والذكور للعاملات.","انعزال كل فرد عن بقية أفراد الخلية.","تعاون وتكامل، وتبادل للغذاء وتوزيع للمهام لتلبية حاجات المجتمع."],a:3},
{q:"توجد في خلية نحل ملكة وعاملات، لكن الملكة غائبة عن وضع البيوض، ولم تتمكن العاملات من تربية ملكة بديلة. حدّد الأثر المتوقع على استمرار المجتمع على المدى البعيد.",v:"🏠🐝",o:["تنتج العاملات إناثًا جديدة بصورة عادية.","تضع الذكور البيوض الملقحة.","يتراجع إنتاج أفراد جديدة وقد يتناقص المجتمع تدريجيًا بسبب غياب الملكة وعدم تعويضها، رغم استمرار العاملات في بعض المهام لفترة.","تتحول العاملات تلقائيًا إلى ملكات خصبات."],a:2},
{q:"دخلت حشرات متطفلة إلى الخلية، لكن العاملات لم تحرس المدخل ولم تواجهها. استنتج النتيجة الأكثر احتمالًا.",v:"🛡️🐝",o:["قد تتضرر الخلية أو تفقد جزءًا من الغذاء أو تصاب الحضنة، لأن العاملات تحرس وتدافع.","تطرد الملكة جميع المتطفلات بنفسها.","تحرس الذكور المدخل دائمًا.","لا تتأثر الخلية بوجود الحشرات المتطفلة."],a:0},
{q:"توجد في خلية نحل ملكة وعاملات، لكن جميع الذكور اختفت، وكانت الملكة حديثة العهد ولم تتزاوج من قبل. حدّد النتيجة المتوقعة على التكاثر.",v:"🐝🔬",o:["تنتج الملكة بيوضًا ملقحة عاديًا لأن العاملات تعوّض الذكور.","يتعذر تلقيح الملكة، وقد تضع بيوضًا غير ملقحة يمكن أن تعطي ذكورًا، لكن إنتاج الإناث من البيوض الملقحة يتعذر دون تلقيحها.","تتوقف العاملات عن جمع الغذاء.","تتحول العاملات إلى ذكور."],a:1},
{q:"حدّد التعريف العلمي للمجتمع الحيواني من بين الاقتراحات.",v:"🐝🐝🐝",o:["حيوانات من أنواع مختلفة تعيش في مكان واحد دون تفاعل.","حيوانات تعيش منفردة ولا تتفاعل فيما بينها.","تجمع مؤقت حول الغذاء دون تنظيم أو علاقات بين الأفراد.","مجموعة من أفراد النوع نفسه تعيش في مجال معين وتتفاعل فيما بينها وتؤدي أدوارًا تساهم في استمرار حياتها."],a:3},
{q:"حدّد الخاصية الأساسية التي تميّز مجتمع النحل عن تجمع عشوائي للحشرات.",v:"🐝🤝",o:["كل فرد يعيش منفردًا ويؤدي جميع الوظائف.","تتنافس جميع الأفراد وتؤدي الملكة والذكور والعاملات المهام نفسها.","التعاون والتواصل وتقسيم المهام بين الملكة والذكور والعاملات، ما يساعد على تلبية حاجات الخلية واستمرار المجتمع.","تتجمع النحلات حول الغذاء دون تقسيم مهام أو تواصل."],a:2}
];
let current=0, answers=Array(questions.length).fill(null);
const quiz=document.getElementById('quiz'),bar=document.getElementById('bar'),progressText=document.getElementById('progressText'),answered=document.getElementById('answered');
function updateProgress(){let n=answers.filter(x=>x!==null).length;bar.style.width=(n/questions.length*100)+'%';answered.textContent='الإجابات: '+n+' / '+questions.length;progressText.textContent='السؤال '+Math.min(current+1,questions.length)+' من '+questions.length}
function render(){updateProgress();if(current>=questions.length){showResult();return}const x=questions[current];quiz.innerHTML='<section class="qcard"><div class="visual" aria-hidden="true">'+x.v+'</div><p class="qtitle">'+(current+1)+'. '+x.q+'</p><div class="options">'+x.o.map((t,i)=>'<label class="opt"><input type="radio" name="answer" value="'+i+'" '+(answers[current]===i?'checked':'')+'><span class="letter">'+['أ','ب','ج','د'][i]+'</span><span>'+t+'</span></label>').join('')+'</div><div class="controls"><button class="btn secondary" id="prev" '+(current===0?'disabled':'')+'>السابق</button><button class="btn primary" id="next">'+(current===questions.length-1?'إنهاء الاختبار':'السؤال التالي')+'</button></div></section>';quiz.querySelectorAll('input').forEach(el=>el.addEventListener('change',e=>{answers[current]=Number(e.target.value);updateProgress()}));document.getElementById('prev').onclick=()=>{current--;render();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('next').onclick=()=>{if(answers[current]===null){alert('اختر إجابة قبل الانتقال إلى السؤال التالي.');return}current++;render();window.scrollTo({top:0,behavior:'smooth'})}}
function showResult(){quiz.hidden=true;let score=answers.reduce((s,a,i)=>s+(a===questions[i].a?1:0),0);let box=document.getElementById('result');box.hidden=false;box.innerHTML='<h2>انتهى الاختبار!</h2><div class="score">'+score+' / '+questions.length+'</div><p>أحسنت المحاولة! راجع إجاباتك وتعرّف على الأسئلة التي تحتاج إلى مراجعة.</p><div class="review">'+questions.map((q,i)=>'<div class="review-item"><strong>السؤال '+(i+1)+' — <span class="'+(answers[i]===q.a?'good':'bad')+'">'+(answers[i]===q.a?'إجابة صحيحة':'إجابة غير صحيحة')+'</span></strong><div>'+q.q+'</div><div>الإجابة العلمية: '+['أ','ب','ج','د'][q.a]+'. '+q.o[q.a]+'</div></div>').join('')+'</div><button class="btn primary" onclick="location.reload()">إعادة الاختبار</button>';updateProgress();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
