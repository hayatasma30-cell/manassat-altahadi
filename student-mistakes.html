<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>منصة التحدي</title><style>
:root{--g:#14532d;--g2:#287447;--cream:#faf8ee;--ink:#18382a;--muted:#68776c;--line:#dfe8dc;--pale:#edf7eb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f8f6e9,#edf6eb);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{background:linear-gradient(120deg,#103f28,#1f7747);color:#fff;padding:16px 18px;box-shadow:0 4px 18px #143e2518}header strong{font-size:1.1rem}.wrap{max-width:760px;margin:auto;padding:15px}.student{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:7px 0 14px;display:flex;align-items:center;gap:12px}.avatar{font-size:2.2rem}.student h2{margin:0;color:var(--g);font-size:1.15rem}.tag{display:inline-block;background:#e8f5e8;color:var(--g);padding:2px 10px;border-radius:30px;font-size:.8rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 7px 20px #204c240c}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--g);background:#eaf5e7;border:1px solid #c9dfc7;border-bottom:4px solid #d4e6d0;border-radius:14px;padding:10px 15px;font-weight:bold;margin:0 0 13px}
h1{font-size:1.3rem;color:var(--g);margin:0 0 13px;padding-bottom:10px;border-bottom:1px solid #edf1e9}
.item{background:#fcfdf9;border:1px solid #e2e9dc;border-radius:13px;padding:13px;margin:9px 0}.item strong{color:var(--g)}.muted{color:var(--muted);font-size:.9rem}.empty{background:#f7f8f1;border:1px dashed #dfe7d8;border-radius:13px;padding:15px;color:var(--muted)}
.score{display:flex;align-items:center;justify-content:space-between;background:#f0f8ed;border:1px solid #dbe9d7;border-radius:12px;padding:9px 12px;margin:9px 0}.score b{font-size:1.2rem;color:var(--g)}
details{border:1px solid #e2e9dc;border-radius:12px;margin:9px 0;background:#fff}summary{padding:11px;cursor:pointer;color:var(--g);font-weight:bold}details .body{padding:0 13px 12px;border-top:1px solid #edf1e9}footer{text-align:center;color:var(--muted);font-size:.8rem;padding:22px}
</style></head><body><header><strong>🌿 منصة التحدي</strong><div style="font-size:.8rem;color:#d8eadb">فضاء التلميذ • علوم الطبيعة والحياة</div></header><main class="wrap"><div class="student"><div class="avatar">👩‍🎓</div><div><div class="muted">فضاء التلميذ</div><h2 id="studentName">جارٍ تحميل بياناتك…</h2><span id="studentLevel" class="tag">—</span></div></div><a class="back" href="student-space.html">← العودة إلى فضائي</a><section class="panel"><h1 id="title">جارٍ التحميل…</h1><div id="content"><div class="empty">جارٍ تحميل بياناتك…</div></div></section></main><footer>منصة التحدي التعليمية • الأستاذة حياة أسماء</footer><script>
const PAGE="mistakes";
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/earthquakes-quiz";
const $=id=>document.getElementById(id);
const safe=x=>String(x??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=x=>{if(!x)return "—";const d=new Date(x);return isNaN(d)?safe(x):d.toLocaleDateString("ar-DZ")};
async function load(){const token=localStorage.getItem("tahadi_student_session");if(!token)throw Error("انتهت جلسة الدخول. عودي إلى فضاء التلميذ وسجّلي الدخول مجددًا.");const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"student_portal_dashboard",session_token:token})});const d=await res.json();if(!res.ok||!d.ok)throw Error(d.error||"تعذر تحميل البيانات.");if(!d.student)throw Error("لم تصل بيانات التلميذ.");$("studentName").textContent=d.student.full_name||"التلميذ";$("studentLevel").textContent=d.student.level||"المستوى الدراسي";render(d)}
function render(d){const attempts=(d.quiz_attempts||[]).filter(a=>a.submitted_at).sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));const notes=attempts.filter(a=>String(a.teacher_note||"").trim());const bank={1:"يتمثل الزلزال في:",2:"يتميز الزلزال بمجموعة من الخصائص، منها:",3:"ما الفرق بين مقدار الزلزال وشدته؟",4:"المركز السطحي هو:",5:"الموجات الزلزالية هي:",6:"تتعلق كثافة الخسائر التي تحدث على سطح الأرض بـ:",7:"ما العلاقة بين مقدار الزلزال وشدته؟",8:"تُقاس شدة الزلزال بسلم:",9:"ما المقصود بعمق البؤرة الزلزالية؟",10:"ماذا يسمى التسجيل الزلزالي؟",11:"مقدار الزلزال هو:",12:"منحنيات متساوية الشدة هي:",13:"كلما ابتعدنا عن المركز السطحي للزلزال:",14:"في نفس موقع الزلزال، تختلف الخسائر حسب:",15:"تتميز المنطقة الزلزالية بـ:",16:"تسمح دراسة التسجيل الزلزالي بـ:",17:"تُقدَّر شدة الزلزال في منطقة معينة اعتمادًا على:",18:"تنتشر الموجات الزلزالية من البؤرة نحو سطح الأرض:",19:"عند مقارنة منطقتين تعرضتا للزلزال نفسه، يمكن أن تكون الخسائر أكبر في المنطقة التي:",20:"ما الفرق بين السيسموغراف والسيسموغرام؟"};
const letters=["A","B","C","D"];
const correct={1:"A",2:"A",3:"A",4:"B",5:"A",6:"D",7:"C",8:"B",9:"C",10:"C",11:"B",12:"D",13:"B",14:"B",15:"C",16:"C",17:"B",18:"C",19:"D",20:"D"};
const questionOptions={1:["اهتزاز مفاجئ لسطح الأرض تنتشر خلاله موجات زلزالية انطلاقًا من البؤرة.","اهتزاز تدريجي لسطح الأرض تنتشر خلاله موجات زلزالية انطلاقًا من البؤرة.","اهتزاز مفاجئ لسطح الأرض تنتشر خلاله موجات زلزالية انطلاقًا من المركز السطحي.","تشوه دائم لسطح الأرض تنتشر خلاله موجات زلزالية انطلاقًا من البؤرة."],2:["تاريخ حدوثه، مدته، عمق بؤرته، مقداره، وشدة الأضرار الناتجة عنه."],3:["المقدار يعبّر عن الطاقة المحررة في البؤرة، أما الشدة فتعبّر عن الآثار والأضرار في منطقة معينة."],4:["النقطة الموجودة في باطن الأرض التي تنطلق منها الموجات الزلزالية.","النقطة الموجودة على سطح الأرض والواقعة عموديًا فوق البؤرة."],5:["حركات تنتشر في الصخور نتيجة حدوث الزلزال."],6:["","","","مقدار الزلزال وعمق بؤرته، والمسافة عن المركز السطحي، وطبيعة التربة ومقاومة المباني وكثافة السكان."],7:["","","العلاقة بين المقدار والشدة: المقدار للطاقة والشدة للأضرار."],8:["","ميركالي."],9:["","","المسافة العمودية بين البؤرة والمركز السطحي."],10:["","","السيسموغرام."],11:["","مقياس للطاقة المحررة أثناء الزلزال."],12:["","","","خطوط تصل بين النقاط التي لها الشدة الزلزالية نفسها."],13:["","تتناقص شدة الاهتزازات وتتناقص الخسائر عادةً."],14:["","طبيعة التربة ومقاومة المباني وكثافة السكان."],15:["","","تسجيل زلازل سابقة، ووجود تضاريس جبلية وفوالق."],16:["","","معرفة زمن وصول الموجات الزلزالية وخصائصها."],17:["","الآثار الملاحظة والأضرار المسجلة في المنطقة."],18:["","","في جميع الاتجاهات."],19:["","","","تضم مباني هشة وتربة قد تضخم الاهتزازات وكثافة سكانية مرتفعة."],20:["","","","السيسموغراف جهاز التسجيل، والسيسموغرام هو التسجيل الناتج عنه."]};
let html="";
if(PAGE==="results"){ $("title").textContent="📝 نتائج الاختبارات الإلكترونية";if(!attempts.length){html='<div class="empty">لا توجد نتائج اختبارات محفوظة لحسابك حتى الآن.</div>'}else{html='<div class="item"><strong>ملخص تقدّمك</strong><p>عدد الاختبارات المرسلة: <b>'+attempts.length+'</b></p><p>آخر علامة: <b>'+safe(attempts[0].teacher_score??attempts[0].auto_score??"قيد التصحيح")+' / '+safe(attempts[0].auto_max_score??20)+'</b></p></div>';for(const a of attempts){html+='<article class="item"><strong>'+safe(a.quiz_title||"اختبار إلكتروني")+'</strong><p class="muted">تاريخ المحاولة: '+date(a.submitted_at)+'</p><div class="score"><span>العلامة</span><b>'+safe(a.teacher_score??a.auto_score??"قيد التصحيح")+' / '+safe(a.auto_max_score??20)+'</b></div><details><summary>عرض الإجابات والتصحيح</summary><div class="body">'+(a.review||[]).map(q=>'<p><b>'+safe(q.question)+'</b></p><p>إجابتي: '+safe(q.chosen_text)+'</p><p>الإجابة الصحيحة: '+safe(q.correct)+'. '+safe(q.correct_text)+'</p>').join("")+'</div></details></article>'}}}
else if(PAGE==="mistakes"){$("title").textContent="💡 أخطائي وتصحيح الإجابات";let mistakes=[];for(const a of attempts){for(const [n,ans] of Object.entries(a.selected_answers||{})){const chosen=String(ans||"").toUpperCase();if(chosen!==correct[n]){const i=letters.indexOf(chosen),ci=letters.indexOf(correct[n]);mistakes.push({q:bank[n]||("السؤال "+n),wrong:i>=0&&questionOptions[n]?.[i]?letters[i]+". "+questionOptions[n][i]:"لم تتم الإجابة",right:letters[ci]+". "+(questionOptions[n]?.[ci]||"الإجابة الصحيحة المسجلة"),date:a.submitted_at,title:a.quiz_title||"اختبار إلكتروني"})}}}if(!mistakes.length)html='<div class="empty">🌟 أحسنت! لا توجد إجابات خاطئة أو أسئلة متروكة في الاختبارات المسلَّمة.</div>';else html=mistakes.map(m=>'<details><summary>'+safe(m.q)+' <span class="muted">• '+date(m.date)+'</span></summary><div class="body"><p><b>الاختبار:</b> '+safe(m.title)+'</p><p><b>إجابتي:</b> '+safe(m.wrong)+'</p><p><b>التصحيح الصحيح:</b> '+safe(m.right)+'</p></div></details>').join("")}
else{$("title").textContent="💬 ملاحظات الأستاذة";if(!notes.length)html='<div class="empty">لا توجد ملاحظات من الأستاذة مسجلة حاليًا. ستظهر هنا عندما تضيف الأستاذة ملاحظة إلى نتيجة أحد اختباراتك.</div>';else html=notes.map(a=>'<article class="item"><strong>'+safe(a.quiz_title||"ملاحظة على اختبار")+'</strong><p>'+safe(a.teacher_note)+'</p><span class="muted">'+date(a.submitted_at)+'</span></article>').join("")}
$("content").innerHTML=html}
load().catch(e=>{$("title").textContent="تعذر تحميل الصفحة";$("content").innerHTML='<div class="empty">'+safe(e.message)+'</div>'});
</script></body></html>
