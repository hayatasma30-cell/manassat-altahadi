name: Recover stuck GitHub Pages deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-stuck-pages.yml"

permissions:
  pages: write
  deployments: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Mark the stale Pages deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT_ID: "7470675311"
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${STALE_DEPLOYMENT_ID}/statuses" \
            -f state=inactive \
            -f description="Release stale GitHub Pages deployment lock"
          echo "Marked stale Pages deployment inactive."
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${STALE_DEPLOYMENT_ID}/statuses?per_page=1" \
            --jq '.[] | [.id,.state,.created_at,.description] | @tsv'

      - name: Remove the one-time recovery workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/recover-stuck-pages.yml"
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message="Remove one-time Pages recovery workflow" \
            -f sha="${file_sha}"
          echo "Removed the temporary recovery workflow.";
