name: Check Tahadi Telegram bot draft
on:
  pull_request:
    paths:
      - 'drafts/telegram-tahadi-bot-index.ts'
      - '.github/workflows/bot-draft-check.yml'
  push:
    branches:
      - 'bot-menu-results-draft-2026-10-22'
    paths:
      - 'drafts/telegram-tahadi-bot-index.ts'
      - '.github/workflows/bot-draft-check.yml'
jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check draft without running it
        run: deno check drafts/telegram-tahadi-bot-index.ts
