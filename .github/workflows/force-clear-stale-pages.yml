name: Force clear stale Pages workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/force-clear-stale-pages.yml"

permissions:
  actions: write
  pages: write
  contents: write

jobs:
  force-clear:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel stale workflow and Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_RUN_ID: "41288160151"
          STALE_SHA: "2b843f2e099a6294bcb16a26e88c914ed30df4e4"
        shell: bash
        run: |
          set +e
          echo "Attempting force-cancel for stale workflow run ${STALE_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/force-cancel"
          echo "force_cancel_exit=$?"
          echo "Attempting Pages deployment cancellation for ${STALE_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_SHA}/cancel"
          echo "pages_cancel_exit=$?"
          echo "Diagnostic cancellation attempts finished."

      - name: Remove this one-time workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/force-clear-stale-pages.yml"
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message="Remove one-time stale Pages force-cancel workflow" \
            -f sha="${file_sha}"
