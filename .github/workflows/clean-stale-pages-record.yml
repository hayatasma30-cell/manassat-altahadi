name: Clean stale Pages deployment record

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clean-stale-pages-record.yml"

permissions:
  deployments: write
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the inactive stale deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT_ID: "7470675311"
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${STALE_DEPLOYMENT_ID}"
          echo "Removed the inactive stale deployment record."

      - name: Remove this one-time cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/clean-stale-pages-record.yml"
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message="Remove one-time stale Pages cleanup workflow" \
            -f sha="${file_sha}"
          echo "Removed the temporary cleanup workflow.";
