<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/daily-challenge";const token=localStorage.getItem("tahadi_teacher_token");let questions=[],editingId=null,currentChallenge=null;

}
function captureQuestions(){questions=[...$("questions").children].map(el=>{const type=el.querySelector(".qtype").value;const opts=type==="mcq"?[...el.querySelectorAll(".opt")].map(x=>x.value.trim()):[];const correct=el.querySelector(".correct");const idx=type==="mcq"&&correct?Number(correct.value):0;return{id:el.dataset.id,type,text:el.querySelector(".qt").value,options:opts,correct_answer:type==="mcq"?(opts[idx]||""):"",points:Number(el.querySelector(".points").value)||1};});}
$("questions").addEventListener("change",e=>{if(e.target.classList.contains("qtype")){captureQuestions();renderQuestions();}});
window.removeQ=id=>{questions=questions.filter(q=>q.id!==id);renderQuestions()};
function readQuestions(){captureQuestions();return questions;}
function setEmbedPanel(page){["editor","list","results"].forEach(id=>{const active=id===page;const panel=$(id);panel.classList.toggle("active-panel",active);panel.classList.toggle("hidden",!active);panel.classList.toggle("embed-active",active);panel.style.setProperty("display",active?"block":"none","important");});if(location.hash!=="#"+page)history.replaceState(null,"",location.pathname+location.search+"#"+page);fitEmbeddedFrame();window.scrollTo({top:0,behavior:"instant"});}
function reset(){editingId=null;questions=[];$("title").value="";$("description").value="";$("level").value="الكل";$("starts").value="";$("ends").value="";$("duration").value=10;$("formTitle").textContent="إعداد تحدٍّ جديد";$("publishBtn").classList.add("hidden");$("cancelEdit").classList.add("hidden");renderQuestions();addQuestion();autoGrowDescription()}
function dateValue(v){return v?new Date(v).toISOString().slice(0,16):""}
function challengeStatusLabel(status){return status==="draft"?"مسودة":status==="published"?"منشور":status==="closed"?"منتهٍ":String(status||"غير محدد")}
async function load(){const list=$("challengeListItems");list.innerHTML='<div class="item muted" style="text-align:center;padding:18px">جارٍ تحميل التحديات من قاعدة البيانات…</div>';fitEmbeddedFrame();try{
 const d=await call("teacher_list");
 const items=Array.isArray(d.items)?d.items:[];
 list.innerHTML=items.length?items.map(x=>{
  const count=(x.questions||[]).length;
  const status=challengeStatusLabel(x.status);
  const date=x.created_at?new Date(x.created_at).toLocaleDateString("ar-DZ"):"";
  return '<article class="item challenge-card"><div class="challenge-card-top"><h3>'+esc(x.title)+'</h3><span class="challenge-status '+(x.status==="published"?"is-published":x.status==="draft"?"is-draft":"is-closed")+'">'+status+'</span></div><div class="challenge-meta"><span><b>المستوى</b>'+esc(x.target_level||"الكل")+'</span><span><b>الأسئلة</b>'+count+' سؤال</span>'+(date?'<span><b>تاريخ الإنشاء</b>'+date+'</span>':'')+'</div><div class="challenge-actions"><button class="btn alt" onclick="showResults(\''+x.id+'\')">المشاركات والنتائج</button>'+(x.status==="draft"?'<button class="btn alt" onclick="editChallenge(\''+x.id+'\')">متابعة التعديل وإضافة الأسئلة</button><button class="btn" onclick="publishChallenge(\''+x.id+'\')">نشر التحدي</button>':'')+(x.status==="published"?'<button class="btn warn" onclick="closeChallenge(\''+x.id+'\')">إنهاء المشاركة</button>':'')+'</div></article>';
 }).join(""):'<div class="item" style="text-align:center;padding:20px"><strong style="color:#14532d">لا توجد تحديات محفوظة بعد</strong><p class="muted">اضغطي على «تحدٍّ جديد» لإنشاء أول تحدٍّ لك.</p></div>';
 }catch(e){list.innerHTML='<div class="item" style="text-align:center;padding:18px"><strong style="color:#923c2d">تعذر تحميل مكتبة التحديات</strong><p class="muted">'+esc(e.message)+'</p></div>';}finally{fitEmbeddedFrame();requestAnimationFrame(()=>requestAnimationFrame(fitEmbeddedFrame));setTimeout(fitEmbeddedFrame,120);setTimeout(fitEmbeddedFrame,400);}}
window.editChallenge=id=>{call("teacher_list").then(d=>{const x=d.items.find(a=>a.id===id);if(!x)return;setEmbedPanel("editor");$("results").classList.add("hidden");editingId=id;$("title").value=x.title;$("description").value=x.description||"";$("level").value=x.target_level;$("starts").value=dateValue(x.starts_at);$("ends").value=dateValue(x.ends_at);$("duration").value=x.duration_minutes;$("formTitle").textContent="تعديل مسودة التحدي";questions=(x.questions||[]).map(q=>({...q}));renderQuestions();autoGrowDescription();$("publishBtn").classList.remove("hidden");$("cancelEdit").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"})}).catch(e=>message(e.message))};
window.publishChallenge=async id=>{if(!confirm("هل تريدين نشر هذا التحدي للتلاميذ؟"))return;try{await call("teacher_publish",{id});message("تم نشر التحدي.");load()}catch(e){message(e.message)}};
window.closeChallenge=async id=>{if(!confirm("إنهاء استقبال المشاركات في هذا التحدي؟"))return;try{await call("teacher_close",{id});message("تم إنهاء المشاركة.");load()}catch(e){message(e.message)}};
window.showResults=async id=>{try{const d=await call("teacher_submissions",{id});$("results").classList.remove("hidden");setEmbedPanel("results");const written=(d.questions||[]).filter(q=>q.type==="written");const maxWritten=written.reduce((n,q)=>n+Math.max(1,Number(q.points)||1),0);$("resultList").innerHTML=d.submissions.length?d.submissions.map((x,i)=>'<article class="item"><strong>'+(i+1)+'. '+esc(x.students?.full_name||"تلميذ")+'</strong><p>المستوى: '+esc(x.students?.level||"—")+' · العلامة الحالية: '+(Number(x.score||0)+Number(x.manual_score||0))+'/'+x.max_score+(written.length?' · '+(x.manual_reviewed?'تم تصحيح الإجابة النصية':'بانتظار تصحيح الإجابة النصية'):'')+'</p><p class="muted">وقت الإرسال: '+new Date(x.submitted_at).toLocaleString("ar-DZ")+'</p>'+(written.length?'<div class="written-review"><strong>الإجابات النصية</strong>'+written.map((q,n)=>'<div class="written-answer"><b>السؤال: '+esc(q.text)+'</b><p>'+esc((x.answers||{})[q.id]||"لم يكتب التلميذ إجابة.")+'</p><small>النقاط المخصصة: '+(q.points||1)+'</small></div>').join("")+'<label>علامة الإجابات النصية (من '+maxWritten+')</label><input class="manual-score" type="number" min="0" max="'+maxWritten+'" step="0.5" value="'+(x.manual_score||0)+'"><label>ملاحظة الأستاذة</label><textarea class="teacher-note" rows="2">'+esc(x.teacher_note||"")+'</textarea><button class="btn alt" onclick="gradeChallenge(\''+id+'\',\''+x.id+'\',this)">حفظ التصحيح</button></div>':'')+'<button class="btn alt" onclick="setWinner(\''+id+'\',\''+x.id+'\')">اعتماد فائز التحدي</button></article>').join(""):'لم تصل مشاركات بعد.';$("results").scrollIntoView({behavior:"smooth"})}catch(e){message(e.message)}};
window.gradeChallenge=async(id,submissionId,button)=>{const box=button.closest(".written-review"),manual_score=Number(box.querySelector(".manual-score").value),teacher_note=box.querySelector(".teacher-note").value;button.disabled=true;try{const d=await call("teacher_grade",{id,submission_id:submissionId,manual_score,teacher_note});message("تم حفظ التصحيح. العلامة النهائية: "+d.final_score);await showResults(id)}catch(e){message(e.message)}finally{button.disabled=false}};
window.setWinner=async(id,submission_id)=>{if(!confirm("اعتماد هذا التلميذ فائزًا بالتحدي؟"))return;try{await call("teacher_winner",{id,submission_id});message("تم اعتماد الفائز.");}catch(e){message(e.message)}};
$("backToLibrary").onclick=()=>{setEmbedPanel("list");load()};$("addQ").onclick=()=>addQuestion();$("addQBottom").onclick=()=>{addQuestion();const cards=$("questions").children;cards[cards.length-1]?.scrollIntoView({behavior:"smooth",block:"center"});};$("newBtn").onclick=()=>{setEmbedPanel("editor");$("results").classList.add("hidden");reset()};$("newFromLibrary").onclick=()=>{setEmbedPanel("editor");reset()};$("backToChallengeList").onclick=()=>{ $("results").classList.add("hidden");setEmbedPanel("list");load()};$("cancelEdit").onclick=reset;
$("saveBtn").onclick=async()=>{try{const d=await call("teacher_save",{id:editingId,title:$("title").value,description:$("description").value,target_level:$("level").value,starts_at:$("starts").value?new Date($("starts").value).toISOString():null,ends_at:$("ends").value?new Date($("ends").value).toISOString():null,duration_minutes:Number($("duration").value),questions:readQuestions()});editingId=d.item.id;$("publishBtn").classList.remove("hidden");$("cancelEdit").classList.remove("hidden");message("حُفظت المسودة بنجاح. ستجدينها في مكتبة التحديات، ويمكنك العودة إليها لإضافة بقية الأسئلة.");await load();setEmbedPanel("list")}catch(e){message(e.message)}};
$("publishBtn").onclick=()=>publishChallenge(editingId);const initialPage=location.hash==="#editor"?"editor":location.hash==="#results"?"results":"list";
setEmbedPanel(initialPage);
reset();load();
if(location.hash){setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:"smooth",block:"start"}),250)}
if(document.body.classList.contains("embed")&&"ResizeObserver" in window){const ro=new ResizeObserver(fitEmbeddedFrame);ro.observe(document.body);window.addEventListener("load",fitEmbeddedFrame);setTimeout(fitEmbeddedFrame,100);setTimeout(fitEmbeddedFrame,500);}
</script></body></html>
