<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التحدي اليومي | منصة التحدي</title><style>
:root{--g:#286b45;--bg:#f5f7f1;--line:#dce6d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24352a;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.head,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px #203b2010}.head{background:linear-gradient(135deg,#edf5e9,#fff)}h1{font-size:22px;margin:0 0 8px;color:var(--g)}h2{font-size:18px;margin:0 0 14px}p{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:14px;font-weight:bold;margin:10px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd9ca;border-radius:10px;font:inherit;background:#fff}textarea{min-height:75px;resize:vertical}.q{border:1px solid var(--line);padding:13px;border-radius:12px;margin:12px 0;background:#fbfcf9}.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:bold;cursor:pointer;background:var(--g);color:white;margin:5px 3px;box-shadow:0 3px 0 #194b30}.btn.alt{background:#e9f1e8;color:#245c3c;box-shadow:0 3px 0 #cadbca}.btn.warn{background:#a54c36;box-shadow:0 3px 0 #783625}.muted{color:#6c7c70;font-size:13px}.msg{padding:10px;border-radius:10px;background:#edf5e9;margin:10px 0;white-space:pre-wrap}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.item h3{margin:0 0 7px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><main class="wrap"><header class="head"><h1>إدارة التحدي اليومي</h1><p>أنشئي التحدي، حددي المستوى ووقت المشاركة، ثم انشريه لمشاركته مع التلاميذ.</p><div class="row"><button class="btn alt" id="newBtn">تحدٍّ جديد</button><button class="btn alt" id="refreshBtn">تحديث القائمة</button><a class="btn alt" href="./index.html" style="text-decoration:none">العودة إلى فضاء الأستاذة</a></div></header>
<div id="message" class="msg hidden"></div>
<section class="panel" id="editor"><h2 id="formTitle">إعداد تحدٍّ جديد</h2><div class="grid"><div><label>عنوان التحدي</label><input id="title" maxlength="180" placeholder="مثال: تحدي الزلازل"></div><div><label>المستوى المستهدف</label><select id="level"><option>الكل</option><option>السنة الأولى متوسط</option><option>السنة الثانية متوسط</option><option>السنة الثالثة متوسط</option><option>السنة الرابعة متوسط</option><option>السنة الأولى ثانوي</option></select></div><div><label>بداية المشاركة</label><input id="starts" type="datetime-local"></div><div><label>نهاية المشاركة</label><input id="ends" type="datetime-local"></div><div><label>المدة بالدقائق</label><input id="duration" type="number" min="1" max="180" value="10"></div></div><label>تعليمات التحدي</label><textarea id="description" placeholder="تعليمات مختصرة للتلاميذ"></textarea><div class="row" style="justify-content:space-between;margin-top:16px"><h2 style="margin:0">الأسئلة</h2><button class="btn alt" id="addQ">إضافة سؤال</button></div><div id="questions"></div><div class="row"><button class="btn" id="saveBtn">حفظ المسودة</button><button class="btn alt hidden" id="publishBtn">نشر التحدي</button><button class="btn warn hidden" id="cancelEdit">إلغاء التعديل</button></div></section>
<section class="panel"><h2>التحديات المحفوظة</h2><div id="list" class="muted">جارٍ التحميل…</div></section><section class="panel hidden" id="results"><h2>مشاركات التلاميذ</h2><div id="resultList"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/daily-challenge";const token=localStorage.getItem("tahadi_teacher_token");let questions=[],editingId=null,currentChallenge=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(t){$("message").textContent=t;$("message").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
async function call(action,data={}){if(!token)throw Error("جلسة الأستاذة غير موجودة. سجّلي الدخول إلى فضاء الأستاذة أولًا.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر تنفيذ العملية.");return d}
function addQuestion(q={}){const id=q.id||crypto.randomUUID();questions.push({...q,id});renderQuestions()}
function renderQuestions(){$("questions").innerHTML=questions.map((q,i)=>'<div class="q" data-id="'+esc(q.id)+'"><div class="row"><strong>السؤال '+(i+1)+'</strong><button class="btn warn" type="button" onclick="removeQ(\''+esc(q.id)+'\')">حذف</button></div><label>نص السؤال</label><textarea class="qt">'+esc(q.text||"")+'</textarea><div class="grid">'+[0,1,2,3].map(n=>'<div><label>الخيار '+(n+1)+'</label><input class="opt" value="'+esc((q.options||[])[n]||"")+'"></div>').join("")+'</div><label>الإجابة الصحيحة</label><select class="correct">'+[0,1,2,3].map(n=>'<option value="'+n+'" '+((q.options||[])[n]===q.correct_answer?"selected":"")+'>الخيار '+(n+1)+'</option>').join("")+'</select><label>النقاط</label><input class="points" type="number" min="1" max="10" value="'+(q.points||1)+'"></div>').join("")}
window.removeQ=id=>{questions=questions.filter(q=>q.id!==id);renderQuestions()};
function readQuestions(){return [...$("questions").children].map(el=>{const opts=[...el.querySelectorAll(".opt")].map(x=>x.value.trim()).filter(Boolean);const idx=Number(el.querySelector(".correct").value);return{id:el.dataset.id,text:el.querySelector(".qt").value,options:opts,correct_answer:opts[idx]||"",points:Number(el.querySelector(".points").value)||1}})}
function reset(){editingId=null;questions=[];$("title").value="";$("description").value="";$("level").value="الكل";$("starts").value="";$("ends").value="";$("duration").value=10;$("formTitle").textContent="إعداد تحدٍّ جديد";$("publishBtn").classList.add("hidden");$("cancelEdit").classList.add("hidden");renderQuestions();addQuestion()}
function dateValue(v){return v?new Date(v).toISOString().slice(0,16):""}
async function load(){try{const d=await call("teacher_list");$("list").innerHTML=d.items.length?d.items.map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><p class="muted">المستوى: '+esc(x.target_level)+' · الحالة: '+esc(x.status)+' · الأسئلة: '+(x.questions||[]).length+'</p><div class="row"><button class="btn alt" onclick="showResults(\''+x.id+'\')">المشاركات والنتائج</button>'+(x.status==="draft"?'<button class="btn alt" onclick="editChallenge(\''+x.id+'\')">تعديل</button><button class="btn" onclick="publishChallenge(\''+x.id+'\')">نشر</button>':'')+(x.status==="published"?'<button class="btn warn" onclick="closeChallenge(\''+x.id+'\')">إنهاء المشاركة</button>':'')+'</div></article>').join(""):'لا توجد تحديات محفوظة بعد.'}catch(e){$("list").textContent=e.message}}
window.editChallenge=id=>{call("teacher_list").then(d=>{const x=d.items.find(a=>a.id===id);if(!x)return;editingId=id;$("title").value=x.title;$("description").value=x.description||"";$("level").value=x.target_level;$("starts").value=dateValue(x.starts_at);$("ends").value=dateValue(x.ends_at);$("duration").value=x.duration_minutes;$("formTitle").textContent="تعديل مسودة التحدي";questions=(x.questions||[]).map(q=>({...q}));renderQuestions();$("publishBtn").classList.remove("hidden");$("cancelEdit").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"})}).catch(e=>message(e.message))};
window.publishChallenge=async id=>{if(!confirm("هل تريدين نشر هذا التحدي للتلاميذ؟"))return;try{await call("teacher_publish",{id});message("تم نشر التحدي.");load()}catch(e){message(e.message)}};
window.closeChallenge=async id=>{if(!confirm("إنهاء استقبال المشاركات في هذا التحدي؟"))return;try{await call("teacher_close",{id});message("تم إنهاء المشاركة.");load()}catch(e){message(e.message)}};
window.showResults=async id=>{try{const d=await call("teacher_submissions",{id});$("results").classList.remove("hidden");$("resultList").innerHTML=d.submissions.length?d.submissions.map((x,i)=>'<article class="item"><strong>'+(i+1)+'. '+esc(x.students?.full_name||"تلميذ")+'</strong><p>المستوى: '+esc(x.students?.level||"—")+' · النتيجة: '+x.score+'/'+x.max_score+'</p><p class="muted">وقت الإرسال: '+new Date(x.submitted_at).toLocaleString("ar-DZ")+'</p><button class="btn alt" onclick="setWinner(\''+id+'\',\''+x.id+'\')">اعتماد فائز التحدي</button></article>').join(""):'لم تصل مشاركات بعد.';$("results").scrollIntoView({behavior:"smooth"})}catch(e){message(e.message)}};
window.setWinner=async(id,submission_id)=>{if(!confirm("اعتماد هذا التلميذ فائزًا بالتحدي؟"))return;try{await call("teacher_winner",{id,submission_id});message("تم اعتماد الفائز.");}catch(e){message(e.message)}};
$("addQ").onclick=()=>addQuestion();$("newBtn").onclick=reset;$("refreshBtn").onclick=load;$("cancelEdit").onclick=reset;
$("saveBtn").onclick=async()=>{try{const d=await call("teacher_save",{id:editingId,title:$("title").value,description:$("description").value,target_level:$("level").value,starts_at:$("starts").value?new Date($("starts").value).toISOString():null,ends_at:$("ends").value?new Date($("ends").value).toISOString():null,duration_minutes:Number($("duration").value),questions:readQuestions()});editingId=d.item.id;$("publishBtn").classList.remove("hidden");$("cancelEdit").classList.remove("hidden");message("حُفظت المسودة بنجاح. يمكنك نشرها بعد مراجعتها.");load()}catch(e){message(e.message)}};
$("publishBtn").onclick=()=>publishChallenge(editingId);reset();load();
</script></body></html>
