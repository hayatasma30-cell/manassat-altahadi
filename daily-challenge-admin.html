<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التحدي اليومي | منصة التحدي</title><style>
:root{--g:#14532d;--g2:#166534;--bg:#faf8ee;--line:#e3e9dc;--ink:#18382a;--muted:#69786d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.wrap{max-width:1120px;margin:auto;padding:18px}.head,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px #153d2010}.head{background:linear-gradient(115deg,#fff9e7,#edf7e9);border-color:#dce8d8}.head h1{font-size:clamp(20px,4vw,27px);margin:0 0 8px;color:var(--g)}h2{font-size:18px;margin:0 0 14px}p{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:14px;font-weight:bold;margin:10px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7ca;border-radius:12px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:75px;resize:vertical}.q{border:1px solid var(--line);padding:14px;border-radius:16px;margin:12px 0;background:linear-gradient(145deg,#fff,#fbfff9)}.btn{border:1px solid #1b6a3c;border-bottom:4px solid #0d4223;border-radius:13px;padding:9px 14px;font:inherit;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#1c7440,#14532d);color:white;margin:5px 3px;box-shadow:0 4px 0 #1b6b3520,0 7px 13px #173f2215}.btn.alt{background:linear-gradient(145deg,#fff,#eaf5e8);color:#14532d;border-color:#b8d2b5;border-bottom-color:#67996a;box-shadow:0 4px 0 #1b6b3518}.btn.warn{background:linear-gradient(135deg,#b65a46,#923c2d);border-color:#a54c36;border-bottom-color:#783625}.muted{color:var(--muted);font-size:13px}.msg{padding:10px;border-radius:12px;background:#edf5e9;margin:10px 0;white-space:pre-wrap}.item{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:linear-gradient(145deg,#fff,#fbfff9);box-shadow:0 4px 12px #153d2009}.item h3{margin:0 0 7px;font-size:16px;color:var(--g)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}a{color:var(--g)}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:11px}.head,.panel{border-radius:17px;padding:14px}}
body.embed{background:transparent}
body.embed .wrap{max-width:none;padding:0;margin:0}
body.embed .head{display:none!important}
body.embed .panel{margin:0 0 10px;padding:14px;border-radius:16px;box-shadow:none}
body.embed #editor,body.embed #list,body.embed #results{display:none!important}
body.embed #editor.embed-active,body.embed #list.embed-active,body.embed #results.embed-active{display:block!important}
body.embed .grid{gap:8px}
body.embed label{margin:7px 0 4px}
body.embed input,body.embed select,body.embed textarea{min-height:38px;padding:8px 10px}
body.embed .q{padding:10px;margin:8px 0}
body.embed .q textarea{min-height:52px}
body.embed .btn{font-size:13px;padding:8px 12px}
body.embed .wrap{overflow:visible}
body.embed .panel{border:1px solid #e3e9dc;background:#fff;overflow:visible}
body.embed #formTitle{display:none!important}
body.embed #editor{padding:16px 15px 18px;margin:0;border:1px solid #e1e9df;border-radius:17px;background:#fff}
body.embed #editor .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.embed #editor>label{display:block;margin-top:13px}
body.embed #editor .row:has(>#addQ){align-items:center;padding-bottom:8px;border-bottom:1px solid #edf1e9}
body.embed #questions{display:grid;gap:12px;margin-top:12px}
body.embed .q{border:1px solid #dce7d9;border-radius:15px;background:#fbfdf9;padding:13px;box-shadow:0 3px 10px #153d2008}
body.embed .q>.row{justify-content:space-between;padding-bottom:8px;border-bottom:1px solid #e9efe6}
body.embed .q>.row strong{color:#14532d;font-size:15px}
body.embed .q .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
body.embed .q input,body.embed .q select,body.embed .q textarea{background:#fff}
body.embed #editor>.row:last-child{position:static;display:flex;gap:9px;padding-top:14px;margin-top:16px;border-top:1px solid #e9efe6}
body.embed #editor>.row:last-child .btn{flex:1;min-height:44px}
body.embed #message{margin:8px 0 12px}
@media(max-width:600px){
 body.embed .panel{padding:12px!important}
 body.embed #editor{padding:13px 11px 16px!important}
 body.embed #editor .grid,body.embed .q .grid{grid-template-columns:1fr!important}
 body.embed .q{padding:11px!important;margin:0!important}
 body.embed .q>.row strong{font-size:14px}
 body.embed .q .btn.warn{min-height:36px;padding:7px 13px}
 body.embed #editor .row:has(>#addQ){justify-content:space-between!important}
 body.embed #addQ{min-height:40px;padding:8px 13px}
 body.embed #editor>.row:last-child{flex-wrap:wrap}
 body.embed #editor>.row:last-child .btn{flex:1 1 42%;font-size:13px}
 body.embed textarea{min-height:76px}
}


/* تحسين العرض على الهاتف وتوحيد المسافات مع فضاء الأستاذة */
.wrap{max-width:1120px;padding:12px}
.head{padding:15px 18px;border-radius:19px}
.head p{margin:4px 0 10px;font-size:14px;color:#526c58}
.panel{padding:15px 17px;border-radius:18px}
label{margin:8px 0 5px;font-size:13px}
input,select,textarea{padding:9px 11px;min-height:42px;border-radius:11px}
textarea{min-height:64px}
.q{padding:11px;margin:9px 0;border-radius:14px}
.q label{margin:7px 0 4px}
.q textarea{min-height:58px}
.grid{gap:9px}
.btn{min-height:38px;padding:8px 13px;margin:4px 2px}
.item{padding:12px;margin:8px 0}
#editor h2{margin-bottom:10px}
#editor .row{gap:6px}
@media(max-width:600px){
 .wrap{padding:9px}
 .head,.panel{padding:12px;border-radius:15px;margin-bottom:10px}
 .head h1{font-size:19px}
 .head p{font-size:12px;line-height:1.55}
 label{margin:7px 0 4px;font-size:12px}
 input,select,textarea{padding:8px 10px;min-height:39px;font-size:14px}
 textarea{min-height:56px}
 .grid{gap:7px}
 .q{padding:9px;margin:8px 0}
 .q textarea{min-height:52px}
 .btn{min-height:35px;padding:7px 10px;font-size:12px}

 #editor{scroll-margin-top:8px}

</style></head><body><script>if(new URLSearchParams(location.search).get("embed")==="1")document.body.classList.add("embed");</script><main class="wrap"><header class="head"><h1>إدارة التحدي اليومي</h1><p>أنشئي التحدي، حددي المستوى ووقت المشاركة، ثم انشريه لمشاركته مع التلاميذ.</p><div class="row"><button class="btn alt" id="newBtn">تحدٍّ جديد</button><button class="btn alt" id="refreshBtn">تحديث القائمة</button><a class="btn alt" href="./index.html" style="text-decoration:none">العودة إلى فضاء الأستاذة</a></div></header>
<div id="message" class="msg hidden"></div>
<section class="panel" id="editor"><h2 id="formTitle">إعداد تحدٍّ جديد</h2><div class="grid"><div><label>عنوان التحدي</label><input id="title" maxlength="180" placeholder="مثال: تحدي الزلازل"></div><div><label>المستوى المستهدف</label><select id="level"><option>الكل</option><option>السنة الأولى متوسط</option><option>السنة الثانية متوسط</option><option>السنة الثالثة متوسط</option><option>السنة الرابعة متوسط</option><option>السنة الأولى ثانوي</option></select></div><div><label>بداية المشاركة</label><input id="starts" type="datetime-local"></div><div><label>نهاية المشاركة</label><input id="ends" type="datetime-local"></div><div><label>المدة بالدقائق</label><input id="duration" type="number" min="1" max="180" value="10"></div></div><label>تعليمات التحدي</label><textarea id="description" placeholder="تعليمات مختصرة للتلاميذ"></textarea><div class="row" style="justify-content:space-between;margin-top:16px"><h2 style="margin:0">الأسئلة</h2><button class="btn alt" id="addQ">إضافة سؤال</button></div><div id="questions"></div><div class="row"><button class="btn" id="saveBtn">حفظ المسودة</button><button class="btn alt hidden" id="publishBtn">نشر التحدي</button><button class="btn warn hidden" id="cancelEdit">إلغاء التعديل</button></div></section>
<section class="panel" id="list"><div class="row" style="justify-content:space-between"><h2>مكتبة التحديات</h2><button class="btn alt" type="button" id="newFromLibrary">➕ تحدٍّ جديد</button></div><div id="challengeListItems" class="muted">جارٍ التحميل…</div></section><section class="panel hidden" id="results"><div class="row" style="justify-content:space-between"><h2>مشاركات التلاميذ</h2><button class="btn alt" type="button" id="backToChallengeList">← العودة إلى المكتبة</button></div><div id="resultList"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/daily-challenge";const token=localStorage.getItem("tahadi_teacher_token");let questions=[],editingId=null,currentChallenge=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(t){$("message").textContent=t;$("message").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
async function call(action,data={}){if(!token)throw Error("جلسة الأستاذة غير موجودة. سجّلي الدخول إلى فضاء الأستاذة أولًا.");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNobnNqeGh6b2libHVhY210dmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjI0NzgsImV4cCI6MjEwNzk5ODQ3OH0.uEnFziN-EAu0t5F3tox639Tg3jzEMUhkuVrhD4tzvbE","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر تنفيذ العملية.");return d}
function addQuestion(q={}){const id=q.id||crypto.randomUUID();questions.push({...q,id});renderQuestions()}
function fitEmbeddedFrame(){if(!document.body.classList.contains("embed")||!window.frameElement)return;requestAnimationFrame(()=>{const content=document.querySelector(".wrap");const h=content?Math.ceil(content.getBoundingClientRect().height):220;window.frameElement.style.height=Math.max(180,h+12)+"px";});}
function renderQuestions(){$("questions").innerHTML=questions.map((q,i)=>'<div class="q" data-id="'+esc(q.id)+'"><div class="row"><strong>السؤال '+(i+1)+'</strong><button class="btn warn" type="button" onclick="removeQ(\''+esc(q.id)+'\')">حذف</button></div><label>نص السؤال</label><textarea class="qt">'+esc(q.text||"")+'</textarea><div class="grid">'+[0,1,2,3].map(n=>'<div><label>الخيار '+(n+1)+'</label><input class="opt" value="'+esc((q.options||[])[n]||"")+'"></div>').join("")+'</div><label>الإجابة الصحيحة</label><select class="correct">'+[0,1,2,3].map(n=>'<option value="'+n+'" '+((q.options||[])[n]===q.correct_answer?"selected":"")+'>الخيار '+(n+1)+'</option>').join("")+'</select><label>النقاط</label><input class="points" type="number" min="1" max="10" value="'+(q.points||1)+'"></div>').join("")}
window.removeQ=id=>{questions=questions.filter(q=>q.id!==id);renderQuestions()};
function readQuestions(){return [...$("questions").children].map(el=>{const opts=[...el.querySelectorAll(".opt")].map(x=>x.value.trim()).filter(Boolean);const idx=Number(el.querySelector(".correct").value);return{id:el.dataset.id,text:el.querySelector(".qt").value,options:opts,correct_answer:opts[idx]||"",points:Number(el.querySelector(".points").value)||1}})}
function setEmbedPanel(page){if(!document.body.classList.contains("embed"))return;["editor","list","results"].forEach(id=>$(id).classList.toggle("embed-active",id===page));if(location.hash!=="#"+page)history.replaceState(null,"",location.pathname+location.search+"#"+page);fitEmbeddedFrame();}
function reset(){editingId=null;questions=[];$("title").value="";$("description").value="";$("level").value="الكل";$("starts").value="";$("ends").value="";$("duration").value=10;$("formTitle").textContent="إعداد تحدٍّ جديد";$("publishBtn").classList.add("hidden");$("cancelEdit").classList.add("hidden");renderQuestions();addQuestion()}
function dateValue(v){return v?new Date(v).toISOString().slice(0,16):""}
async function load(){try{const d=await call("teacher_list");$("challengeListItems").innerHTML=d.items.length?d.items.map(x=>'<article class="item"><h3>'+esc(x.title)+'</h3><p class="muted">المستوى: '+esc(x.target_level)+' · الحالة: '+esc(x.status)+' · الأسئلة: '+(x.questions||[]).length+'</p><div class="row"><button class="btn alt" onclick="showResults(\''+x.id+'\')">المشاركات والنتائج</button>'+(x.status==="draft"?'<button class="btn alt" onclick="editChallenge(\''+x.id+'\')">تعديل</button><button class="btn" onclick="publishChallenge(\''+x.id+'\')">نشر</button>':'')+(x.status==="published"?'<button class="btn warn" onclick="closeChallenge(\''+x.id+'\')">إنهاء المشاركة</button>':'')+'</div></article>').join(""):'لا توجد تحديات محفوظة بعد.'}catch(e){$("challengeListItems").textContent=e.message}}
window.editChallenge=id=>{call("teacher_list").then(d=>{const x=d.items.find(a=>a.id===id);if(!x)return;setEmbedPanel("editor");$("results").classList.add("hidden");editingId=id;$("title").value=x.title;$("description").value=x.description||"";$("level").value=x.target_level;$("starts").value=dateValue(x.starts_at);$("ends").value=dateValue(x.ends_at);$("duration").value=x.duration_minutes;$("formTitle").textContent="تعديل مسودة التحدي";questions=(x.questions||[]).map(q=>({...q}));renderQuestions();$("publishBtn").classList.remove("hidden");$("cancelEdit").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"})}).catch(e=>message(e.message))};
window.publishChallenge=async id=>{if(!confirm("هل تريدين نشر هذا التحدي للتلاميذ؟"))return;try{await call("teacher_publish",{id});message("تم نشر التحدي.");load()}catch(e){message(e.message)}};
window.closeChallenge=async id=>{if(!confirm("إنهاء استقبال المشاركات في هذا التحدي؟"))return;try{await call("teacher_close",{id});message("تم إنهاء المشاركة.");load()}catch(e){message(e.message)}};
window.showResults=async id=>{try{const d=await call("teacher_submissions",{id});$("results").classList.remove("hidden");setEmbedPanel("results");$("resultList").innerHTML=d.submissions.length?d.submissions.map((x,i)=>'<article class="item"><strong>'+(i+1)+'. '+esc(x.students?.full_name||"تلميذ")+'</strong><p>المستوى: '+esc(x.students?.level||"—")+' · النتيجة: '+x.score+'/'+x.max_score+'</p><p class="muted">وقت الإرسال: '+new Date(x.submitted_at).toLocaleString("ar-DZ")+'</p><button class="btn alt" onclick="setWinner(\''+id+'\',\''+x.id+'\')">اعتماد فائز التحدي</button></article>').join(""):'لم تصل مشاركات بعد.';$("results").scrollIntoView({behavior:"smooth"})}catch(e){message(e.message)}};
window.setWinner=async(id,submission_id)=>{if(!confirm("اعتماد هذا التلميذ فائزًا بالتحدي؟"))return;try{await call("teacher_winner",{id,submission_id});message("تم اعتماد الفائز.");}catch(e){message(e.message)}};
$("addQ").onclick=()=>addQuestion();$("newBtn").onclick=()=>{setEmbedPanel("editor");$("results").classList.add("hidden");reset()};$("newFromLibrary").onclick=()=>{setEmbedPanel("editor");reset()};$("backToChallengeList").onclick=()=>{ $("results").classList.add("hidden");setEmbedPanel("list");load()};$("refreshBtn").onclick=load;$("cancelEdit").onclick=reset;
$("saveBtn").onclick=async()=>{try{const d=await call("teacher_save",{id:editingId,title:$("title").value,description:$("description").value,target_level:$("level").value,starts_at:$("starts").value?new Date($("starts").value).toISOString():null,ends_at:$("ends").value?new Date($("ends").value).toISOString():null,duration_minutes:Number($("duration").value),questions:readQuestions()});editingId=d.item.id;$("publishBtn").classList.remove("hidden");$("cancelEdit").classList.remove("hidden");message("حُفظت المسودة بنجاح. يمكنك نشرها بعد مراجعتها.");load()}catch(e){message(e.message)}};
$("publishBtn").onclick=()=>publishChallenge(editingId);if(document.body.classList.contains("embed")){
  const page=location.hash==="#editor"?"editor":location.hash==="#results"?"results":"list";
  $("results").classList.add("hidden");
  setEmbedPanel(page);
}
reset();load();
if(location.hash){setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:"smooth",block:"start"}),250)}
if(document.body.classList.contains("embed")&&"ResizeObserver" in window){const ro=new ResizeObserver(fitEmbeddedFrame);ro.observe(document.body);window.addEventListener("load",fitEmbeddedFrame);setTimeout(fitEmbeddedFrame,100);setTimeout(fitEmbeddedFrame,500);}
</script></body></html>
