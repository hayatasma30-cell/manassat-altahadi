<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>تفاصيل الحصة | منصة التحدي</title>
<style>
:root{--g:#14532d;--g2:#1d7045;--cream:#faf8ee;--ink:#18382a;--muted:#718075;--line:#e1e9dc;--pale:#f0f7ee}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{background:linear-gradient(120deg,#103f28,var(--g2));color:#fff;padding:17px 18px}
header .inner,main{max-width:760px;margin:auto}header strong{font-size:1.05rem}
main{padding:18px 15px 36px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--g);text-decoration:none;font-weight:700;margin:3px 0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 7px 22px #173d250d}
.eyebrow{font-size:.8rem;color:#6a866f;font-weight:700}.title{font-size:1.35rem;color:var(--g);margin:5px 0 14px}
.status{display:inline-block;background:#eaf5e8;color:#246342;border-radius:20px;padding:4px 11px;font-size:.78rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.item{padding:10px 12px;border:1px solid #e4ebe0;border-radius:11px;background:#fbfdf9;min-width:0}
.item.wide{grid-column:1/-1}.label{display:block;color:#7a897d;font-size:.72rem;margin-bottom:2px}.value{font-weight:700;font-size:.94rem;overflow-wrap:anywhere}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:7px}.item{padding:9px}.value{font-size:.87rem}}
.btn{display:inline-flex;justify-content:center;align-items:center;text-decoration:none;border:0;border-radius:12px;padding:11px 15px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.primary{background:var(--g);color:#fff}.secondary{background:#edf5eb;color:var(--g);border:1px solid #d4e4d1}
.notice{padding:13px;background:#fff8e8;border:1px solid #efdfb8;border-radius:13px;color:#725b25;font-size:.87rem}
@media(max-width:480px){main{padding:14px 12px}.panel{padding:14px}.grid{gap:8px}.item{padding:9px}.title{font-size:1.18rem}}
</style>
<style id="lesson-zoom-entry-v2">
.zoom-entry{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;margin-top:12px;padding:11px 15px;border:1px solid #2d8050;border-bottom:5px solid #0c482b;border-radius:13px;background:linear-gradient(180deg,#27834e,#14532d);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 3px 0 #0c482b,0 7px 12px #174b3020}
.zoom-entry:active{transform:translateY(3px);border-bottom-width:2px}
.zoom-missing{margin-top:12px;padding:11px 13px;border:1px solid #eadfbf;border-radius:12px;background:#fff9e9;color:#755d27;font-size:.84rem}
</style>
<style id="lesson-details-clean-v3">
#lessonPanel{border-radius:17px;padding:16px}
#lessonPanel .title{margin-bottom:8px}
#lessonPanel .eyebrow{margin-bottom:2px}
#lessonDetails .item{box-shadow:none}
#lessonDetails .item.wide{background:#f7faf5}
.zoom-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:53px;margin:0 0 10px;padding:12px 15px;border:1px solid #2c8050;border-bottom:5px solid #0b4529;border-radius:13px;background:linear-gradient(180deg,#27834e,#14532d);color:#fff;text-decoration:none;font-size:.95rem;font-weight:800;box-shadow:0 3px 0 #0c482b,0 7px 12px #174b3020}
.zoom-entry:active{transform:translateY(3px);border-bottom-width:2px}
.zoom-missing{margin:12px 0;padding:10px 12px;border:1px solid #eadfbf;border-radius:11px;background:#fff9e9;color:#755d27;font-size:.82rem}
#lessonActions .btn{min-height:45px;box-shadow:0 3px 0 #d6e5d2}
</style>
</head>
<body>
<header><div class="inner"><strong>منصة التحدي التعليمية · فضاء الأستاذة</strong></div></header>
<main>
<a class="back" href="index.html">→ العودة إلى فضاء الأستاذة</a>
<section class="panel" id="lessonPanel">
<div class="eyebrow">إدارة الحصص</div>
<h1 class="title">تفاصيل الحصة</h1>
<p class="notice" id="loadMessage">جارٍ تحميل تفاصيل الحصة…</p>
<div class="grid" id="lessonDetails" hidden></div>
<div class="actions" id="lessonActions" hidden>
<button class="btn secondary" type="button" id="editLessonButton">✏️ تعديل الحصة</button>
<a class="btn primary" href="index.html">العودة إلى لوحة الأستاذة</a>

</div>
</section>
</main>
<script>
(function(){
 const box=document.getElementById("lessonDetails"),msg=document.getElementById("loadMessage"),actions=document.getElementById("lessonActions");
 const esc=s=>String(s??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 let lesson=null;
 try{lesson=JSON.parse(sessionStorage.getItem("tahadi_selected_lesson")||"null");}catch(_){}
 const id=new URLSearchParams(location.search).get("id");
 const editButton=document.getElementById("editLessonButton");
 if(editButton)editButton.addEventListener("click",()=>{if(!lesson?.id){alert("تعذر تحديد رقم الحصة. عودي إلى بطاقة الحصة القادمة وافتحيها من جديد.");return;}location.href="index.html?edit_lesson="+encodeURIComponent(lesson.id);});
 if(!lesson||(id&&String(lesson.id||"")!==id)){
   msg.textContent="لم نعثر على بيانات الحصة في هذه الجلسة. عودي إلى فضاء الأستاذة وافتحي بطاقة الحصة القادمة من جديد.";
   return;
 }
 const date=lesson.lesson_date||"غير محدد",time=lesson.lesson_time||"غير محدد";
 const type=lesson.lesson_type==="فردية"?"حصة فردية":lesson.lesson_category==="دورة مراجعة"?"دورة مراجعة":"حصة جماعية";
 const mode=lesson.delivery_mode==="in_person"?"حضوري":lesson.delivery_mode==="zoom"?"عن بُعد (Zoom)":lesson.delivery_mode||"غير محدد";
 const fields=[
  ["نوع الحصة",type],["القسم / المستوى",lesson.level],["التاريخ",date],["التوقيت",time],
  ["طريقة التقديم",mode],["حالة الحصة",lesson.status],["التلميذ",lesson.student_name],
  ["المادة",lesson.subject],["التصنيف",lesson.lesson_category],["السعر",lesson.unit_price!=null?Number(lesson.unit_price).toLocaleString("fr-FR")+" دج":null],
  ["مدة الحصة",lesson.duration]
 ];
 if(lesson.notes)fields.push(["ملاحظات",lesson.notes,true]);
 box.innerHTML=fields.filter(x=>x[1]!==undefined&&x[1]!==null&&String(x[1]).trim()!=="").map(x=>'<div class="item '+(x[2]?"wide":"")+'"><span class="label">'+esc(x[0])+'</span><div class="value">'+esc(x[1])+'</div></div>').join("");
 msg.hidden=true;box.hidden=false;actions.hidden=false;
 if(lesson.delivery_mode==="zoom"){
   const raw=String(lesson.zoom_link||"").trim();
   let safeUrl="";try{const parsedUrl=new URL(raw);if(parsedUrl.protocol==="https:")safeUrl=parsedUrl.href;}catch(_){}
   if(safeUrl){
     const zoom=document.createElement("a");zoom.className="zoom-entry";zoom.href=safeUrl;zoom.target="_blank";zoom.rel="noopener noreferrer";zoom.setAttribute("aria-label","الدخول إلى الحصة عبر Zoom");zoom.innerHTML='<span aria-hidden="true">🎥</span><span>الدخول إلى الحصة عبر Zoom</span><span aria-hidden="true">←</span>';actions.insertBefore(zoom,actions.firstChild);
   }else{
     const missing=document.createElement("p");missing.className="zoom-missing";missing.textContent="أضيفي رابط Zoom للحصة من إدارة الحصص ليظهر زر الدخول هنا.";actions.parentNode.insertBefore(missing,actions);
   }
 }
 document.querySelector(".title").textContent=type+" — "+(lesson.level||lesson.student_name||"تفاصيل الحصة");
})();
</script>

<script src="./workspace-autosave.js" defer></script>
</body>
</html>
