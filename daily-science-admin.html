<body><header><div class="header-inner"><b>🌿 منصة التحدي | تعلّم اليوم</b><div>معلومات علمية يومية، منظمة وسهلة الإدارة</div></div></header><main class="wrap">
<div class="toolbar"><button class="btn" onclick="try{localStorage.removeItem('tahadi_last_teacher_external_page')}catch(e){}location.href='index.html'">← العودة إلى فضاء الأستاذة</button><button class="btn hide" id="menuBtn" type="button" onclick="location.href='daily-science-admin.html'">⌂ القائمة الرئيسية</button></div>
<section class="box" id="homeMenu"><h2>تعلّم اليوم</h2><div class="menu-grid">
<button class="menu-btn" type="button" onclick="location.href='daily-science-admin.html?view=add'"><span class="menu-icon">✚</span><span class="menu-copy"><strong>إضافة معلومة</strong><small>إدخال معلومة علمية جديدة</small></span><span class="menu-chevron">‹</span></button>
<button class="menu-btn" type="button" onclick="location.href='daily-science-admin.html?view=library'"><span class="menu-icon">📚</span><span class="menu-copy"><strong>مكتبة المعلومات</strong><small>عرض المعلومات وتعديلها</small></span><span class="menu-chevron">‹</span></button>
</div></section>
<section class="box hide" id="today"><h2>معلومة اليوم</h2><div id="todayContent">جارٍ التحميل…</div></section>
<section class="box hide" id="editor">
<h2>إضافة معلومة علمية</h2>
<div class="editor-section"><div class="editor-section-title">1. تعريف المعلومة</div>
<label class="field" for="title">عنوان المعلومة</label><input id="title" placeholder="اكتبي عنوانًا مختصرًا وواضحًا">
<input id="infoDate" type="hidden">
<label class="field" for="topic">الموضوع العلمي</label>
<select id="topic"><option value="">اختاري موضوعًا</option></select>
<div class="toolbar topic-add-row"><input id="newTopic" placeholder="إضافة موضوع علمي جديد"><button class="btn" id="addTopicBtn" type="button">＋ إضافة موضوع</button></div>
</div>
<div class="editor-section"><div class="editor-section-title">2. تحديد الجمهور المستهدف</div>
<div class="editor-grid">
<div><label class="field" for="targetLevel">المستوى الدراسي</label><select id="targetLevel"><option value="">اختاري المستوى</option><option>السنة الأولى متوسط</option><option>السنة الثانية متوسط</option><option>السنة الثالثة متوسط</option><option>السنة الرابعة متوسط</option><option>السنة الثانية ثانوي — علوم تجريبية</option><option value="الكل">كل المستويات</option></select></div>
<div><label class="field" for="targetAudience">الفئة</label><select id="targetAudience"><option value="">اختاري الفئة</option><option>حصص فردية</option><option>حصص جماعية</option><option>حصص فردية وجماعية</option><option>الكل</option><option>دورة المراجعة</option></select></div>
</div>
<div id="cycleWrap" class="hide"><label class="field" for="reviewCycle">الدورة</label><select id="reviewCycle"><option value="">اختاري الدورة</option><option>الدورة الأولى</option><option>الدورة الثانية</option><option>الدورة الثالثة</option><option>الدورة الرابعة</option></select></div>
</div>
<div class="editor-section"><div class="editor-section-title">3. المحتوى العلمي</div>
<label class="field" for="dailyInfo">المعلومة العلمية</label><textarea id="dailyInfo" class="science-editor" placeholder="اكتبي المعلومة العلمية كاملة، مع تنظيمها في فقرات عند الحاجة..."></textarea>
<label class="field" for="question">السؤال الموجّه للتلميذ</label><textarea id="question" class="question-editor" placeholder="اكتبي سؤالًا واضحًا مرتبطًا بالمعلومة، يساعد التلميذ على الفهم والتحليل..."></textarea>
</div>
<div class="editor-publish"><label><input id="published" type="checkbox" checked> نشر المعلومة للتلاميذ</label><span>يمكنك معاينتها قبل النشر.</span></div>
<div class="toolbar editor-actions"><button class="btn" id="previewDraftBtn" type="button">👁 معاينة</button><button class="btn primary" id="saveBtn" type="button">حفظ ونشر</button><button class="btn hide" id="cancelEditBtn" type="button">إلغاء التعديل</button></div>
<p id="status" class="status"></p></section>
<section class="box hide" id="library"><h2>📚 مكتبة المعلومات العلمية</h2><div id="libraryStats" class="library-stats"></div><div class="library-tools"><input id="search" placeholder="ابحثي في العنوان أو الموضوع أو نص المعلومة"><select id="topicFilter"><option value="">كل الموضوعات</option></select><select id="levelFilter"><option value="">كل المستويات</option></select><select id="audienceFilter"><option value="">كل الفئات</option></select><select id="statusFilter"><option value="">كل الحالات</option><option value="published">منشورة</option><option value="draft">مسودة / مخفية</option></select></div><div id="libraryCount" class="library-count"></div><div id="cards"></div></section><div id="previewOverlay" class="preview-overlay hide" style="position:fixed;inset:0;background:#102d1fcc;z-index:9999;display:grid;place-items:center;padding:16px"><div style="width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:18px"><h2 id="previewTitle"></h2><div class="item-meta" id="previewMeta"></div><h3>المعلومة العلمية</h3><p id="previewInfo" style="white-space:pre-wrap;line-height:1.9"></p><h3>السؤال</h3><p id="previewQuestion" style="white-space:pre-wrap;line-height:1.9"></p><button class="btn" type="button" id="closePreview">إغلاق المعاينة</button></div></div>
</main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",token=localStorage.getItem("tahadi_teacher_token")||"",teacher=true,$=id=>document.getElementById(id);let facts=[],topics=[],editingFactId="";
try{localStorage.setItem("tahadi_last_teacher_external_page",location.pathname+location.search)}catch(e){}
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function localDateValue(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
const dailyDraftKey="tahadi_daily_science_unsent_draft_v1";
const dailyDraftFields=["title","infoDate","topic","targetLevel","targetAudience","reviewCycle","dailyInfo","question","published"];
let dailyDraftTimer=0;
function saveDailyScienceDraft(){
 try{
  const editor=$("editor");
  if(!editor||editor.classList.contains("hide"))return;
  const values={};
  dailyDraftFields.forEach(id=>{const el=$(id);if(el)values[id]=el.type==="checkbox"?el.checked:el.value});
  localStorage.setItem(dailyDraftKey,JSON.stringify({savedAt:Date.now(),values,editorOpen:true,scrollY:window.scrollY||0,editingFactId:editingFactId||""}));
 }catch(e){console.warn("تعذر حفظ مسودة المعلومة",e)}
}
function queueDailyScienceDraft(){clearTimeout(dailyDraftTimer);dailyDraftTimer=setTimeout(saveDailyScienceDraft,120)}
function restoreDailyScienceDraft(){
 try{
  const raw=localStorage.getItem(dailyDraftKey);if(!raw)return false;
  const draft=JSON.parse(raw);if(!draft||!draft.values||Date.now()-Number(draft.savedAt||0)>30*86400000){localStorage.removeItem(dailyDraftKey);return false}
  const values=draft.values;
  dailyDraftFields.forEach(id=>{const el=$(id);if(!el||!(id in values))return;if(el.type==="checkbox")el.checked=!!values[id];else el.value=values[id]??""});
  editingFactId=draft.editingFactId||"";
  $("cycleWrap").classList.toggle("hide",$("targetAudience").value!=="دورة المراجعة");
  $("editor").classList.remove("hide");
  if(editingFactId){$("saveBtn").textContent="حفظ التعديلات";$("cancelEditBtn").classList.remove("hide");$("editor").querySelector("h2").textContent="تعديل المعلومة العلمية"}
  else{$("saveBtn").textContent="حفظ ونشر";$("cancelEditBtn").classList.add("hide");$("editor").querySelector("h2").textContent="إضافة معلومة علمية"}
  $("status").textContent="استُعيدت مسودتك تلقائيًا. لم تُنشر بعد؛ أكملي العمل ثم اضغطي حفظ ونشر.";
  requestAnimationFrame(()=>window.scrollTo({top:Math.max(0,Number(draft.scrollY)||0),behavior:"auto"}));
  return true;
 }catch(e){console.warn("تعذر استرجاع مسودة المعلومة",e);return false}
}
window.restoreDailyScienceDraft=restoreDailyScienceDraft;
dailyDraftFields.forEach(id=>{const el=$(id);if(el){el.addEventListener("input",queueDailyScienceDraft);el.addEventListener("change",queueDailyScienceDraft)}});
window.addEventListener("pagehide",saveDailyScienceDraft);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveDailyScienceDraft()});

function cleanLeadingTitle(value,title){const text=String(value??"");const lines=text.split(/\r?\n/);if(lines.length&&lines[0].trim().replace(/[：:：.!؟]+$/g,"")===String(title??"").trim().replace(/[：:：.!؟]+$/g,""))return lines.slice(1).join("\n").replace(/^\n/,"");return text}
function card(x){
 const info=cleanLeadingTitle(x.daily_information,x.title),pub=x.is_published!==false;
 return '<article class="item"><div class="item-meta"><span class="tag">📚 '+esc(x.topic||"دون تصنيف")+'</span><span class="tag">📅 '+esc(x.info_date||"")+'</span>'+(x.target_level?'<span class="tag">'+esc(x.target_level)+'</span>':'')+'<span class="tag '+(pub?'publish-tag':'draft-tag')+'">'+(pub?'✓ منشورة':'◷ مسودة / مخفية')+'</span></div><h3>'+esc(x.title||"معلومة علمية")+'</h3><section class="item-section"><b class="section-label">المعلومة العلمية</b><p>'+esc(info)+'</p></section><section class="item-section question-section"><b class="section-label">السؤال</b><p>'+esc(x.scientific_question)+'</p></section><div class="toolbar item-actions"><button class="btn" type="button" data-edit-fact="'+esc(x.id)+'">✏️ تعديل</button><button class="btn" type="button" data-toggle-publish="'+esc(x.id)+'">'+(pub?'إخفاء':'نشر')+'</button><button class="btn delete-btn" type="button" data-delete-fact="'+esc(x.id)+'">🗑 حذف</button></div></article>';
}
function draw(){facts.sort((a,b)=>String(b.info_date).localeCompare(String(a.info_date)));$("todayContent").innerHTML=facts.length?card(facts[0]):'<div class="empty-state">لا توجد معلومة منشورة بعد.</div>';refreshLibrary()}
function drawStats(){const total=facts.length,published=facts.filter(x=>x.is_published!==false).length,drafts=total-published;$("libraryStats").innerHTML='<div class="stat-tile"><strong>'+total+'</strong><span>إجمالي المعلومات</span></div><div class="stat-tile"><strong>'+published+'</strong><span>منشورة</span></div><div class="stat-tile"><strong>'+drafts+'</strong><span>مسودة / مخفية</span></div>'}
function fillLibraryFilters(){const sets=[["levelFilter",[...new Set(facts.map(x=>x.target_level).filter(Boolean))],"كل المستويات"],["audienceFilter",[...new Set(facts.map(x=>x.target_audience).filter(Boolean))],"كل الفئات"]];for(const [id,values,label] of sets){const el=$(id),selected=el.value;el.innerHTML='<option value="">'+label+'</option>'+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");el.value=selected}}
function filter(){const q=$("search").value.trim().toLowerCase(),topic=$("topicFilter").value,level=$("levelFilter").value,audience=$("audienceFilter").value,status=$("statusFilter").value,a=facts.filter(x=>(!topic||x.topic===topic)&&(!level||x.target_level===level)&&(!audience||x.target_audience===audience)&&(!status||(status==="published"?x.is_published!==false:x.is_published===false))&&[x.title,x.topic,x.daily_information,x.scientific_question,x.target_level,x.target_audience].join(" ").toLowerCase().includes(q));$("cards").innerHTML=a.map(card).join("")||'<div class="empty-state">لا توجد معلومات مطابقة لبحثك.</div>';$("libraryCount").textContent="عدد المعلومات المعروضة: "+a.length+" من أصل "+facts.length}
function refreshLibrary(){drawStats();fillLibraryFilters();filter()}
const dailyLastViewKey="tahadi_daily_science_last_view_v1";
const requestedView=new URLSearchParams(location.search).get("view");
const allowedViews=["home","add","library","today"];
const savedView=localStorage.getItem(dailyLastViewKey)||"home";
const pageView=allowedViews.includes(requestedView)?requestedView:(allowedViews.includes(savedView)?savedView:"home");
localStorage.setItem(dailyLastViewKey,pageView);
function setPageView(){
 $("homeMenu").classList.toggle("hide",pageView!=="home");
 $("today").classList.toggle("hide",pageView!=="today");
 $("library").classList.toggle("hide",pageView!=="library");
 $("editor").classList.toggle("hide",pageView!=="add");
 if(pageView==="add")$("editor").classList.remove("hide");
 $("menuBtn").classList.toggle("hide",pageView==="home");
}
async function load(){try{const d=await call("daily_science_list");facts=d.items||[];topics=d.topics||[];fillTopics();if(pageView==="add"){const editId=new URLSearchParams(location.search).get("edit");if(editId)editFact(editId);else if(!restoreDailyScienceDraft())resetEditor();}draw()}catch(e){$("todayContent").textContent=e.message}}
$("search").oninput=filter; ["topicFilter","levelFilter","audienceFilter","statusFilter"].forEach(id=>$(id).onchange=filter);
function resetEditor(){try{localStorage.removeItem(dailyDraftKey)}catch(e){}$("editor").classList.remove("hide");editingFactId="";$("title").value="";$("infoDate").value=localDateValue();$("topic").value="";$("targetLevel").value="";$("targetAudience").value="";$("reviewCycle").value="";$("cycleWrap").classList.add("hide");$("dailyInfo").value="";$("question").value="";$("published").checked=true;$("saveBtn").textContent="حفظ ونشر";$("cancelEditBtn").classList.add("hide");$("editor").querySelector("h2").textContent="إضافة معلومة علمية";$("status").textContent="";}
function editFact(id){const x=facts.find(y=>String(y.id)===String(id));if(!x)return;editingFactId=x.id;$("title").value=x.title||"";$("infoDate").value=x.info_date||"";$("topic").value=x.topic||"";$("targetLevel").value=x.target_level||"الكل";$("targetAudience").value=x.target_audience||"الكل";$("reviewCycle").value=x.review_cycle||"";$("cycleWrap").classList.toggle("hide",$("targetAudience").value!=="دورة المراجعة");$("dailyInfo").value=x.daily_information||"";$("question").value=x.scientific_question||"";$("published").checked=x.is_published!==false;$("saveBtn").textContent="حفظ التعديلات";$("cancelEditBtn").classList.remove("hide");$("editor").querySelector("h2").textContent="تعديل المعلومة العلمية";$("status").textContent="تعدّلين الآن: "+(x.title||"معلومة علمية");$("editor").classList.remove("hide");$("editor").scrollIntoView({behavior:"smooth",block:"start"});}
$("cancelEditBtn").onclick=()=>{location.href="daily-science-admin.html?view=library"};
async function handleFactActions(e){const toggle=e.target.closest("[data-toggle-publish]"),edit=e.target.closest("[data-edit-fact]"),del=e.target.closest("[data-delete-fact]");if(toggle){const x=facts.find(y=>String(y.id)===String(toggle.dataset.togglePublish));if(!x)return;toggle.disabled=true;try{const d=await call("daily_science_save",{id:x.id,title:x.title||"",info_date:x.info_date||localDateValue(),topic:x.topic||"",scientific_question:x.scientific_question||"",scientific_problem:x.scientific_problem||"",explanation:x.explanation||"",conclusion:x.conclusion||"",daily_information:x.daily_information||"",target_level:x.target_level||"الكل",target_audience:x.target_audience||"الكل",review_cycle:x.review_cycle||"",is_published:x.is_published===false});await load();$("status").textContent=d.message||"تم تحديث حالة النشر.";}catch(err){alert(err.message);toggle.disabled=false;}return;}if(edit){location.href="daily-science-admin.html?view=add&edit="+encodeURIComponent(edit.dataset.editFact);return;}if(del){const x=facts.find(y=>String(y.id)===String(del.dataset.deleteFact));if(!x||!confirm("هل تريدين حذف هذه المعلومة نهائيًا؟\\n"+(x.title||"")))return;del.disabled=true;try{const d=await call("daily_science_delete",{id:x.id});$("status").textContent=d.message||"تم حذف المعلومة.";await load();}catch(err){alert(err.message);del.disabled=false;}}}
$("cards").addEventListener("click",handleFactActions);$("todayContent").addEventListener("click",handleFactActions);
$("addTopicBtn").onclick=async()=>{try{const title=$("newTopic").value.trim();if(!title)throw Error("اكتبي اسم الموضوع.");const d=await call("daily_science_topic_save",{title});topics.unshift(d.topic);fillTopics();$("topic").value=d.topic.title;$("newTopic").value="";$("status").textContent=d.message}catch(e){$("status").textContent=e.message}};
function fillTopics(){$("topic").innerHTML='<option value="">اختاري موضوعًا</option>'+topics.map(t=>'<option value="'+esc(t.title)+'">'+esc(t.title)+'</option>').join("");const tf=$("topicFilter");if(tf){const selected=tf.value;tf.innerHTML='<option value="">كل الموضوعات</option>'+topics.map(t=>'<option value="'+esc(t.title)+'">'+esc(t.title)+'</option>').join("");tf.value=selected}}
$("targetAudience").onchange=()=>{$("cycleWrap").classList.toggle("hide",$("targetAudience").value!=="دورة المراجعة")};
$("previewDraftBtn").onclick=()=>{$("previewTitle").textContent=$("title").value.trim()||"معلومة علمية";$("previewMeta").innerHTML='<span class="tag">'+esc($("topic").value||"دون تصنيف")+'</span><span class="tag">'+esc($("targetLevel").value||"")+"</span>";$("previewInfo").textContent=$("dailyInfo").value||"لم تُكتب المعلومة بعد.";$("previewQuestion").textContent=$("question").value||"لم يُكتب السؤال بعد.";$("previewOverlay").classList.remove("hide")};$("closePreview").onclick=()=>$("previewOverlay").classList.add("hide");$("previewOverlay").addEventListener("click",e=>{if(e.target.id==="previewOverlay")$("previewOverlay").classList.add("hide")});
$("saveBtn").onclick=async()=>{try{if(!$("topic").value)throw Error("اختاري موضوعًا قبل الحفظ.");if(!$("targetLevel").value)throw Error("حددي المستوى.");if(!$("targetAudience").value)throw Error("اختاري الفئة.");if($("targetAudience").value==="دورة المراجعة"&&!$("reviewCycle").value)throw Error("اختاري دورة المراجعة.");if(!$("dailyInfo").value.trim()||!$("question").value.trim())throw Error("اكتبي المعلومة والسؤال.");const d=await call("daily_science_save",{id:editingFactId||undefined,title:$("title").value,info_date:$("infoDate").value,topic:$("topic").value,scientific_question:$("question").value,scientific_problem:"",explanation:"",conclusion:"",daily_information:$("dailyInfo").value,target_level:$("targetLevel").value,target_audience:$("targetAudience").value,review_cycle:$("reviewCycle").value,is_published:$("published").checked});$("status").textContent=d.message;try{localStorage.removeItem(dailyDraftKey)}catch(e){}location.href="daily-science-admin.html?view=library"}catch(e){$("status").textContent=e.message}};
setPageView();$("infoDate").value=localDateValue();if(!token){$("todayContent").textContent="يلزم تسجيل الدخول إلى فضاء الأستاذة.";$("homeMenu").innerHTML="<p>يلزم تسجيل الدخول إلى فضاء الأستاذة أولًا.</p>";}else{load();}
</script>
<script>
window.openDailyScienceEditor=function(){location.href="daily-science-admin.html?view=add"};
</script>
<script src="./workspace-autosave.js" defer></script>
</body></html>
