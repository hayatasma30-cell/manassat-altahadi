<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>إدارة تعلّم اليوم | منصة التحدي</title>
<style>
:root{--green:#14532d;--green2:#217747;--ink:#18382a;--muted:#718075;--cream:#f8f6eb;--line:#e2e9dc;--pale:#edf6e9;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.85 Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#103f28,#17653a);color:#fff;padding:18px 20px;box-shadow:0 5px 18px #103f281c}
.header-inner{max-width:980px;margin:auto}
header b{display:block;font-size:1.25rem}
header div{color:#e0eee1;font-size:.92rem;margin-top:3px}
.wrap{max-width:980px;margin:auto;padding:18px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #cbdcc8;border-bottom:4px solid #b7cbb1;border-radius:14px;padding:9px 15px;background:#fff;color:var(--green);box-shadow:0 4px 10px #173f2210;font:inherit;font-weight:700;cursor:pointer;min-height:42px;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 5px #173f2210}
.primary{background:linear-gradient(135deg,#217747,#14532d);border-color:#267b49;border-bottom-color:#0d4223;color:#fff}
.hide{display:none!important}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(15px,3vw,24px);margin:16px 0;box-shadow:0 6px 0 #dfe8d8,0 12px 28px #173f2209}
.box h2{font-size:1.25rem;color:var(--green);margin:0 0 16px}
#today{margin-top:20px}
#todayContent:empty:before{content:"لا توجد معلومة منشورة بعد.";color:var(--muted)}
.item{background:linear-gradient(150deg,#fff 0%,#fcfdf9 100%);border:1px solid #dfe8dc;border-radius:18px;padding:clamp(13px,2.7vw,19px);margin:10px 0;box-shadow:0 4px 12px #173f2208}
.item h3{font-size:1.08rem;color:#174b2e;margin:10px 0 13px;padding-bottom:9px;border-bottom:1px solid #edf1e9}
.item-section{margin:12px 0 15px}
.section-label{display:block;color:#245b39;font-size:.98rem;margin-bottom:4px}
.item .item-section p{white-space:pre-wrap;overflow-wrap:anywhere;text-align:right;margin:0;line-height:1.95}
.question-section{padding-top:10px;border-top:1px dashed #e3eadf}
.delete-btn{color:#9f3038;border-color:#e5caca;border-bottom-color:#d8b8b8}
.item p{white-space:pre-wrap;overflow-wrap:anywhere;text-align:right;margin:8px 0;line-height:1.95}
.item p b{color:#245b39}
.tag{display:inline-flex;align-items:center;gap:5px;background:#edf6e9;color:#285c39;border:1px solid #dcebd8;border-radius:999px;padding:4px 11px;font-size:.82rem}
.item-meta{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.item-actions{border-top:1px solid #edf1e9;padding-top:10px;margin-top:10px;justify-content:flex-start}
.item-actions .btn{min-height:38px;padding:7px 13px;font-size:.9rem}
.field{display:block;margin:13px 0 5px;font-weight:700;color:#244b34}
input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink);font:inherit;min-height:44px}
input:focus,textarea:focus,select:focus{outline:2px solid #b7d8b8;outline-offset:1px}
textarea{min-height:190px;line-height:2;resize:vertical;padding:14px!important;white-space:pre-wrap}
#dailyInfo,#question{min-height:190px}
#published{width:auto;min-height:0;accent-color:var(--green)}
.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.editor-grid .full{grid-column:1/-1}
#search{margin:5px 0 12px}
.library-tools{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(170px,.8fr);gap:10px;margin-bottom:10px}
.library-count{font-size:.85rem;color:var(--muted);margin:5px 0 12px}
.status{background:#f3f6ed;border:1px solid #e1e9d9;border-radius:12px;padding:9px 12px;color:#35533d;min-height:40px}
#addTopicBtn{white-space:nowrap}
#newTopic{flex:1;min-width:150px}
.empty-state{padding:20px;text-align:center;color:var(--muted);background:#fafcf8;border:1px dashed #d6e2d2;border-radius:14px}
@media(max-width:600px){.wrap{padding:12px}.toolbar>.btn{flex:1 1 auto}.editor-grid,.library-tools{grid-template-columns:1fr}.box{border-radius:18px}.item{border-radius:16px}.item-actions{justify-content:flex-start}.item-actions .btn{min-width:105px;flex:0 0 auto}.item h3{margin:8px 0 11px}.item-section{margin:10px 0 13px}.item .item-section p{line-height:1.9}}
</style></head>
<body><header><b>💡 تعلّم اليوم</b><div>معلومة علمية يومية ومكتبة منظّمة حسب الموضوع</div></header><main class="wrap">
<div class="toolbar"><button class="btn" onclick="location.href='index.html'">← العودة إلى فضاء الأستاذة</button><button class="btn" id="libraryBtn">📚 مكتبة المعلومات</button><button class="btn primary hide" id="addBtn">＋ إضافة معلومة</button></div>
<section class="box" id="today"><h2>معلومة اليوم</h2><div id="todayContent">جارٍ التحميل…</div></section>
<section class="box hide" id="editor"><h2>إضافة معلومة علمية</h2><label class="field">العنوان</label><input id="title"><input id="infoDate" type="hidden"><label class="field">الموضوع</label><select id="topic" style="width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit"><option value="">اختاري موضوعًا</option></select><div class="toolbar"><input id="newTopic" placeholder="اكتبي اسم موضوع جديد" style="flex:1"><button class="btn" id="addTopicBtn" type="button">＋ إضافة موضوع</button></div><label class="field">تحديد المستوى</label><select id="targetLevel" style="width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit"><option value="">اختاري المستوى</option><option>السنة الأولى متوسط</option><option>السنة الثانية متوسط</option><option>السنة الثالثة متوسط</option><option>السنة الرابعة متوسط</option><option>السنة الثانية ثانوي — علوم تجريبية</option><option value="الكل">كل المستويات</option></select><label class="field">اختيار الفئة</label><select id="targetAudience" style="width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit"><option value="">اختاري الفئة</option><option>حصص فردية</option><option>حصص جماعية</option><option>حصص فردية وجماعية</option><option>الكل</option><option>دورة المراجعة</option></select><div id="cycleWrap" class="hide"><label class="field">اختيار الدورة</label><select id="reviewCycle" style="width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit"><option value="">اختاري الدورة</option><option>الدورة الأولى</option><option>الدورة الثانية</option><option>الدورة الثالثة</option><option>الدورة الرابعة</option></select></div><label class="field">المعلومة</label><textarea id="dailyInfo" placeholder="اكتبي المعلومة العلمية هنا"></textarea><label class="field">السؤال</label><textarea id="question" placeholder="اكتبي السؤال المرتبط بالمعلومة هنا"></textarea><p><label><input id="published" type="checkbox" checked style="width:auto"> نشر المعلومة للتلاميذ</label></p><div class="toolbar"><button class="btn primary" id="saveBtn">حفظ ونشر</button><button class="btn hide" id="cancelEditBtn" type="button">إلغاء التعديل</button></div><p id="status" class="status"></p></section>
<section class="box hide" id="library"><h2>📚 مكتبة المعلومات العلمية</h2><div class="library-tools"><input id="search" placeholder="ابحثي في العنوان أو الموضوع أو نص المعلومة"><select id="topicFilter" aria-label="تصفية حسب الموضوع"><option value="">كل الموضوعات</option></select></div><div id="libraryCount" class="library-count"></div><div id="cards"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",token=localStorage.getItem("tahadi_teacher_token")||"",teacher=true,$=id=>document.getElementById(id);let facts=[],topics=[],editingFactId="";
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function localDateValue(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function cleanLeadingTitle(value,title){const text=String(value??"");const lines=text.split(/\r?\n/);if(lines.length&&lines[0].trim().replace(/[：:：.!؟]+$/g,"")===String(title??"").trim().replace(/[：:：.!؟]+$/g,""))return lines.slice(1).join("\\n").replace(/^\\n/,"");return text}
function card(x){const info=cleanLeadingTitle(x.daily_information,x.title);return '<article class="item"><div class="item-meta"><span class="tag">📚 '+esc(x.topic||"دون تصنيف")+'</span><span class="tag">📅 '+esc(x.info_date||"")+'</span>'+(x.target_level?'<span class="tag">'+esc(x.target_level)+'</span>':'')+'</div><h3>'+esc(x.title||"معلومة علمية")+'</h3><section class="item-section"><b class="section-label">المعلومة العلمية</b><p>'+esc(info)+'</p></section><section class="item-section question-section"><b class="section-label">السؤال</b><p>'+esc(x.scientific_question)+'</p></section><div class="toolbar item-actions"><button class="btn" type="button" data-edit-fact="'+esc(x.id)+'">✏️ تعديل</button><button class="btn delete-btn" type="button" data-delete-fact="'+esc(x.id)+'">🗑 حذف</button></div></article>'}
function draw(){facts.sort((a,b)=>String(b.info_date).localeCompare(String(a.info_date)));$("todayContent").innerHTML=facts.length?card(facts[0]):'<div class="empty-state">لا توجد معلومة منشورة بعد.</div>';filter()}
function filter(){const q=$("search").value.trim().toLowerCase(),topic=$("topicFilter").value,a=facts.filter(x=>(!topic||x.topic===topic)&&[x.title,x.topic,x.daily_information,x.scientific_question,x.target_level].join(" ").toLowerCase().includes(q));$("cards").innerHTML=a.map(card).join("")||'<div class="empty-state">لا توجد معلومات مطابقة لبحثك.</div>';$("libraryCount").textContent="عدد المعلومات المعروضة: "+a.length+" من أصل "+facts.length}
async function load(){try{const d=await call("daily_science_list");facts=d.items||[];topics=d.topics||[];fillTopics();draw()}catch(e){$("todayContent").textContent=e.message}}
$("libraryBtn").onclick=()=>{$("library").classList.toggle("hide");$("today").classList.toggle("hide")};$("search").oninput=filter;$("topicFilter").onchange=filter;$("addBtn").onclick=()=>{resetEditor();$("editor").classList.toggle("hide")};
function resetEditor(){$("editor").classList.remove("hide");editingFactId="";$("title").value="";$("infoDate").value=localDateValue();$("topic").value="";$("targetLevel").value="";$("targetAudience").value="";$("reviewCycle").value="";$("cycleWrap").classList.add("hide");$("dailyInfo").value="";$("question").value="";$("published").checked=true;$("saveBtn").textContent="حفظ ونشر";$("cancelEditBtn").classList.add("hide");$("editor").querySelector("h2").textContent="إضافة معلومة علمية";$("status").textContent="";}
function editFact(id){const x=facts.find(y=>String(y.id)===String(id));if(!x)return;editingFactId=x.id;$("title").value=x.title||"";$("infoDate").value=x.info_date||"";$("topic").value=x.topic||"";$("targetLevel").value=x.target_level||"الكل";$("targetAudience").value=x.target_audience||"الكل";$("reviewCycle").value=x.review_cycle||"";$("cycleWrap").classList.toggle("hide",$("targetAudience").value!=="دورة المراجعة");$("dailyInfo").value=x.daily_information||"";$("question").value=x.scientific_question||"";$("published").checked=x.is_published!==false;$("saveBtn").textContent="حفظ التعديلات";$("cancelEditBtn").classList.remove("hide");$("editor").querySelector("h2").textContent="تعديل المعلومة العلمية";$("status").textContent="تعدّلين الآن: "+(x.title||"معلومة علمية");$("editor").classList.remove("hide");$("editor").scrollIntoView({behavior:"smooth",block:"start"});}
$("cancelEditBtn").onclick=resetEditor;
async function handleFactActions(e){const edit=e.target.closest("[data-edit-fact]"),del=e.target.closest("[data-delete-fact]");if(edit){editFact(edit.dataset.editFact);return;}if(del){const x=facts.find(y=>String(y.id)===String(del.dataset.deleteFact));if(!x||!confirm("هل تريدين حذف هذه المعلومة نهائيًا؟\\n"+(x.title||"")))return;del.disabled=true;try{const d=await call("daily_science_delete",{id:x.id});$("status").textContent=d.message||"تم حذف المعلومة.";await load();}catch(err){alert(err.message);del.disabled=false;}}}
$("cards").addEventListener("click",handleFactActions);$("todayContent").addEventListener("click",handleFactActions);
$("addTopicBtn").onclick=async()=>{try{const title=$("newTopic").value.trim();if(!title)throw Error("اكتبي اسم الموضوع.");const d=await call("daily_science_topic_save",{title});topics.unshift(d.topic);fillTopics();$("topic").value=d.topic.title;$("newTopic").value="";$("status").textContent=d.message}catch(e){$("status").textContent=e.message}};
function fillTopics(){$("topic").innerHTML='<option value="">اختاري موضوعًا</option>'+topics.map(t=>'<option value="'+esc(t.title)+'">'+esc(t.title)+'</option>').join("");const tf=$("topicFilter");if(tf){const selected=tf.value;tf.innerHTML='<option value="">كل الموضوعات</option>'+topics.map(t=>'<option value="'+esc(t.title)+'">'+esc(t.title)+'</option>').join("");tf.value=selected}}
$("targetAudience").onchange=()=>{$("cycleWrap").classList.toggle("hide",$("targetAudience").value!=="دورة المراجعة")};
$("saveBtn").onclick=async()=>{try{if(!$("topic").value)throw Error("اختاري موضوعًا قبل الحفظ.");if(!$("targetLevel").value)throw Error("حددي المستوى.");if(!$("targetAudience").value)throw Error("اختاري الفئة.");if($("targetAudience").value==="دورة المراجعة"&&!$("reviewCycle").value)throw Error("اختاري دورة المراجعة.");if(!$("dailyInfo").value.trim()||!$("question").value.trim())throw Error("اكتبي المعلومة والسؤال.");const d=await call("daily_science_save",{id:editingFactId||undefined,title:$("title").value,info_date:$("infoDate").value,topic:$("topic").value,scientific_question:$("question").value,scientific_problem:"",explanation:"",conclusion:"",daily_information:$("dailyInfo").value,target_level:$("targetLevel").value,target_audience:$("targetAudience").value,review_cycle:$("reviewCycle").value,is_published:$("published").checked});$("status").textContent=d.message;resetEditor();await load()}catch(e){$("status").textContent=e.message}};
$("addBtn").classList.remove("hide");$("infoDate").value=localDateValue();if(!token){$("todayContent").textContent="يلزم تسجيل الدخول إلى فضاء الأستاذة.";$("addBtn").classList.add("hide");}else{load();}
</script>
<script src="./workspace-autosave.js" defer></script>
</body></html>
