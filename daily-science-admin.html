<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>إدارة تعلّم اليوم | منصة التحدي</title>
<style>body{margin:0;background:#f7f6e9;color:#18382a;font:16px/1.8 Tahoma,Arial}header{background:linear-gradient(120deg,#103f28,#217747);color:#fff;padding:18px}.wrap{max-width:850px;margin:auto;padding:18px}.box,.item{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 5px 0 #dfe8d8}.btn{border:1px solid #cbdcc8;border-radius:12px;padding:10px 14px;background:#fff;color:#14532d;box-shadow:0 4px 0 #bfd0b9;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#217747;color:#fff}.hide{display:none!important}.field{display:block;margin:10px 0 4px;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit}textarea{min-height:75px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.tag{background:#eaf5e8;border-radius:20px;padding:4px 10px}.status{background:#f3f5eb;padding:8px}</style></head>
<body><header><b>💡 تعلّم اليوم</b><div>معلومة علمية يومية ومكتبة منظّمة حسب الموضوع</div></header><main class="wrap">
<div class="toolbar"><button class="btn" onclick="location.href='index.html'">← العودة إلى فضاء الأستاذة</button><button class="btn" id="libraryBtn">📚 مكتبة المعلومات</button><button class="btn primary hide" id="addBtn">＋ إضافة معلومة</button></div>
<section class="box" id="today"><h2>معلومة اليوم</h2><div id="todayContent">جارٍ التحميل…</div></section>
<section class="box hide" id="editor"><h2>إضافة معلومة علمية</h2><label class="field">العنوان</label><input id="title"><label class="field">التاريخ</label><input id="infoDate" type="date"><label class="field">الموضوع</label><select id="topic" style="width:100%;box-sizing:border-box;border:1px solid #cbd8c8;border-radius:10px;padding:10px;font:inherit"><option value="">اختاري موضوعًا</option></select><div class="toolbar"><input id="newTopic" placeholder="اكتبي اسم موضوع جديد" style="flex:1"><button class="btn" id="addTopicBtn" type="button">＋ إضافة موضوع</button></div><label class="field">السؤال العلمي</label><textarea id="question"></textarea><label class="field">المشكل العلمي المطروح</label><textarea id="problem"></textarea><label class="field">التفسير العلمي</label><textarea id="explanation"></textarea><label class="field">الاستنتاج</label><textarea id="conclusion"></textarea><label class="field">معلومة اليوم</label><textarea id="dailyInfo"></textarea><p><label><input id="published" type="checkbox" checked style="width:auto"> نشر المعلومة للتلاميذ</label></p><button class="btn primary" id="saveBtn">حفظ ونشر</button><p id="status" class="status"></p></section>
<section class="box hide" id="library"><h2>📚 مكتبة المعلومات العلمية</h2><input id="search" placeholder="بحث حسب العنوان أو الموضوع"><div id="cards"></div></section></main>
<script>
const API="https://chnsjxhzoibluacmtvbb.supabase.co/functions/v1/platform-access",token=localStorage.getItem("tahadi_teacher_token")||"",teacher=true,$=id=>document.getElementById(id);let facts=[],topics=[];
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"تعذر الاتصال بالمنصة.");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(x){return '<article class="item"><span class="tag">'+esc(x.topic)+' • '+esc(x.info_date)+'</span><h3>'+esc(x.title)+'</h3><p><b>السؤال العلمي:</b> '+esc(x.scientific_question)+'</p><p><b>المشكل العلمي المطروح:</b> '+esc(x.scientific_problem)+'</p><p><b>التفسير:</b> '+esc(x.explanation)+'</p><p><b>الاستنتاج:</b> '+esc(x.conclusion)+'</p><p><b>معلومة اليوم:</b> '+esc(x.daily_information)+'</p></article>'}
function draw(){facts.sort((a,b)=>String(b.info_date).localeCompare(String(a.info_date)));$("todayContent").innerHTML=facts.length?card(facts[0]):"لا توجد معلومة منشورة بعد.";filter()}
function filter(){const q=$("search").value.toLowerCase(),a=facts.filter(x=>(x.title+" "+x.topic).toLowerCase().includes(q));$("cards").innerHTML=a.map(card).join("")||"لا توجد معلومات مطابقة."}
async function load(){try{const d=await call("daily_science_list");facts=d.items||[];topics=d.topics||[];fillTopics();draw()}catch(e){$("todayContent").textContent=e.message}}
$("libraryBtn").onclick=()=>{$("library").classList.toggle("hide");$("today").classList.toggle("hide")};$("search").oninput=filter;$("addBtn").onclick=()=>$("editor").classList.toggle("hide");
$("addTopicBtn").onclick=async()=>{try{const title=$("newTopic").value.trim();if(!title)throw Error("اكتبي اسم الموضوع.");const d=await call("daily_science_topic_save",{title});topics.unshift(d.topic);fillTopics();$("topic").value=d.topic.title;$("newTopic").value="";$("status").textContent=d.message}catch(e){$("status").textContent=e.message}};
function fillTopics(){$("topic").innerHTML='<option value="">اختاري موضوعًا</option>'+topics.map(t=>'<option value="'+esc(t.title)+'">'+esc(t.title)+'</option>').join("")}
$("saveBtn").onclick=async()=>{try{if(!$("topic").value)throw Error("اختاري موضوعًا قبل الحفظ.");const d=await call("daily_science_save",{title:$("title").value,info_date:$("infoDate").value,topic:$("topic").value,scientific_question:$("question").value,scientific_problem:$("problem").value,explanation:$("explanation").value,conclusion:$("conclusion").value,daily_information:$("dailyInfo").value,is_published:$("published").checked});$("status").textContent=d.message;await load()}catch(e){$("status").textContent=e.message}};
$("addBtn").classList.remove("hide");$("infoDate").value=new Date().toISOString().slice(0,10);if(!token){$("todayContent").textContent="يلزم تسجيل الدخول إلى فضاء الأستاذة.";$("addBtn").classList.add("hide");}else{load();}
</script></body></html>
